<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IT Link Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf2f1;--surface:#fff;--ink:#14212e;--muted:#5d6b7a;--line:#d6dee7;--accent:#0b6e8a;--accent-ink:#fff;--tile:#e3f1f5;--danger:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181f;--surface:#18232d;--ink:#e8eef4;--muted:#94a3b1;--line:#2a3846;--accent:#4cc2de;--accent-ink:#06222b;--tile:#1f3440;--danger:#ff8a80}}
:root[data-theme="dark"]{--bg:#10181f;--surface:#18232d;--ink:#e8eef4;--muted:#94a3b1;--line:#2a3846;--accent:#4cc2de;--accent-ink:#06222b;--tile:#1f3440;--danger:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 16%,var(--bg)) 0%,var(--bg) 42%,color-mix(in srgb,#8fb89c 18%,var(--bg)) 100%) fixed,var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:28px 18px 130px}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:end;justify-content:space-between;margin-bottom:22px}
h1{font-size:1.9rem;font-weight:600;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:2px 0 0;font-size:.95rem}
.tools{display:flex;gap:10px;flex-wrap:wrap}
input,button{font:inherit;color:inherit}
.search{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:200px}
.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{position:relative;display:flex;gap:14px;align-items:center;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.ico{flex:none;width:52px;height:52px;border-radius:12px;background:var(--tile);display:grid;place-items:center;font-size:1.6rem;overflow:hidden}
.ico svg{width:48px;height:48px}
.txt{min-width:0}
.name{font-weight:600;overflow-wrap:anywhere}
.host{color:var(--muted);font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del{position:absolute;top:6px;right:6px;border:0;background:transparent;color:var(--muted);width:28px;height:28px;border-radius:8px;cursor:pointer;opacity:0;font-size:1rem}
.card:hover .del,.del:focus-visible{opacity:1}
.del:hover{color:var(--danger);background:var(--tile)}
@media (hover:none){.del{opacity:.7}}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:22px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 14px;font-size:1.2rem}
label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 4px}
dialog input[type=text],dialog input[type=url]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.icons{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.icons button{aspect-ratio:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;font-size:1.25rem;cursor:pointer}
.icons button[aria-pressed=true]{border-color:var(--accent);background:var(--tile);box-shadow:0 0 0 2px var(--accent)}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.err{color:var(--danger);font-size:.85rem;min-height:1.2em;margin-top:8px}

/* ---- ตัวการ์ตูนลิงน้อย น้องมูลด์ (มุมขวาล่าง) ---- */
.mascot-btn{position:fixed;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:6px;background:transparent;border:0;padding:0;cursor:pointer;user-select:none}
.mascot-btn[hidden],.chat[hidden]{display:none}
.speech-tag{background:var(--surface);color:var(--ink);border:2px solid #f59e0b;padding:8px 14px;border-radius:18px 18px 4px 18px;font-size:.9rem;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.15);transition:transform .2s;white-space:nowrap}
.mascot-wrap{position:relative;width:96px;height:96px;display:grid;place-items:center;filter:drop-shadow(0 8px 14px rgba(0,0,0,.22));animation:monkeyBounce 2.6s ease-in-out infinite;transition:transform .2s}
.mascot-wrap svg{width:96px;height:96px;overflow:visible}
.mascot-btn:hover .mascot-wrap{transform:scale(1.08)}
.mascot-btn:hover .speech-tag{transform:translateY(-4px)}

/* แอนิเมชันการขยับตัวของน้องลิง */
@keyframes monkeyBounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-5px)}
}
@keyframes waveHand{
  0%,100%{transform:rotate(0deg)}
  25%{transform:rotate(-18deg)}
  75%{transform:rotate(14deg)}
}
@keyframes wagTail{
  0%,100%{transform:rotate(0deg)}
  50%{transform:rotate(10deg)}
}
@keyframes tiltHead{
  0%,100%{transform:rotate(0deg)}
  50%{transform:rotate(-3.5deg)}
}
@keyframes blinkEye{
  0%,92%,100%{transform:scaleY(1)}
  96%{transform:scaleY(0.08)}
}
.mk-wave{transform-origin:62px 66px;animation:waveHand 1.1s ease-in-out infinite}
.mk-tail{transform-origin:42px 75px;animation:wagTail 2.2s ease-in-out infinite}
.mk-head{transform-origin:50px 52px;animation:tiltHead 3s ease-in-out infinite}
.mk-eyes{transform-origin:50px 41px;animation:blinkEye 4s infinite}

/* ---- กล่องแชต ---- */
.chat{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:21;width:min(390px,calc(100vw - 36px));height:min(560px,calc(100% - 36px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 44px rgba(0,0,0,.28);overflow:hidden}
.chat-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--tile);border-bottom:1px solid var(--line)}
.ttl{display:flex;align-items:center;gap:10px}
.head-ava{position:relative;width:44px;height:44px;border-radius:50%;background:#fff8eb;border:2px solid #f59e0b;display:grid;place-items:center;flex:none;overflow:hidden}
.head-ava svg{width:42px;height:42px}
.head-info{line-height:1.25}
.head-name{font-weight:600;font-size:.98rem}
.head-sub{font-size:.76rem;color:var(--muted);display:flex;align-items:center;gap:5px}
.head-sub::before{content:"";width:7px;height:7px;border-radius:50%;background:#22c55e;display:inline-block}
.chat-head button{border:0;background:transparent;font-size:1.15rem;cursor:pointer;color:var(--muted);width:32px;height:32px;border-radius:8px}
.chat-head button:hover{background:rgba(0,0,0,.06)}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg-row{display:flex;gap:8px;align-items:flex-end}
.msg-row.me{justify-content:flex-end}
.bot-ava{width:34px;height:34px;border-radius:50%;background:#fff8eb;border:1.5px solid #f59e0b;display:grid;place-items:center;flex:none;overflow:hidden}
.bot-ava svg{width:32px;height:32px}
.m{max-width:80%;padding:9px 13px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.94rem}
.m.bot{background:var(--tile);border-bottom-left-radius:4px}
.m.me{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.m a{color:var(--accent);font-weight:600;text-decoration:underline}
.m.me a{color:var(--accent-ink)}
.chat-in{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--surface)}
.chat-in input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>IT Link Hub</h1>
      <p class="sub">รวมลิงค์ที่ใช้งานประจำ คลิกเพื่อเปิดในแท็บใหม่</p>
    </div>
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="ค้นหาลิงค์…" aria-label="ค้นหาลิงค์">
      <button class="btn primary" id="add">+ เพิ่มลิงค์</button>
    </div>
  </header>
  <main class="grid" id="grid"></main>
</div>

<!-- ปุ่มตัวการ์ตูนลิงน้อย น้องมูลด์ ยืนโบกมือมุมขวาล่าง -->
<button class="mascot-btn" id="fab" type="button" aria-label="ถามน้องมูลด์">
  <span class="speech-tag">ถามน้องมูลด์ได้นะ 🍌</span>
  <span class="mascot-wrap" id="fab-ava"></span>
</button>

<!-- กล่องแชตน้องมูลด์ -->
<section class="chat" id="chat" hidden aria-label="แชตน้องมูลด์">
  <div class="chat-head">
    <div class="ttl">
      <div class="head-ava" id="head-ava"></div>
      <div class="head-info">
        <div class="head-name">น้องมูลด์ (เลขา IT)</div>
        <div class="head-sub">พร้อมช่วยเหลือจ้า 🐵</div>
      </div>
    </div>
    <button type="button" id="cx" aria-label="ปิดแชต">✕</button>
  </div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <form class="chat-in" id="cf">
    <input type="text" id="ci" placeholder="พิมพ์ถามน้องมูลด์ที่นี่…" autocomplete="off" aria-label="พิมพ์คำถาม">
    <button class="btn primary" type="submit" id="cs">ส่ง</button>
  </form>
</section>

<dialog id="dlg">
  <form method="dialog" id="f" novalidate>
    <h2>เพิ่มลิงค์ใหม่</h2>
    <label for="n">ชื่อ</label>
    <input type="text" id="n" maxlength="40" placeholder="เช่น Helpdesk Dashboard">
    <label for="u">URL</label>
    <input type="url" id="u" placeholder="https://…">
    <label>ไอคอน</label>
    <div class="icons" id="icons"></div>
    <div class="err" id="err" role="alert"></div>
    <div class="actions">
      <button type="button" class="btn" id="cancel">ยกเลิก</button>
      <button type="submit" class="btn primary">บันทึก</button>
    </div>
  </form>
</dialog>

<script>
// ฟังก์ชันสร้าง SVG ลิงน้อยเสื้อเหลือง "น้องมูลด์" (เลือกแสดงแบบเต็มตัวหรือเฉพาะใบหน้าได้)
function getMonkeySVG(faceOnly = false) {
  const vb = faceOnly ? "12 4 76 62" : "0 0 100 105";
  return `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <!-- เงาพื้น -->
    ${faceOnly ? "" : `<ellipse cx="52" cy="97" rx="18" ry="4" fill="rgba(0,0,0,0.12)"/>`}
    <!-- หางแกว่งได้ -->
    ${faceOnly ? "" : `<g class="mk-tail">
      <path d="M43 76 C22 76 24 34 15 34 C9 34 9 48 14 51" fill="none" stroke="#4a2e1b" stroke-width="5" stroke-linecap="round"/>
    </g>`}
    <!-- ขาและเท้า -->
    ${faceOnly ? "" : `<g>
      <path d="M45 77 L42 93" stroke="#4a2e1b" stroke-width="6.5" stroke-linecap="round"/>
      <path d="M57 77 L60 93" stroke="#4a2e1b" stroke-width="6.5" stroke-linecap="round"/>
      <ellipse cx="39" cy="95" rx="6.5" ry="3.2" fill="#f7c894" stroke="#4a2e1b" stroke-width="1.8"/>
      <ellipse cx="64" cy="95" rx="6.5" ry="3.2" fill="#f7c894" stroke="#4a2e1b" stroke-width="1.8"/>
    </g>`}
    <!-- แขนซ้ายเท้าเอว -->
    ${faceOnly ? "" : `<path d="M40 62 L34 70 L42 75" fill="none" stroke="#4a2e1b" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>`}
    <!-- แขนขวาโบกมือทักทาย -->
    ${faceOnly ? "" : `<g class="mk-wave">
      <path d="M60 62 L73 65 L80 57" fill="none" stroke="#4a2e1b" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="82" cy="55" r="4.5" fill="#f7c894" stroke="#4a2e1b" stroke-width="1.6"/>
      <path d="M80 52 L79 48 M83 51 L84 47 M85 53 L88 50 M85 56 L89 55" stroke="#f7c894" stroke-width="2.2" stroke-linecap="round"/>
    </g>`}
    <!-- เสื้อสีเหลืองสดใส -->
    ${faceOnly ? "" : `<path d="M36 60 L42 56 L60 56 L67 61 L63 66 L60 64 L61 78 L41 78 L42 64 L39 66 Z" fill="#ffd600" stroke="#4a2e1b" stroke-width="2" stroke-linejoin="round"/>`}
    <!-- ส่วนหัวและใบหน้าน้องลิง -->
    <g class="mk-head">
      <!-- หูซ้าย-ขวา -->
      <circle cx="22" cy="36" r="11" fill="#f7c894" stroke="#4a2e1b" stroke-width="2.4"/>
      <path d="M19 32 Q23 36 19 40" fill="none" stroke="#d59b66" stroke-width="2" stroke-linecap="round"/>
      <circle cx="78" cy="36" r="11" fill="#f7c894" stroke="#4a2e1b" stroke-width="2.4"/>
      <path d="M81 32 Q77 36 81 40" fill="none" stroke="#d59b66" stroke-width="2" stroke-linecap="round"/>
      <!-- กะโหลกศีรษะและปอยผม -->
      <path d="M48 16 C45 10 39 11 42 15 C45 12 49 8 54 15" fill="#4a2e1b" stroke="#4a2e1b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="50" cy="34" rx="22" ry="19" fill="#4a2e1b"/>
      <ellipse cx="50" cy="45" rx="23" ry="14" fill="#4a2e1b"/>
      <!-- กรอบหน้าสีเนื้ออมส้ม -->
      <path d="M33 34 C33 23 45 23 50 28 C55 23 67 23 67 34 C72 38 72 56 50 56 C28 56 28 38 33 34 Z" fill="#f7c894" stroke="#4a2e1b" stroke-width="1.8"/>
      <!-- ดวงตากะพริบได้ -->
      <g class="mk-eyes">
        <ellipse cx="43.5" cy="38.5" rx="2.8" ry="4" fill="#3b2212"/>
        <circle cx="42.8" cy="37" r="1.1" fill="#ffffff"/>
        <ellipse cx="56.5" cy="38.5" rx="2.8" ry="4" fill="#3b2212"/>
        <circle cx="55.8" cy="37" r="1.1" fill="#ffffff"/>
      </g>
      <!-- จมูก -->
      <ellipse cx="50" cy="43" rx="3.2" ry="1.6" fill="#4a2e1b"/>
      <line x1="50" y1="44.5" x2="50" y2="46.5" stroke="#4a2e1b" stroke-width="1.5"/>
      <!-- รอยยิ้มกว้างเห็นฟันขาว -->
      <path d="M37 47 Q50 50 63 47 C61 55 39 55 37 47 Z" fill="#ffffff" stroke="#4a2e1b" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
  </svg>`;
}

const KEY="it-link-hub:v1";
const ICONS=["🛠️","📊","📹","💻","🖥️","🖨️","🌐","📡","🔒","📁","📧","📝","🗓️","🧰","☁️","🔗"];
const AI={name:"ถามน้องมูลด์",url:"#chat",icon:"🐵"};
const DEFAULTS=[
  AI,
  {name:"Helpdesk Dashboard",url:"https://mouldmate.vercel.app/IT/Helpdesk/dashboard.html",icon:"🛠️"},
  {name:"Checklist CCTV",url:"https://mouldmate.vercel.app/IT/CCTV/ChecklistCCTV.html",icon:"📹"},
  {name:"Asset Register",url:"https://mouldmate.vercel.app/IT/Asset/asset-register.html",icon:"💻"}
];
let links=load(), icon=ICONS[0];
const $=id=>document.getElementById(id);

// ใส่รูปตัวการ์ตูนลิงน้อยในปุ่มมุมขวาล่าง (เต็มตัว) และหัวแชต (ซูมใบหน้า)
$("fab-ava").innerHTML = getMonkeySVG(false);
$("head-ava").innerHTML = getMonkeySVG(true);

function load(){
  try{
    const s=localStorage.getItem(KEY);
    if(s){
      const a=JSON.parse(s);
      if(Array.isArray(a)){
        if(!localStorage.getItem(KEY+":ai")&&!a.some(l=>l.name===AI.name)){
          a.unshift(AI);
          localStorage.setItem(KEY,JSON.stringify(a));
        }
        try{localStorage.setItem(KEY+":ai","1")}catch(e){}
        return a;
      }
    }
  }catch(e){}
  return DEFAULTS.slice();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(links))}catch(e){}}
function host(u){
  if(u==="#chat"||u.includes("claude.ai")) return "ผู้ช่วย AI ประจำฝ่าย IT";
  try{return new URL(u).hostname}catch(e){return u}
}

function openChat(){
  $("chat").hidden=false;
  $("fab").hidden=true;
  if(!$("msgs").children.length){
    addMsg("bot","สวัสดีจ้า น้องมูลด์เองนะ 🐵🍌 ถามอะไรก็ได้เลย จะให้ช่วยร่างข้อความ สรุปเรื่อง หรือหาลิงค์ในหน้านี้ก็บอกได้เลย");
  }
  $("ci").focus();
}

function render(){
  const q=$("q").value.trim().toLowerCase(), g=$("grid");
  g.textContent="";
  const shown=links.map((l,i)=>({l,i})).filter(({l})=>!q||(l.name+" "+l.url).toLowerCase().includes(q));
  if(!shown.length){
    const d=document.createElement("div");d.className="empty";
    d.textContent=links.length?"ไม่พบลิงค์ที่ตรงกับคำค้นหา":"ยังไม่มีลิงค์ กด “เพิ่มลิงค์” เพื่อเริ่มต้น";
    g.appendChild(d);return;
  }
  shown.forEach(({l,i})=>{
    const a=document.createElement("a");
    a.className="card";a.href=l.url;
    const isMould = l.url==="#chat"||l.name==="ถามน้องมูลด์";
    if(isMould){
      a.onclick=e=>{e.preventDefault();openChat()};
    }else{
      a.target="_blank";a.rel="noopener noreferrer";
    }
    const ic=document.createElement("div");ic.className="ico";
    if(isMould){
      ic.innerHTML = getMonkeySVG(true);
    }else{
      ic.textContent=l.icon;
    }
    const t=document.createElement("div");t.className="txt";
    const n=document.createElement("div");n.className="name";n.textContent=l.name;
    const h=document.createElement("div");h.className="host";h.textContent=host(l.url);
    t.append(n,h);
    const x=document.createElement("button");
    x.className="del";x.type="button";x.textContent="✕";x.setAttribute("aria-label","ลบ "+l.name);
    x.onclick=e=>{e.preventDefault();e.stopPropagation();
      if(confirm("ลบ “"+l.name+"” ออกจากรายการ?")){links.splice(i,1);save();render()}};
    a.append(ic,t,x);g.appendChild(a);
  });
}

function drawIcons(){
  const box=$("icons");box.textContent="";
  ICONS.forEach(e=>{
    const b=document.createElement("button");b.type="button";b.textContent=e;
    b.setAttribute("aria-pressed",e===icon);b.setAttribute("aria-label","ไอคอน "+e);
    b.onclick=()=>{icon=e;drawIcons()};box.appendChild(b);
  });
}

$("add").onclick=()=>{$("n").value="";$("u").value="";$("err").textContent="";icon=ICONS[0];drawIcons();$("dlg").showModal();$("n").focus()};
$("cancel").onclick=()=>$("dlg").close();
$("q").oninput=render;
$("f").onsubmit=e=>{
  e.preventDefault();
  let name=$("n").value.trim(), url=$("u").value.trim();
  if(url&&!/^https?:\/\//i.test(url))url="https://"+url;
  try{new URL(url)}catch(x){$("err").textContent="กรุณากรอก URL ให้ถูกต้อง";return}
  if(!name)name=host(url);
  links.push({name,url,icon});save();render();$("dlg").close();
};
render();

/* ---- เลขา IT (AI - เชื่อมต่อ /api/chat) ---- */
let hist=[], busy=false;

function setTextWithLinks(el, text){
  el.textContent="";
  const urlRegex=/(https?:\/\/[^\s]+)/g;
  const parts=String(text).split(urlRegex);
  parts.forEach(part=>{
    if(/^https?:\/\/[^\s]+$/.test(part)){
      const a=document.createElement("a");
      a.href=part;
      a.target="_blank";
      a.rel="noopener noreferrer";
      a.textContent=part;
      el.appendChild(a);
    }else{
      el.appendChild(document.createTextNode(part));
    }
  });
}

function addMsg(cls,text){
  const row=document.createElement("div");
  row.className="msg-row "+cls;

  if(cls==="bot"){
    const ava=document.createElement("div");
    ava.className="bot-ava";
    ava.innerHTML=getMonkeySVG(true);
    row.appendChild(ava);
  }

  const d=document.createElement("div");
  d.className="m "+cls;
  setTextWithLinks(d, text);
  row.appendChild(d);

  $("msgs").appendChild(row);
  $("msgs").scrollTop=1e9;
  return d;
}

async function ask(text){
  hist.push({role:"user",content:text});
  const bubble=addMsg("bot","กำลังคิดคำตอบแป๊บนึงนะ… 🍌");
  busy=true;
  $("cs").disabled=true;

  try{
    const cleanLinks=links
      .filter(l=>l.url&&l.url!=="#chat"&&!l.url.includes("claude.ai"))
      .map(l=>({name:l.name,url:l.url}));

    const res=await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        messages:hist.slice(-10),
        links:cleanLinks
      })
    });

    const data=await res.json().catch(()=>({}));

    if(!res.ok){
      hist.pop();
      if(res.status===429){
        bubble.textContent="ถามรัวเกินไปแล้วจ้า พักสักครู่แล้วลองถามใหม่นะ 😅";
      }else if(data.error==="missing_api_key"){
        bubble.textContent="ยังไม่ได้ตั้งค่า GROQ_API_KEY ในระบบ Vercel เลยจ้า";
      }else{
        bubble.textContent="ขออภัย ระบบขัดข้อง (" + res.status + "): " + (data.error || "ไม่ทราบสาเหตุ");
      }
    }else{
      setTextWithLinks(bubble, data.text);
      hist.push({role:"assistant",content:data.text});
    }
  }catch(e){
    hist.pop();
    bubble.textContent="เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ลองเช็กอินเทอร์เน็ตหรือลองใหม่อีกครั้งนะ";
  }

  busy=false;
  $("cs").disabled=false;
  $("ci").focus();
  $("msgs").scrollTop=1e9;
}

$("fab").onclick=openChat;
$("cx").onclick=()=>{$("chat").hidden=true;$("fab").hidden=false};
$("cf").onsubmit=e=>{
  e.preventDefault();
  const t=$("ci").value.trim();
  if(!t||busy)return;
  $("ci").value="";
  addMsg("me",t);
  ask(t);
};
</script>

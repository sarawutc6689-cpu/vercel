<style>
:root{
  color-scheme:dark;
  --bg:#0a0a0d;--bg-2:#101014;
  --surface:rgba(255,255,255,.04);--surface-2:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.08);--border-2:rgba(255,255,255,.14);
  --red:#e63946;--red-soft:#ff4d5e;--red-deep:#a4161a;
  --text:#f5f5f7;--text-dim:#a1a1aa;--text-3:#6b6b76;
  --green:#22c55e;--blue:#3b82f6;
  --sans:'Inter','Noto Sans Thai',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  font-family:var(--sans);background:var(--bg);color:var(--text);
  line-height:1.6;min-height:100vh;overflow-x:hidden;font-weight:400;
  display:flex;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));
  position:relative;-webkit-font-smoothing:antialiased;
}
.bg-gradient{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 60% at 50% -20%, rgba(230,57,70,.28), transparent 60%),
    radial-gradient(ellipse 60% 50% at 0% 100%, rgba(230,57,70,.12), transparent 60%),
    radial-gradient(ellipse 60% 50% at 100% 80%, rgba(60,60,90,.15), transparent 60%);
}
.bg-noise{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.025;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
.bg-orb{position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(80px);opacity:.5}
.bg-orb.o1{width:400px;height:400px;background:rgba(230,57,70,.35);top:-100px;right:-100px;animation:float1 12s ease-in-out infinite}
.bg-orb.o2{width:350px;height:350px;background:rgba(164,22,26,.25);bottom:-100px;left:-100px;animation:float2 14s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-30px,30px) scale(1.1)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-30px) scale(1.15)}}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{width:100%;max-width:420px;animation:up .8s cubic-bezier(.16,1,.3,1) both;position:relative;z-index:10}
.card{
  position:relative;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
  border:1px solid var(--border);border-radius:20px;
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  box-shadow:0 30px 60px -20px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.03) inset,0 1px 0 rgba(255,255,255,.08) inset;
  overflow:hidden;
}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent);opacity:.9}
.head{padding:40px 32px 28px;text-align:center;position:relative}
.head img{width:120px;height:auto;display:block;margin:0 auto 24px;filter:drop-shadow(0 4px 20px rgba(230,57,70,.4))}
.head h1{font-size:1.35rem;font-weight:600;letter-spacing:-.01em;line-height:1.35;color:var(--text)}
.head p{font-size:.85rem;color:var(--text-dim);margin-top:8px}
.body{padding:0 32px 32px}
.field{margin-bottom:18px}
.field label{display:block;font-size:.78rem;font-weight:500;color:var(--text-dim);margin-bottom:8px}
.input-wrap{position:relative}
.input-wrap>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--text-3);pointer-events:none;transition:stroke .2s}
.input-wrap:focus-within>svg{stroke:var(--red-soft)}
input{
  width:100%;padding:13px 14px 13px 44px;background:rgba(0,0,0,.25);
  border:1px solid var(--border);border-radius:10px;color:var(--text);font:400 15px var(--sans);
  transition:border-color .2s,background .2s,box-shadow .2s;
}
input::placeholder{color:var(--text-3);font-size:14px}
input:hover{border-color:var(--border-2)}
input:focus{outline:none;border-color:var(--red-soft);background:rgba(230,57,70,.04);box-shadow:0 0 0 4px rgba(230,57,70,.12)}
input.shake{animation:shake .35s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
button{
  width:100%;margin-top:10px;padding:14px 16px;
  background:linear-gradient(135deg,var(--red),var(--red-deep));
  color:#fff;border:none;border-radius:10px;font:600 .92rem var(--sans);letter-spacing:.01em;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .2s cubic-bezier(.16,1,.3,1);
  box-shadow:0 4px 14px rgba(230,57,70,.35),0 1px 0 rgba(255,255,255,.15) inset;
  position:relative;overflow:hidden;
}
button::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent,rgba(255,255,255,.15),transparent);transform:translateX(-100%);transition:transform .6s ease}
button:hover:not(:disabled)::before{transform:translateX(100%)}
button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 24px rgba(230,57,70,.5),0 1px 0 rgba(255,255,255,.15) inset}
button:active:not(:disabled){transform:translateY(0)}
button:focus-visible{outline:2px solid var(--red-soft);outline-offset:2px}
button:disabled{opacity:.85;cursor:default;transform:none}
button svg{width:18px;height:18px;stroke:#fff;flex-shrink:0}
.spin{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{display:none;margin-bottom:16px;padding:11px 14px;font-size:.85rem;border:1px solid var(--border);border-left:3px solid transparent;border-radius:8px;align-items:center;gap:10px;animation:up .3s both}
.msg svg{width:16px;height:16px;flex-shrink:0}
.msg.show{display:flex}
.msg.error{color:#ffb3b8;border-left-color:var(--red);background:rgba(230,57,70,.08)}
.msg.error svg{stroke:#ffb3b8}
.msg.ok{color:#86efac;border-left-color:var(--green);background:rgba(34,197,94,.08)}
.msg.ok svg{stroke:#86efac}
.msg.wait{color:#93c5fd;border-left-color:var(--blue);background:rgba(59,130,246,.08)}
.msg.wait svg{stroke:#93c5fd}
.help{text-align:center;margin-top:18px}
.help a{color:var(--text-dim);text-decoration:none;font-size:.82rem;font-weight:500;transition:color .2s}
.help a:hover{color:var(--red-soft)}
.foot{padding:16px 32px;text-align:center;color:var(--text-3);font-size:.72rem;letter-spacing:.02em;border-top:1px solid var(--border);background:rgba(0,0,0,.15)}
@media(max-width:460px){
  .head{padding:32px 24px 24px}.body{padding:0 24px 28px}.foot{padding:14px 24px}
  .head h1{font-size:1.2rem}.head img{width:100px}
}

/* CHATBOT */
.chat-toggle{
  position:fixed;bottom:24px;right:24px;z-index:100;width:58px;height:58px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--red),var(--red-deep));color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;margin-top:0;padding:0;
  box-shadow:0 8px 24px rgba(230,57,70,.45),0 1px 0 rgba(255,255,255,.2) inset;
  transition:all .3s cubic-bezier(.16,1,.3,1);animation:chatPulse 3s ease-in-out infinite;
}
.chat-toggle:hover{transform:scale(1.05) translateY(-2px);box-shadow:0 12px 32px rgba(230,57,70,.6)}
.chat-toggle:active{transform:scale(.98)}
.chat-toggle svg{width:26px;height:26px;stroke:#fff}
.chat-toggle.open svg.icon-chat{display:none}
.chat-toggle.open svg.icon-close{display:block}
.chat-toggle svg.icon-close{display:none}
@keyframes chatPulse{
  0%,100%{box-shadow:0 8px 24px rgba(230,57,70,.45),0 1px 0 rgba(255,255,255,.2) inset,0 0 0 0 rgba(230,57,70,.5)}
  50%{box-shadow:0 8px 24px rgba(230,57,70,.45),0 1px 0 rgba(255,255,255,.2) inset,0 0 0 12px rgba(230,57,70,0)}
}
.chat-toggle .badge{position:absolute;top:-2px;right:-2px;width:16px;height:16px;border-radius:50%;background:var(--green);border:2px solid var(--bg);display:none}
.chat-toggle .badge.show{display:block;animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}

.chat-panel{
  position:fixed;bottom:96px;right:24px;z-index:99;width:360px;max-width:calc(100vw - 32px);
  height:min(540px,calc(100vh - 140px));
  background:linear-gradient(180deg,rgba(20,20,26,.96),rgba(14,14,18,.96));
  border:1px solid var(--border-2);border-radius:16px;
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  box-shadow:0 30px 60px -20px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.03) inset;
  display:flex;flex-direction:column;overflow:hidden;
  opacity:0;transform:translateY(20px) scale(.95);pointer-events:none;
  transition:all .3s cubic-bezier(.16,1,.3,1);
}
.chat-panel.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.chat-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent)}
.chat-header{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.2)}
.chat-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--red-deep));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(230,57,70,.4);flex-shrink:0;position:relative}
.chat-avatar svg{width:20px;height:20px;stroke:#fff}
.chat-avatar::after{content:'';position:absolute;bottom:0;right:0;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid #16161c}
.chat-header-info{flex:1;min-width:0}
.chat-header-info b{display:block;font-size:.9rem;font-weight:600;color:var(--text);line-height:1.3}
.chat-header-info span{display:block;font-size:.72rem;color:var(--green);font-weight:500}
.chat-close{width:28px;height:28px;margin:0;padding:0;border-radius:6px;border:none;background:transparent;box-shadow:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:all .2s}
.chat-close:hover:not(:disabled){background:var(--surface-2);color:var(--text);transform:none;box-shadow:none}
.chat-close svg{width:16px;height:16px;stroke:currentColor}
.chat-body{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.chat-body::-webkit-scrollbar{width:6px}
.chat-body::-webkit-scrollbar-track{background:transparent}
.chat-body::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:3px}
.bubble{max-width:82%;padding:10px 14px;border-radius:14px;font-size:.85rem;line-height:1.55;animation:bubbleIn .35s cubic-bezier(.16,1,.3,1) both;word-wrap:break-word;white-space:pre-line}
@keyframes bubbleIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bubble.bot{align-self:flex-start;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-bottom-left-radius:4px}
.bubble.user{align-self:flex-end;background:linear-gradient(135deg,var(--red),var(--red-deep));color:#fff;border-bottom-right-radius:4px;box-shadow:0 4px 12px rgba(230,57,70,.3)}
.bubble.typing{display:flex;gap:4px;padding:12px 16px;align-items:center}
.bubble.typing .dot{width:7px;height:7px;border-radius:50%;background:var(--text-3);animation:typing 1.4s ease-in-out infinite}
.bubble.typing .dot:nth-child(2){animation-delay:.2s}
.bubble.typing .dot:nth-child(3){animation-delay:.4s}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.chat-quick{padding:0 16px 10px;display:flex;gap:6px;flex-wrap:wrap}
.chip{width:auto;margin:0;padding:6px 12px;background:var(--surface);border:1px solid var(--border-2);border-radius:16px;font:500 .75rem var(--sans);color:var(--text-dim);cursor:pointer;transition:all .2s;box-shadow:none;display:inline-block}
.chip::before{display:none}
.chip:hover:not(:disabled){background:rgba(230,57,70,.1);border-color:var(--red-soft);color:var(--red-soft);transform:none;box-shadow:none}
.chat-input{padding:12px 14px;border-top:1px solid var(--border);background:rgba(0,0,0,.2);display:flex;gap:8px;align-items:center}
.chat-input input{flex:1;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:20px;color:var(--text);font:400 14px var(--sans);transition:border-color .2s}
.chat-input input:focus{outline:none;border-color:var(--red-soft);box-shadow:0 0 0 3px rgba(230,57,70,.12)}
.chat-send{width:36px;height:36px;margin:0;padding:0;border-radius:50%;border:none;background:linear-gradient(135deg,var(--red),var(--red-deep));color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.chat-send:hover:not(:disabled){transform:scale(1.08);box-shadow:0 4px 14px rgba(230,57,70,.5)}
.chat-send:active:not(:disabled){transform:scale(.95)}
.chat-send svg{width:16px;height:16px;stroke:#fff}
@media(max-width:480px){
  .chat-panel{bottom:0;right:0;left:0;width:100%;max-width:100%;height:80vh;border-radius:16px 16px 0 0}
  .chat-toggle{bottom:20px;right:20px;width:54px;height:54px}
}
</style>
</head>

    alert:   '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>',
    clock:   '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
    ban:     '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M4.9 4.9l14.2 14.2"/></svg>'
  };

  // ข้อความทั้งหมดมาจากโค้ดเอง ใช้ textContent สำหรับข้อความเพื่อกัน XSS
  function showMsg(type, icon, text){
    msgEl.className = 'msg show ' + type;
    msgEl.innerHTML = ICONS[icon];
    const s = document.createElement('span');
    s.textContent = text;
    msgEl.appendChild(s);
  }
  function hideMsg(){ msgEl.className = 'msg'; msgEl.innerHTML = ''; }
  function shake(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
  function setBtnIcon(name){
    const old = btn.querySelector('svg');
    if (old) old.remove();
    btn.insertAdjacentHTML('afterbegin', ICONS[name]);
  }
  function setLoading(on){
    btn.disabled = on;
    btnLabel.textContent = on ? 'กำลังตรวจสอบ...' : 'เข้าสู่ระบบ';
    setBtnIcon(on ? 'spinner' : 'login');
  }

  // ═══ CHATBOT ═══
  const chatToggle = document.getElementById('chatToggle');
  const chatPanel  = document.getElementById('chatPanel');
  const chatClose  = document.getElementById('chatClose');
  const chatBody   = document.getElementById('chatBody');
  const chatInput  = document.getElementById('chatInput');
  const chatSend   = document.getElementById('chatSend');
  const chatQuick  = document.getElementById('chatQuick');
  const chatBadge  = document.getElementById('chatBadge');

  let isOpen = false;
  let hasGreeted = false;
  let isTyping = false;
  let wrongAttempts = 0;

  function addBubble(text, who){
    const el = document.createElement('div');
    el.className = 'bubble ' + who;
    el.textContent = text;
    chatBody.appendChild(el);
    chatBody.scrollTop = chatBody.scrollHeight;
    return el;
  }

  function showTyping(){
    const el = document.createElement('div');
    el.className = 'bubble bot typing';
    el.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
    chatBody.appendChild(el);
    chatBody.scrollTop = chatBody.scrollHeight;
    return el;
  }

  function botReply(text, delay){
    if (isTyping) return;
    isTyping = true;
    const typingEl = showTyping();
    const wait = delay != null ? delay : Math.min(1400, 400 + text.length * 12);
    setTimeout(() => {
      typingEl.remove();
      addBubble(text, 'bot');
      isTyping = false;
    }, wait);
  }

  function openChat(){
    isOpen = true;
    chatPanel.classList.add('open');
    chatToggle.classList.add('open');
    chatBadge.classList.remove('show');
    setTimeout(() => chatInput.focus(), 300);
    if (!hasGreeted){
      hasGreeted = true;
      botReply(
        'สวัสดีครับ 👋 ผมคือผู้ช่วยของระบบ MOULDMATE\n\n' +
        'ยินดีต้อนรับสู่ระบบล็อกอินพนักงาน TOKAISOLIDTIRE\n' +
        'หากต้องการความช่วยเหลือ กดปุ่มด้านล่างหรือพิมพ์ถามได้เลยครับ'
      );
    }
  }
  function closeChat(){
    isOpen = false;
    chatPanel.classList.remove('open');
    chatToggle.classList.remove('open');
  }
  chatToggle.addEventListener('click', () => isOpen ? closeChat() : openChat());
  chatClose.addEventListener('click', closeChat);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && isOpen) closeChat(); });

  // ═══ KNOWLEDGE BASE ═══
  // หมายเหตุ: ตรวจรายการเฉพาะเจาะจงก่อนรายการกว้าง (เช่น 'ดี', 'hi') เพื่อไม่ให้จับผิด
  const KB = [
    {
      keys: ['ล็อกอินไม่ได้', 'เข้าไม่ได้', 'error', 'ผิดพลาด', 'ไม่สำเร็จ'],
      reply:
        'หากเข้าใช้งานไม่ได้ ลองตรวจสอบดังนี้ครับ 🔍\n\n' +
        '1. ตรวจสอบรหัสพนักงานว่าถูกต้อง\n' +
        '2. ตรวจสอบวันที่เริ่มงาน (DDMMYYYY)\n' +
        '3. ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต\n' +
        '4. ลองรีเฟรชหน้าใหม่\n\n' +
        'หากกรอกผิดหลายครั้ง ระบบจะล็อกชั่วคราว 15 นาที หากยังไม่ได้กรุณาติดต่อ HR ครับ'
    },
    {
      keys: ['ลืมรหัส', 'ลืมรหัสผ่าน', 'จำรหัสไม่ได้', 'ลืมวันเริ่มงาน', 'ลืม'],
      reply:
        'หากลืมข้อมูลสำหรับเข้าสู่ระบบ 🔑\n\n' +
        '• รหัสพนักงาน → ดูได้จากบัตรพนักงานหรือสลิปเงินเดือน\n' +
        '• วันที่เริ่มงาน → ตรวจสอบได้ที่ฝ่าย HR\n\n' +
        'แนะนำให้ติดต่อฝ่าย HR เพื่อยืนยันข้อมูลนะครับ'
    },
    {
      keys: ['ติดต่อ hr', 'ติดต่อhr', 'hr', 'ฝ่ายบุคคล', 'ติดต่อฝ่ายบุคคล'],
      reply:
        'ช่องทางติดต่อฝ่าย HR 📞\n\n' +
        '• อีเมล: hr@tokaisolidtire.com\n' +
        '• เวลาทำการ: จันทร์–ศุกร์ 08:30–17:30 น.\n' +
        '• โทรภายใน: ต่อ 123\n\n' +
        'ทีม HR ยินดีช่วยเหลือครับ'
    },
    {
      keys: ['วันที่เริ่มงาน', 'รูปแบบวันที่', 'ddmmyyyy'],
      reply:
        'วันที่เริ่มงานให้กรอกเป็นตัวเลข 8 หลัก รูปแบบ DDMMYYYY (ปี ค.ศ.) 📅\n\n' +
        'ตัวอย่าง: ถ้าเริ่มงานวันที่ 15 มกราคม 2023\n' +
        'ให้กรอก: 15012023'
    },
    {
      keys: ['รหัสพนักงาน', 'รูปแบบรหัส', 'กรอกรหัสยังไง'],
      reply:
        'รหัสพนักงานคือรหัสประจำตัวที่บริษัทออกให้ครับ\n' +
        'หากไม่แน่ใจรูปแบบ ดูได้จากบัตรพนักงานหรือสลิปเงินเดือน หรือติดต่อ HR ครับ'
    },
    {
      keys: ['วิธีเข้าใช้งาน', 'เข้าใช้งาน', 'วิธีล็อกอิน', 'วิธี login', 'ล็อกอินยังไง', 'เข้าสู่ระบบ'],
      reply:
        'วิธีเข้าใช้งานครับ 📝\n\n' +
        '1. กรอก "รหัสพนักงาน" ของคุณ\n' +
        '2. กรอก "วันที่เริ่มงาน" ในรูปแบบ DDMMYYYY (ปี ค.ศ.) เช่น 15012023\n' +
        '3. กดปุ่ม "เข้าสู่ระบบ"\n\n' +
        'หากข้อมูลถูกต้อง ระบบจะพาไปยังหน้า Dashboard อัตโนมัติครับ'
    },
    {
      keys: ['ขอบคุณ', 'thanks', 'thank', 'thankyou'],
      reply: 'ยินดีครับ 😊 หากมีคำถามเพิ่มเติมถามได้เลยนะครับ'
    },
    {
      keys: ['สวัสดี', 'hello', 'hey', 'hi'],
      reply: 'สวัสดีครับ 👋 มีอะไรให้ช่วยเหลือไหมครับ?'
    }
  ];

  function matchReply(input){
    const text = input.toLowerCase().trim();
    for (const item of KB){
      for (const k of item.keys){
        if (text.includes(k.toLowerCase())) return item.reply;
      }
    }
    return (
      'ขออภัยครับ ผมยังไม่เข้าใจคำถามนี้ 🤔\n\n' +
      'ลองถามเกี่ยวกับ:\n' +
      '• วิธีเข้าใช้งาน\n' +
      '• ลืมรหัส / ข้อมูลเข้าใช้งาน\n' +
      '• ติดต่อ HR\n\n' +
      'หรือกดปุ่มด้านล่างเพื่อเลือกหัวข้อได้เลยครับ'
    );
  }

  function sendMessage(text){
    const msg = (text || '').trim();
    if (!msg || isTyping) return;
    addBubble(msg, 'user');
    chatInput.value = '';
    botReply(matchReply(msg));
  }

  chatSend.addEventListener('click', () => sendMessage(chatInput.value));
  chatInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage(chatInput.value);
    }
  });
  chatQuick.addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (chip) sendMessage(chip.dataset.q);
  });
  document.getElementById('help-link').addEventListener('click', e => {
    e.preventDefault();
    openChat();
  });
  setTimeout(() => { if (!hasGreeted) chatBadge.classList.add('show'); }, 6000);

  // ═══ LOGIN LOGIC (ตรวจฝั่งเซิร์ฟเวอร์ผ่าน RPC) ═══
  function withTimeout(promise, ms){
    let t;
    const timer = new Promise((_, reject) => { t = setTimeout(() => reject(new Error('TIMEOUT')), ms); });
    return Promise.race([promise, timer]).finally(() => clearTimeout(t));
  }

  async function attemptLogin(uname, pass){
    const { data, error } = await withTimeout(
      sb.rpc('verify_employee_login', { p_employee_id: uname, p_pass: pass }),
      TIMEOUT_MS
    );
    if (error) throw error;
    return data || { ok: false, reason: 'INVALID' };
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    hideMsg();

    const uname = unameEl.value.trim();
    const pass  = passEl.value.trim();

    if (!uname){
      showMsg('error', 'alert', 'กรุณากรอกรหัสพนักงาน');
      shake(unameEl); unameEl.focus(); return;
    }
    if (!pass){
      showMsg('error', 'alert', 'กรุณากรอกวันที่เริ่มงาน');
      shake(passEl); passEl.focus(); return;
    }
    if (!/^\d{8}$/.test(pass)){
      showMsg('error', 'alert', 'วันที่เริ่มงานต้องเป็นตัวเลข 8 หลัก (DDMMYYYY)');
      shake(passEl); passEl.focus(); return;
    }

    setLoading(true);
    showMsg('wait', 'clock', 'กำลังตรวจสอบข้อมูล...');

    try {
      const result = await attemptLogin(uname, pass);

      if (result.ok){
        wrongAttempts = 0;
        showMsg('ok', 'check', 'เข้าสู่ระบบสำเร็จ กำลังพาไปยังหน้าหลัก...');
        btn.disabled = true;
        btnLabel.textContent = 'สำเร็จ';
        setBtnIcon('check');

        // เก็บเฉพาะ token ที่เซิร์ฟเวอร์ออกให้ (home.html ต้องเรียก check_session ตรวจซ้ำ)
        try {
          sessionStorage.setItem('mm_user', JSON.stringify({
            employee_id: result.employee_id,
            token: result.token
          }));
        } catch(_){}

        setTimeout(() => { window.location.href = DASHBOARD_URL; }, 900);
        return;
      }

      wrongAttempts++;
      setLoading(false);

      if (result.reason === 'LOCKED'){
        showMsg('error', 'ban', 'ลองผิดหลายครั้ง ระบบล็อกชั่วคราว 15 นาที หรือติดต่อ HR');
      } else if (result.reason === 'INACTIVE'){
        showMsg('error', 'ban', 'บัญชีนี้ถูกระงับการใช้งาน กรุณาติดต่อ HR');
        shake(passEl);
      } else {
        showMsg('error', 'alert', 'รหัสพนักงานหรือวันที่เริ่มงานไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง');
        shake(passEl);
        passEl.select();
        if (wrongAttempts >= 3){
          setTimeout(() => {
            showMsg('error', 'ban', 'พยายามเข้าสู่ระบบไม่สำเร็จหลายครั้ง หากยังไม่ได้กรุณาติดต่อ HR');
          }, 1200);
        }
      }
    } catch (err){
      setLoading(false);
      console.error('[login error]', err);
      const m = String((err && err.message) || '').toLowerCase();
      if (m === 'timeout'){
        showMsg('error', 'clock', 'การเชื่อมต่อใช้เวลานานเกินไป กรุณาลองใหม่');
      } else if (m.includes('fetch') || m.includes('network')){
        showMsg('error', 'alert', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาตรวจสอบอินเทอร์เน็ต');
      } else {
        showMsg('error', 'alert', 'เกิดข้อผิดพลาดบางอย่าง กรุณาลองใหม่อีกครั้ง');
      }
    }
  });

  unameEl.addEventListener('input', hideMsg);
  passEl.addEventListener('input', () => {
    hideMsg();
    passEl.value = passEl.value.replace(/\D/g, '').slice(0, 8);
  });

  unameEl.focus();
})();
</script>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ระบบล็อกอินพนักงาน | TOKAI</title>
<link rel="preconnect" href="https://dhgjbpvbbixipxksqqzu.supabase.co" crossorigin>
<link rel="dns-prefetch" href="https://dhgjbpvbbixipxksqqzu.supabase.co">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:       #0a0a0d;
  --bg-2:     #101014;
  --surface:  rgba(255,255,255,.04);
  --surface-2:rgba(255,255,255,.06);
  --border:   rgba(255,255,255,.08);
  --border-2: rgba(255,255,255,.14);
  --red:      #e63946;
  --red-soft: #ff4d5e;
  --red-deep: #a4161a;
  --text:     #f5f5f7;
  --text-dim: #a1a1aa;
  --text-3:   #6b6b76;
  --green:    #22c55e;
  --blue:     #3b82f6;
  --sans:'Inter','Noto Sans Thai',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  min-height:100vh;
  overflow-x:hidden;
  font-weight:400;
  display:flex;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));
  position:relative;
  -webkit-font-smoothing:antialiased;
}

/* ── AMBIENT BACKGROUND ── */
.bg-gradient{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 60% at 50% -20%, rgba(230,57,70,.28), transparent 60%),
    radial-gradient(ellipse 60% 50% at 0% 100%, rgba(230,57,70,.12), transparent 60%),
    radial-gradient(ellipse 60% 50% at 100% 80%, rgba(60,60,90,.15), transparent 60%);
}
.bg-noise{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.025;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
.bg-orb{
  position:fixed;z-index:0;pointer-events:none;border-radius:50%;
  filter:blur(80px);opacity:.5;
}
.bg-orb.o1{
  width:400px;height:400px;
  background:rgba(230,57,70,.35);
  top:-100px;right:-100px;
  animation:float1 12s ease-in-out infinite;
}
.bg-orb.o2{
  width:350px;height:350px;
  background:rgba(164,22,26,.25);
  bottom:-100px;left:-100px;
  animation:float2 14s ease-in-out infinite;
}
@keyframes float1{
  0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(-30px,30px) scale(1.1)}
}
@keyframes float2{
  0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(30px,-30px) scale(1.15)}
}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── CARD ── */
.wrap{width:100%;max-width:420px;animation:up .8s cubic-bezier(.16,1,.3,1) both;position:relative;z-index:10}
.card{
  position:relative;
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
  border:1px solid var(--border);
  border-radius:20px;
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  box-shadow:
    0 30px 60px -20px rgba(0,0,0,.7),
    0 0 0 1px rgba(255,255,255,.03) inset,
    0 1px 0 rgba(255,255,255,.08) inset;
  overflow:hidden;
}
/* top accent line */
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg, transparent, var(--red), transparent);
  opacity:.9;
}

.head{
  padding:40px 32px 28px;
  text-align:center;
  position:relative;
}
.head img{
  width:120px;height:auto;display:block;margin:0 auto 24px;
  filter:drop-shadow(0 4px 20px rgba(230,57,70,.4));
}
.head h1{
  font-family:var(--sans);
  font-size:1.35rem;font-weight:600;letter-spacing:-.01em;line-height:1.35;
  color:var(--text);
}
.head p{
  font-size:.85rem;color:var(--text-dim);
  margin-top:8px;font-weight:400;
}

.body{padding:0 32px 32px}

.field{margin-bottom:18px}
.field label{
  display:block;
  font-size:.78rem;font-weight:500;
  color:var(--text-dim);
  margin-bottom:8px;
  letter-spacing:.005em;
}
.input-wrap{position:relative}
.input-wrap>svg{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;stroke:var(--text-3);
  pointer-events:none;transition:stroke .2s;
}
.input-wrap:focus-within>svg{stroke:var(--red-soft)}

input{
  width:100%;
  padding:13px 14px 13px 44px;
  background:rgba(0,0,0,.25);
  border:1px solid var(--border);
  border-radius:10px;
  color:var(--text);
  font:400 15px var(--sans);
  transition:border-color .2s,background .2s,box-shadow .2s;
}
input::placeholder{color:var(--text-3);font-size:14px}
input:hover{border-color:var(--border-2)}
input:focus{
  outline:none;
  border-color:var(--red-soft);
  background:rgba(230,57,70,.04);
  box-shadow:0 0 0 4px rgba(230,57,70,.12);
}
input.shake{animation:shake .35s}
@keyframes shake{
  10%,90%{transform:translateX(-2px)}
  20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-6px)}
  40%,60%{transform:translateX(6px)}
}

button{
  width:100%;margin-top:10px;padding:14px 16px;
  background:linear-gradient(135deg,var(--red),var(--red-deep));
  color:#fff;border:none;border-radius:10px;
  font:600 .92rem var(--sans);
  letter-spacing:.01em;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .2s cubic-bezier(.16,1,.3,1);
  box-shadow:
    0 4px 14px rgba(230,57,70,.35),
    0 1px 0 rgba(255,255,255,.15) inset;
  position:relative;overflow:hidden;
}
button::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg, transparent, rgba(255,255,255,.15), transparent);
  transform:translateX(-100%);
  transition:transform .6s ease;
}
button:hover:not(:disabled)::before{transform:translateX(100%)}
button:hover:not(:disabled){
  transform:translateY(-1px);
  box-shadow:0 8px 24px rgba(230,57,70,.5),0 1px 0 rgba(255,255,255,.15) inset;
}
button:active:not(:disabled){transform:translateY(0)}
button:focus-visible{outline:2px solid var(--red-soft);outline-offset:2px}
button:disabled{opacity:.85;cursor:default;transform:none}
button svg{width:18px;height:18px;stroke:#fff;flex-shrink:0}
.spin{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.msg{
  display:none;margin-bottom:16px;padding:11px 14px;
  font-size:.85rem;font-weight:400;
  border:1px solid var(--border);
  border-left:3px solid transparent;
  border-radius:8px;
  align-items:center;gap:10px;
  animation:up .3s both;
}
.msg svg{width:16px;height:16px;flex-shrink:0}
.msg.show{display:flex}
.msg.error{color:#ffb3b8;border-left-color:var(--red);background:rgba(230,57,70,.08)}
.msg.error svg{stroke:#ffb3b8}
.msg.ok{color:#86efac;border-left-color:var(--green);background:rgba(34,197,94,.08)}
.msg.ok svg{stroke:#86efac}
.msg.wait{color:#93c5fd;border-left-color:var(--blue);background:rgba(59,130,246,.08)}
.msg.wait svg{stroke:#93c5fd}

.divider{
  display:flex;align-items:center;gap:12px;
  margin:22px 0 18px;
  color:var(--text-3);font-size:.72rem;
  text-transform:uppercase;letter-spacing:.1em;
}
.divider::before,.divider::after{
  content:'';flex:1;height:1px;background:var(--border);
}

.help{text-align:center;margin-top:18px}
.help a{
  color:var(--text-dim);text-decoration:none;
  font-size:.82rem;font-weight:500;
  transition:color .2s;
}
.help a:hover{color:var(--red-soft)}

.foot{
  padding:16px 32px;
  text-align:center;color:var(--text-3);
  font-size:.72rem;letter-spacing:.02em;
  border-top:1px solid var(--border);
  background:rgba(0,0,0,.15);
}

/* ── RESPONSIVE ── */
@media(max-width:460px){
  .head{padding:32px 24px 24px}
  .body{padding:0 24px 28px}
  .foot{padding:14px 24px}
  .head h1{font-size:1.2rem}
  .head img{width:100px}
}
</style>
</head>
<body>

<div class="bg-gradient"></div>
<div class="bg-orb o1"></div>
<div class="bg-orb o2"></div>
<div class="bg-noise"></div>

<div class="wrap">
<div class="card">
  <div class="head">
    <img src="https://sarawutc6689-cpu.github.io/Mouldmate-Login/logotokai.png" alt="TOKAI" width="140" height="46" fetchpriority="high">
    <h1>ระบบล็อกอินพนักงาน</h1>
    <p>เฉพาะพนักงาน TOKAISOLIDTIRE ที่ลงทะเบียนเท่านั้น</p>
  </div>

  <div class="body">
    <form id="f" autocomplete="on">
      <div class="field">
        <label for="uname">รหัสพนักงาน</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="uname" name="uname" placeholder="กรอกรหัสพนักงาน" autocomplete="username" inputmode="text">
        </div>
      </div>

      <div class="field">
        <label for="pass">วันที่เริ่มงาน</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="pass" name="pass" placeholder="DDMMYYYY" autocomplete="current-password" inputmode="numeric">
        </div>
      </div>

      <div id="msg" class="msg"></div>

      <button type="submit" id="btn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
        <span>เข้าสู่ระบบ</span>
      </button>

      <div class="help"><a href="#" id="help-link">ต้องการความช่วยเหลือ?</a></div>
    </form>
  </div>

  <div class="foot">© 2026 TOKAISOLIDTIRE · พัฒนาโดย SARAWUT.C</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function(){
  "use strict";

  const SUPABASE_URL  = "https://dhgjbpvbbixipxksqqzu.supabase.co";
  const SUPABASE_KEY  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRoZ2picHZiYml4aXB4a3NxcXp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5OTIxMjgsImV4cCI6MjEwMTU2ODEyOH0.kZBAN01vbe8kENacfofZewHvxQBCCd2OaTFKbcFYlpM";
  const DASHBOARD_URL = "https://mouldmate.vercel.app/home.html";
  const TIMEOUT_MS    = 8000;

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const form   = document.getElementById('f');
  const unameEl = document.getElementById('uname');
  const passEl  = document.getElementById('pass');
  const msgEl  = document.getElementById('msg');
  const btn    = document.getElementById('btn');
  const btnLabel = btn.querySelector('span');
  const btnIcon  = btn.querySelector('svg');
  const origIcon = btnIcon.outerHTML;

  const ICONS = {
    spinner: '<svg class="spin" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>',
    check:   '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
    alert:   '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>',
    clock:   '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
    ban:     '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M4.9 4.9l14.2 14.2"/></svg>'
  };

  function showMsg(type, icon, text){
    msgEl.className = 'msg show ' + type;
    msgEl.innerHTML = ICONS[icon] + '<span>' + text + '</span>';
  }
  function hideMsg(){
    msgEl.className = 'msg';
    msgEl.innerHTML = '';
  }
  function shake(el){
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
  }
  function setLoading(on){
    btn.disabled = on;
    btnLabel.textContent = on ? 'กำลังตรวจสอบ...' : 'เข้าสู่ระบบ';
    btnIcon.outerHTML = on ? ICONS.spinner : origIcon;
  }

  document.getElementById('help-link').addEventListener('click', function(e){
    e.preventDefault();
    showMsg('wait', 'alert', 'รหัสพนักงาน: รหัสที่ได้รับจากบริษัท · วันที่เริ่มงาน: DDMMYYYY · ลืมรหัสติดต่อ HR');
    setTimeout(hideMsg, 6000);
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    login();
  });

  function login(){
    const user = unameEl.value.trim();
    const pass = passEl.value.trim();
    hideMsg();

    if (!user || !pass){
      showMsg('error', 'alert', 'กรุณากรอกข้อมูลให้ครบทุกช่อง');
      if (!user) shake(unameEl);
      if (!pass) shake(passEl);
      return;
    }

    setLoading(true);
    showMsg('wait', 'spinner', 'กำลังตรวจสอบข้อมูล...');

    const timeoutPromise = new Promise((_, reject) =>
      setTimeout(() => reject({ name: 'AbortError' }), TIMEOUT_MS)
    );

    Promise.race([
      supabase.rpc('login_employee', { p_code: user, p_pass: pass }),
      timeoutPromise
    ])
      .then(({ data, error }) => {
        if (error){
          showMsg('error', 'alert', 'เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่');
          setLoading(false);
          return;
        }

        if (data.status === 'success'){
          showMsg('ok', 'check', 'สำเร็จ! กำลังเข้าสู่ระบบ...');
          btnLabel.textContent = 'สำเร็จ';
          btnIcon.outerHTML = ICONS.check;
          btn.style.background = 'linear-gradient(135deg,#22c55e,#16a34a)';
          btn.style.boxShadow = '0 8px 24px rgba(34,197,94,.5)';

          localStorage.setItem('username', user);
          localStorage.setItem('authToken', user);
          localStorage.setItem('expireTime', Date.now() + 1000*60*30);
          localStorage.setItem('userName', (data.name || '').toString().trim() || user);

          requestAnimationFrame(() => {
            window.open(DASHBOARD_URL, '_self');
          });

        } else if (data.status === 'denied'){
          showMsg('error', 'ban', data.message || 'บัญชีนี้ถูกระงับการใช้งาน');
          setLoading(false);
        } else {
          showMsg('error', 'alert', data.message || 'รหัสพนักงาน หรือวันที่เริ่มงานไม่ถูกต้อง');
          setLoading(false);
          shake(unameEl); shake(passEl);
        }
      })
      .catch(err => {
        if (err.name === 'AbortError'){
          showMsg('error', 'clock', 'เซิร์ฟเวอร์ตอบสนองช้าเกินไป (เกิน ' + (TIMEOUT_MS/1000) + ' วินาที) กรุณาลองใหม่');
        } else {
          showMsg('error', 'alert', 'เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่');
        }
        setLoading(false);
      });
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ระบบล็อกอินพนักงาน | TOKAI</title>
<link rel="preconnect" href="https://dhgjbpvbbixipxksqqzu.supabase.co" crossorigin>
<link rel="dns-prefetch" href="https://dhgjbpvbbixipxksqqzu.supabase.co">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --void:       #050507;
  --carbon:     #0d0d11;
  --carbon-lt:  #16161c;
  --steel:      #2a2a32;
  --steel-lt:   #5a5a68;
  --tread-red:  #e01e2b;
  --red-glow:   #ff2d3f;
  --red-neon:   #ff0040;
  --red-dim:    #7a0f18;
  --paper:      #f5f4f2;
  --paper-dim:  #9a9aa8;
  --cyan:       #00e5ff;
  --sans:'Inter',sans-serif;
  --mono:'IBM Plex Mono',monospace;
  --display:'Orbitron',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  font-family:var(--sans);
  background:var(--void);
  color:var(--paper);
  line-height:1.65;
  min-height:100vh;
  overflow-x:hidden;
  font-weight:300;
  display:flex;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));
  position:relative;
}

/* ── AMBIENT BACKGROUND (เหมือนหน้า home) ── */
.bg-void{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 50% 50%, #0a0a10 0%, #050507 100%);}
.bg-glow{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(800px 800px at 78% 38%, rgba(224,30,43,0.28), transparent 60%),
    radial-gradient(600px 600px at 15% 85%, rgba(224,30,43,0.14), transparent 65%);
  animation:glowPulse 6s ease-in-out infinite;
}
@keyframes glowPulse{0%,100%{opacity:.7}50%{opacity:1}}
.bg-blue{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(700px 700px at 15% 25%, rgba(0,229,255,0.16), transparent 60%),
    radial-gradient(500px 500px at 85% 80%, rgba(0,229,255,0.10), transparent 65%);
  animation:bluePulse 5s ease-in-out infinite;
}
@keyframes bluePulse{0%,100%{opacity:.3}50%{opacity:1}}
.bg-grid{
  position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:
    linear-gradient(rgba(224,30,43,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(224,30,43,.06) 1px, transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(circle at 50% 45%, black 0%, transparent 75%);
}
.bg-scanlines{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.08;
  background:repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,0,64,.4) 3px);
  animation:scanMove 8s linear infinite;
}
@keyframes scanMove{from{transform:translateY(0)}to{transform:translateY(4px)}}

@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* ── CARD ── */
.wrap{width:100%;max-width:440px;animation:up .9s both;position:relative;z-index:10}
.card{
  position:relative;
  background:linear-gradient(180deg,var(--carbon-lt),var(--carbon));
  border:1px solid rgba(224,30,43,.25);
  border-top:2px solid var(--tread-red);
  box-shadow:
    0 40px 90px -30px rgba(0,0,0,.95),
    0 0 90px -30px rgba(224,30,43,.55),
    inset 0 1px 0 rgba(255,255,255,.03);
  overflow:hidden;
}
/* corner brackets */
.card::before,.card::after{
  content:'';position:absolute;width:26px;height:26px;pointer-events:none;
  border:2px solid var(--tread-red);z-index:2;
  box-shadow:0 0 12px rgba(224,30,43,.6);
}
.card::before{top:8px;left:8px;border-right:none;border-bottom:none}
.card::after{bottom:8px;right:8px;border-left:none;border-top:none}

.head{
  padding:36px 28px 26px;text-align:center;
  border-bottom:1px solid rgba(224,30,43,.2);
  position:relative;
}
.head img{
  width:132px;height:auto;display:block;margin:0 auto 20px;
  filter:drop-shadow(0 0 18px rgba(224,30,43,.55));
}
.eyebrow{
  font-family:var(--mono);
  font-size:.62rem;letter-spacing:.32em;color:var(--red-glow);
  margin-bottom:12px;font-weight:500;text-transform:uppercase;
  text-shadow:0 0 12px rgba(255,45,63,.6);
}
.head h1{
  font-family:var(--display);
  font-size:1.4rem;font-weight:800;letter-spacing:.02em;line-height:1.3;
  text-transform:uppercase;color:var(--paper);
  text-shadow:0 0 24px rgba(224,30,43,.35);
}
.head p{font-size:.82rem;color:var(--paper-dim);margin-top:12px;font-weight:300}

.body{padding:30px 28px 26px}

.field{margin-bottom:22px}
.field label{
  display:flex;align-items:center;gap:8px;
  font-family:var(--mono);
  font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;
  color:#c9c9d4;margin-bottom:9px;font-weight:500;
}
.field label svg{
  width:14px;height:14px;stroke:var(--red-glow);flex-shrink:0;
  filter:drop-shadow(0 0 5px rgba(255,45,63,.6));
}

.input-wrap{position:relative}
.input-wrap>svg{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;stroke:var(--paper-dim);pointer-events:none;
  transition:stroke .3s,filter .3s;
}
.input-wrap:focus-within>svg{
  stroke:var(--red-glow);
  filter:drop-shadow(0 0 6px rgba(255,45,63,.7));
}

input{
  width:100%;padding:13px 14px 13px 42px;
  background:rgba(0,0,0,.4);
  border:1px solid rgba(255,255,255,.08);
  border-radius:4px;
  color:var(--paper);
  font:300 15px var(--sans);
  transition:border-color .3s,background .3s,box-shadow .3s;
}
input::placeholder{color:#5f5f6e;font-size:13.5px}
input:focus{
  outline:none;border-color:var(--red-glow);
  background:rgba(224,30,43,.06);
  box-shadow:0 0 0 3px rgba(224,30,43,.12),0 0 20px -4px rgba(224,30,43,.5);
}
input.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

button{
  width:100%;margin-top:8px;padding:15px;
  background:linear-gradient(135deg,var(--tread-red),#a80e1a);
  color:#fff;border:1px solid var(--red-glow);border-radius:4px;
  font-family:var(--display);
  font-size:.78rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
  transition:all .3s;
  box-shadow:0 0 22px rgba(224,30,43,.45),inset 0 0 18px rgba(255,255,255,.08);
  position:relative;overflow:hidden;
}
button::before{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);
  transition:left .6s ease;
}
button:hover:not(:disabled)::before{left:100%}
button:hover:not(:disabled){
  box-shadow:0 0 38px rgba(224,30,43,.85),inset 0 0 26px rgba(255,255,255,.15);
  transform:translateY(-2px);
}
button:focus-visible{outline:2px solid var(--red-glow);outline-offset:3px}
button:disabled{opacity:.85;cursor:default;transform:none}
button svg{width:17px;height:17px;stroke:#fff;flex-shrink:0}
.spin{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.msg{
  display:none;margin-bottom:18px;padding:12px 14px;
  font-family:var(--sans);
  font-size:.85rem;font-weight:400;
  border:1px solid rgba(255,255,255,.08);
  border-left:3px solid transparent;
  border-radius:3px;
  align-items:center;gap:10px;
  animation:up .4s both;
}
.msg svg{width:15px;height:15px;flex-shrink:0}
.msg.show{display:flex}
.msg.error{color:#ffb3b8;border-left-color:var(--red-glow);background:rgba(224,30,43,.1)}
.msg.error svg{stroke:#ffb3b8;filter:drop-shadow(0 0 5px rgba(255,45,63,.6))}
.msg.ok{color:#8ff0b5;border-left-color:#2fd17a;background:rgba(47,209,122,.08)}
.msg.ok svg{stroke:#8ff0b5}
.msg.wait{color:#8fd4ff;border-left-color:var(--cyan);background:rgba(0,229,255,.08)}
.msg.wait svg{stroke:#8fd4ff;filter:drop-shadow(0 0 5px rgba(0,229,255,.6))}

.help{text-align:center;margin-top:22px}
.help a{
  color:var(--paper-dim);text-decoration:none;
  font-family:var(--mono);
  font-size:.74rem;letter-spacing:.08em;
  border-bottom:1px solid transparent;transition:.3s;
}
.help a:hover{
  color:var(--red-glow);border-color:var(--red-glow);
  text-shadow:0 0 10px rgba(255,45,63,.6);
}

.foot{
  padding:16px;text-align:center;color:var(--steel-lt);
  font-family:var(--mono);
  font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;
  border-top:1px solid rgba(224,30,43,.15);
  background:rgba(5,5,7,.6);
}
</style>
</head>
<body>

<div class="bg-void"></div>
<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="bg-blue"></div>
<div class="bg-scanlines"></div>

<div class="wrap">
<div class="card">
  <div class="head">
    <img src="https://sarawutc6689-cpu.github.io/Mouldmate-Login/logotokai.png" alt="TOKAI" width="140" height="46" fetchpriority="high">
    <div class="eyebrow">SECURE ACCESS</div>
    <h1>ระบบล็อกอินพนักงาน</h1>
    <p>เฉพาะพนักงาน TOKAISOLIDTIRE ที่ลงทะเบียนเท่านั้น</p>
  </div>

  <div class="body">
    <form id="f" autocomplete="on">
      <div class="field">
        <label>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>
          รหัสพนักงาน
        </label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="uname" name="uname" placeholder="กรุณากรอกรหัสพนักงาน" autocomplete="username" inputmode="text">
        </div>
      </div>

      <div class="field">
        <label>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          วันที่เริ่มงาน
        </label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="pass" name="pass" placeholder="กรุณากรอกวันที่เริ่มงาน (DDMMYYYY)" autocomplete="current-password" inputmode="numeric">
        </div>
      </div>

      <div id="msg" class="msg"></div>

      <button type="submit" id="btn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
        <span>เข้าสู่ระบบ</span>
      </button>

      <div class="help"><a href="#" id="help-link">ต้องการความช่วยเหลือ?</a></div>
    </form>
  </div>

  <div class="foot">ระบบรักษาความปลอดภัย © 2026 · พัฒนาโดย SARAWUT.C</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function(){
  "use strict";

  const SUPABASE_URL  = "https://dhgjbpvbbixipxksqqzu.supabase.co";
  const SUPABASE_KEY  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRoZ2picHZiYml4aXB4a3NxcXp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5OTIxMjgsImV4cCI6MjEwMTU2ODEyOH0.kZBAN01vbe8kENacfofZewHvxQBCCd2OaTFKbcFYlpM";
  const DASHBOARD_URL = "https://mouldmate.vercel.app/home.html";
  const TIMEOUT_MS    = 8000;

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const form   = document.getElementById('f');
  const unameEl = document.getElementById('uname');
  const passEl  = document.getElementById('pass');
  const msgEl  = document.getElementById('msg');
  const btn    = document.getElementById('btn');
  const btnLabel = btn.querySelector('span');
  const btnIcon  = btn.querySelector('svg');
  const origIcon = btnIcon.outerHTML;

  const ICONS = {
    spinner: '<svg class="spin" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>',
    check:   '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
    alert:   '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>',
    clock:   '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
    ban:     '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M4.9 4.9l14.2 14.2"/></svg>'
  };

  function showMsg(type, icon, text){
    msgEl.className = 'msg show ' + type;
    msgEl.innerHTML = ICONS[icon] + '<span>' + text + '</span>';
  }
  function hideMsg(){
    msgEl.className = 'msg';
    msgEl.innerHTML = '';
  }
  function shake(el){
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
  }
  function setLoading(on){
    btn.disabled = on;
    btnLabel.textContent = on ? 'กำลังตรวจสอบ...' : 'เข้าสู่ระบบ';
    btnIcon.outerHTML = on ? ICONS.spinner : origIcon;
  }

  document.getElementById('help-link').addEventListener('click', function(e){
    e.preventDefault();
    showMsg('wait', 'alert', 'รหัสพนักงาน: รหัสที่ได้รับจากบริษัท · วันที่เริ่มงาน: DDMMYYYY · ลืมรหัสติดต่อ HR');
    setTimeout(hideMsg, 6000);
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    login();
  });

  function login(){
    const user = unameEl.value.trim();
    const pass = passEl.value.trim();
    hideMsg();

    if (!user || !pass){
      showMsg('error', 'alert', 'กรุณากรอกข้อมูลให้ครบทุกช่อง');
      if (!user) shake(unameEl);
      if (!pass) shake(passEl);
      return;
    }

    setLoading(true);
    showMsg('wait', 'spinner', 'กำลังตรวจสอบข้อมูล...');

    const timeoutPromise = new Promise((_, reject) =>
      setTimeout(() => reject({ name: 'AbortError' }), TIMEOUT_MS)
    );

    Promise.race([
      supabase.rpc('login_employee', { p_code: user, p_pass: pass }),
      timeoutPromise
    ])
      .then(({ data, error }) => {
        if (error){
          showMsg('error', 'alert', 'เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่');
          setLoading(false);
          return;
        }

        if (data.status === 'success'){
          showMsg('ok', 'check', 'สำเร็จ! กำลังเข้าสู่ระบบ...');
          btnLabel.textContent = 'สำเร็จ';
          btnIcon.outerHTML = ICONS.check;
          btn.style.background = '#1ea35a';
          btn.style.borderColor = '#2fd17a';
          btn.style.boxShadow = '0 0 30px rgba(47,209,122,.6)';

          localStorage.setItem('username', user);
          localStorage.setItem('authToken', user);
          localStorage.setItem('expireTime', Date.now() + 1000*60*30);
          localStorage.setItem('userName', (data.name || '').toString().trim() || user);

          requestAnimationFrame(() => {
            window.open(DASHBOARD_URL, '_self');
          });

        } else if (data.status === 'denied'){
          showMsg('error', 'ban', data.message || 'บัญชีนี้ถูกระงับการใช้งาน');
          setLoading(false);
        } else {
          showMsg('error', 'alert', data.message || 'รหัสพนักงาน หรือวันที่เริ่มงานไม่ถูกต้อง');
          setLoading(false);
          shake(unameEl); shake(passEl);
        }
      })
      .catch(err => {
        if (err.name === 'AbortError'){
          showMsg('error', 'clock', 'เซิร์ฟเวอร์ตอบสนองช้าเกินไป (เกิน ' + (TIMEOUT_MS/1000) + ' วินาที) กรุณาลองใหม่');
        } else {
          showMsg('error', 'alert', 'เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่');
        }
        setLoading(false);
      });
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  color-scheme:dark;
  --red:#e8141f; --red-hot:#ff3144; --red-deep:#5a0a10;
  --void:#050506; --card:rgba(14,14,17,.82); --field:#0a0a0c;
  --border:rgba(255,255,255,.12); --text:#f4f2ef; --muted:#8e8e96;
  --font:'Chakra Petch','Kanit',-apple-system,"Segoe UI",sans-serif; --mono:'IBM Plex Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);background:var(--void);color:var(--text);display:flex;align-items:center;justify-content:center;
  padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));overflow-x:hidden;position:relative}

/* background fx */
.fx{position:fixed;inset:0;pointer-events:none;z-index:0}
.glow{background:radial-gradient(700px 700px at 80% 40%,rgba(232,20,31,.22),transparent 62%),radial-gradient(500px 400px at 8% 8%,rgba(232,20,31,.1),transparent 65%)}
.aurora{inset:auto;right:-20%;top:0;width:95vmin;height:95vmin;border-radius:50%;filter:blur(55px);opacity:.7;
  background:conic-gradient(from 0deg,transparent,rgba(232,20,31,.35),transparent 30%,rgba(255,49,68,.25),transparent 62%);animation:spin 14s linear infinite}
#net{width:100%;height:100%;z-index:1}
.floor{position:fixed;left:-50%;right:-50%;bottom:0;height:50vh;z-index:0;pointer-events:none;perspective:500px;mask-image:linear-gradient(to top,#000 10%,transparent 90%)}
.floor i{position:absolute;inset:0;transform:rotateX(68deg);transform-origin:bottom;
  background-image:linear-gradient(rgba(232,20,31,.55) 1px,transparent 1px),linear-gradient(90deg,rgba(232,20,31,.4) 1px,transparent 1px);background-size:70px 70px;animation:floor 2.4s linear infinite}
.scan{z-index:50;opacity:.5;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.scan::after{content:"";position:absolute;left:0;right:0;height:140px;top:-140px;background:linear-gradient(180deg,transparent,rgba(255,49,68,.07),transparent);animation:scan 7s linear infinite}
@keyframes floor{to{background-position:0 70px}}
@keyframes scan{to{transform:translateY(120vh)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* card */
.wrap{position:relative;z-index:10;width:100%;max-width:430px;animation:up .8s both}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.card{position:relative;background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--border);
  clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px));
  box-shadow:0 0 60px -10px rgba(232,20,31,.35)}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--red-hot),transparent);box-shadow:0 0 14px var(--red-hot)}
.c{position:absolute;width:26px;height:26px;border:2px solid var(--red-hot);filter:drop-shadow(0 0 6px var(--red-hot));z-index:2;pointer-events:none}
.c.tl{top:-5px;left:-5px;border-right:0;border-bottom:0}.c.br{bottom:-5px;right:-5px;border-left:0;border-top:0}
.head{padding:30px 24px 22px;text-align:center;border-bottom:1px solid rgba(255,49,68,.4)}
.head img{width:140px;height:auto;display:block;margin:0 auto 14px;filter:drop-shadow(0 0 14px rgba(232,20,31,.55))}
.eyebrow{font-family:var(--mono);font-size:.62rem;letter-spacing:.3em;color:var(--red-hot);margin-bottom:.6rem;text-shadow:0 0 12px rgba(255,49,68,.6)}
.head h1{font-size:1.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
  background:linear-gradient(180deg,#fff 25%,var(--red-hot) 130%);-webkit-background-clip:text;background-clip:text;color:transparent}
.head p{font-size:13px;color:var(--muted);margin-top:8px;font-weight:300}

.body{padding:26px 24px 22px}
.field{margin-bottom:18px}
.field label{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;color:#cfcfd4;margin-bottom:8px;font-weight:500}
.field label svg{width:15px;height:15px;stroke:var(--red-hot);flex-shrink:0}
.input-wrap{position:relative}
.input-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted);pointer-events:none;transition:stroke .2s}
.input-wrap:focus-within svg{stroke:var(--red-hot)}
input{width:100%;padding:13px 14px 13px 42px;background:var(--field);border:1px solid var(--border);border-left:2px solid var(--red-deep);
  color:var(--text);font:400 15.5px var(--font);transition:border-color .2s,box-shadow .2s;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
input::placeholder{color:#55555c;font-size:14px}
input:focus{outline:none;border-color:var(--red-hot);box-shadow:0 0 0 1px var(--red-hot),0 0 22px -4px rgba(255,49,68,.6)}
input.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

button{position:relative;overflow:hidden;width:100%;margin-top:6px;padding:15px;background:linear-gradient(100deg,var(--red),var(--red-hot));color:#fff;border:none;
  font:600 15.5px var(--font);letter-spacing:.1em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;
  clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);transition:transform .25s,filter .25s;filter:drop-shadow(0 0 14px rgba(255,49,68,.55))}
button::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);transform:translateX(-120%);animation:shine 3.2s infinite}
@keyframes shine{60%,100%{transform:translateX(120%)}}
button:hover:not(:disabled){transform:translateY(-2px)}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}
button:disabled{opacity:.8;cursor:default}
button:disabled::after{animation:none}
button svg{width:18px;height:18px;stroke:#fff}
.spin{animation:spin .6s linear infinite}

.msg{display:none;margin-bottom:16px;padding:11px 13px;font-size:13.5px;font-weight:500;border-left:3px solid transparent;align-items:center;gap:8px}
.msg svg{width:15px;height:15px;flex-shrink:0}
.msg.show{display:flex}
.msg.error{background:rgba(232,20,31,.12);color:#ff8f94;border-left-color:var(--red-hot)}
.msg.error svg{stroke:#ff8f94}
.msg.ok{background:rgba(0,200,80,.1);color:#7ee8a2;border-left-color:#1ea35a}.msg.ok svg{stroke:#7ee8a2}
.msg.wait{background:rgba(0,150,255,.1);color:#8ec5ff;border-left-color:#1c8fff}.msg.wait svg{stroke:#8ec5ff}

.help{text-align:center;margin-top:18px}
.help a{color:var(--muted);text-decoration:none;font-size:13px;font-family:var(--mono);letter-spacing:.06em}
.help a:hover{color:var(--red-hot)}
.foot{padding:14px;text-align:center;color:#5d6068;font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;border-top:1px solid rgba(255,255,255,.06)}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="fx glow"></div>
<div class="fx aurora"></div>
<canvas id="net" class="fx"></canvas>
<div class="floor"><i></i></div>
<div class="fx scan"></div>

<div class="wrap">
<div class="card">
  <i class="c tl"></i><i class="c br"></i>
  <div class="head">
    <img src="https://sarawutc6689-cpu.github.io/Mouldmate-Login/logotokai.png" alt="TOKAI" width="140" height="46" fetchpriority="high">
    <div class="eyebrow"></div>
    <h1>ระบบล็อกอินพนักงาน</h1>
  
  </div>

  <div class="body">
    <form id="f" autocomplete="on">
      <div class="field">
        <label>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>
          รหัสพนักงาน
        </label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="uname" name="uname" placeholder="กรุณากรอกรหัสพนักงาน" autocomplete="username" inputmode="text">
        </div>
      </div>

      <div class="field">
        <label>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          วันที่เริ่มงาน
        </label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="pass" name="pass" placeholder="กรุณากรอกวันที่เริ่มงาน (DDMMYYYY)" autocomplete="current-password" inputmode="numeric">
        </div>
      </div>

      <div id="msg" class="msg"></div>

      <button type="submit" id="btn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
        <span>เข้าสู่ระบบ</span>
      </button>

      <div class="help"><a href="#" id="help-link">ต้องการความช่วยเหลือ?</a></div>
    </form>
  </div>

  <div class="foot">ระบบรักษาความปลอดภัย © 2026 · พัฒนาโดย SARAWUT.C</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function(){
  "use strict";

  const SUPABASE_URL  = "https://dhgjbpvbbixipxksqqzu.supabase.co";
  const SUPABASE_KEY  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRoZ2picHZiYml4aXB4a3NxcXp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5OTIxMjgsImV4cCI6MjEwMTU2ODEyOH0.kZBAN01vbe8kENacfofZewHvxQBCCd2OaTFKbcFYlpM";
  const DASHBOARD_URL = "https://mouldmate.vercel.app/home.html";
  const TIMEOUT_MS    = 8000;

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const form   = document.getElementById('f');
  const unameEl = document.getElementById('uname');
  const passEl  = document.getElementById('pass');
  const msgEl  = document.getElementById('msg');
  const btn    = document.getElementById('btn');
  const btnLabel = btn.querySelector('span');
  const btnIcon  = btn.querySelector('svg');
  const origIcon = btnIcon.outerHTML;

  const ICONS = {
    spinner: '<svg class="spin" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>',
    check:   '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
    alert:   '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>',
    clock:   '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
    ban:     '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M4.9 4.9l14.2 14.2"/></svg>'
  };

  function showMsg(type, icon, text){
    msgEl.className = 'msg show ' + type;
    msgEl.innerHTML = ICONS[icon] + '<span>' + text + '</span>';
  }
  function hideMsg(){
    msgEl.className = 'msg';
    msgEl.innerHTML = '';
  }
  function shake(el){
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
  }
  function setLoading(on){
    btn.disabled = on;
    btnLabel.textContent = on ? 'กำลังตรวจสอบ...' : 'เข้าสู่ระบบ';
    btnIcon.outerHTML = on ? ICONS.spinner : origIcon;
  }

  document.getElementById('help-link').addEventListener('click', function(e){
    e.preventDefault();
    showMsg('wait', 'alert', 'รหัสพนักงาน: รหัสที่ได้รับจากบริษัท · วันที่เริ่มงาน: DDMMYYYY · ลืมรหัสติดต่อ HR');
    setTimeout(hideMsg, 6000);
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    login();
  });

  function login(){
    const user = unameEl.value.trim();
    const pass = passEl.value.trim();
    hideMsg();

    if (!user || !pass){
      showMsg('error', 'alert', 'กรุณากรอกข้อมูลให้ครบทุกช่อง');
      if (!user) shake(unameEl);
      if (!pass) shake(passEl);
      return;
    }

    setLoading(true);
    showMsg('wait', 'spinner', 'กำลังตรวจสอบข้อมูล...');

    const timeoutPromise = new Promise((_, reject) =>
      setTimeout(() => reject({ name: 'AbortError' }), TIMEOUT_MS)
    );

    Promise.race([
      supabase.rpc('login_employee', { p_code: user, p_pass: pass }),
      timeoutPromise
    ])
      .then(({ data, error }) => {
        if (error){
          showMsg('error', 'alert', 'เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่');
          setLoading(false);
          return;
        }

        if (data.status === 'success'){
          showMsg('ok', 'check', 'สำเร็จ! กำลังเข้าสู่ระบบ...');
          btnLabel.textContent = 'สำเร็จ';
          btnIcon.outerHTML = ICONS.check;
          btn.style.background = '#1ea35a';

          localStorage.setItem('username', user);
          localStorage.setItem('authToken', user);
          localStorage.setItem('expireTime', Date.now() + 1000*60*30);
          localStorage.setItem('userName', (data.name || '').toString().trim() || user);

          requestAnimationFrame(() => {
            window.open(DASHBOARD_URL, '_self');
          });

        } else if (data.status === 'denied'){
          showMsg('error', 'ban', data.message || 'บัญชีนี้ถูกระงับการใช้งาน');
          setLoading(false);
        } else {
          showMsg('error', 'alert', data.message || 'รหัสพนักงาน หรือวันที่เริ่มงานไม่ถูกต้อง');
          setLoading(false);
          shake(unameEl); shake(passEl);
        }
      })
      .catch(err => {
        if (err.name === 'AbortError'){
          showMsg('error', 'clock', 'เซิร์ฟเวอร์ตอบสนองช้าเกินไป (เกิน ' + (TIMEOUT_MS/1000) + ' วินาที) กรุณาลองใหม่');
        } else {
          showMsg('error', 'alert', 'เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่');
        }
        setLoading(false);
      });
  }
})();

/* particle network background (visual only) */
(function(){
  var cv=document.getElementById('net'),x=cv.getContext('2d'),P=[],W,H,M={x:-999,y:-999},
      rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}rs();addEventListener('resize',rs);
  addEventListener('pointermove',function(e){M.x=e.clientX;M.y=e.clientY;});
  for(var j=0;j<Math.min(80,innerWidth/14);j++)P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5});
  function d(){x.clearRect(0,0,W,H);
    P.forEach(function(p,a){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      x.fillStyle='rgba(255,49,68,.85)';x.fillRect(p.x,p.y,2,2);
      for(var b=a+1;b<P.length;b++){var q=P[b],dx=p.x-q.x,dy=p.y-q.y,dd=dx*dx+dy*dy;
        if(dd<14000){x.strokeStyle='rgba(232,20,31,'+(.3*(1-dd/14000))+')';x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke();}}
      var mx=p.x-M.x,my=p.y-M.y,md=mx*mx+my*my;
      if(md<30000){x.strokeStyle='rgba(255,255,255,'+(.45*(1-md/30000))+')';x.beginPath();x.moveTo(p.x,p.y);x.lineTo(M.x,M.y);x.stroke();}});
    if(!rm)requestAnimationFrame(d);}
  d();
})();
</script>
</body>
</html>

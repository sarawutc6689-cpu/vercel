<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ระบบล็อกอินพนักงาน | TOKAI</title>
<link rel="preconnect" href="https://dhgjbpvbbixipxksqqzu.supabase.co" crossorigin>
<link rel="dns-prefetch" href="https://dhgjbpvbbixipxksqqzu.supabase.co">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600&family=Noto+Serif+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0a0809;
  --panel:#121012;
  --panel2:#181518;
  --line:rgba(201,169,110,.22);
  --line2:rgba(255,255,255,.08);
  --red:#a3202b;
  --red2:#c5303b;
  --ivory:#f3ede4;
  --muted:#9b948a;
  --gold:#c9a96e;
  --serif:'Cormorant Garamond','Noto Serif Thai',serif;
  --sans:'Noto Sans Thai','Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--ivory);
  line-height:1.65;
  min-height:100vh;
  overflow-x:hidden;
  font-weight:300;
  background-image:
    radial-gradient(900px 600px at 92% -10%,rgba(163,32,43,.30),transparent 60%),
    radial-gradient(700px 500px at -10% 110%,rgba(163,32,43,.15),transparent 60%);
  background-attachment:fixed;
}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}
.wrap{width:100%;max-width:440px;animation:up .9s both}
.card{
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line2);
  border-top:1px solid var(--gold);
  box-shadow:0 40px 80px -30px rgba(0,0,0,.9),0 0 80px -30px rgba(163,32,43,.5);
}
.head{padding:36px 28px 26px;text-align:center;border-bottom:1px solid var(--line2)}
.head img{width:132px;height:auto;display:block;margin:0 auto 18px}
.eyebrow{font-size:.64rem;letter-spacing:.36em;color:var(--gold);margin-bottom:10px;font-weight:400;text-transform:uppercase}
.head h1{font-family:var(--serif);font-size:1.9rem;font-weight:600;letter-spacing:.01em;line-height:1.25}
.head p{font-size:.82rem;color:var(--muted);margin-top:10px}
.body{padding:30px 28px 24px}
.field{margin-bottom:22px}
.field label{display:flex;align-items:center;gap:8px;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:#cfc8bd;margin-bottom:9px;font-weight:400}
.field label svg{width:14px;height:14px;stroke:var(--gold);flex-shrink:0}
.input-wrap{position:relative}
.input-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);pointer-events:none;transition:stroke .3s}
.input-wrap:focus-within svg{stroke:var(--gold)}
input{width:100%;padding:13px 14px 13px 42px;background:transparent;border:1px solid var(--line2);border-radius:2px;color:var(--ivory);font:300 15px var(--sans);transition:border-color .3s,background .3s}
input::placeholder{color:#645f58;font-size:13.5px}
input:focus{outline:none;border-color:var(--gold);background:rgba(201,169,110,.04)}
input.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
button{width:100%;margin-top:8px;padding:15px;background:var(--red);color:#fff;border:1px solid var(--red);border-radius:2px;font:500 .8rem var(--sans);letter-spacing:.24em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:.3s}
button:hover:not(:disabled){background:var(--red2);border-color:var(--gold)}
button:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
button:disabled{opacity:.8;cursor:default}
button svg{width:17px;height:17px;stroke:#fff}
.spin{animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.msg{display:none;margin-bottom:18px;padding:12px 14px;font-size:.85rem;font-weight:400;border:1px solid var(--line2);border-left:2px solid transparent;align-items:center;gap:10px}
.msg svg{width:15px;height:15px;flex-shrink:0}
.msg.show{display:flex}
.msg.error{color:#ec9ca1;border-left-color:var(--red2);background:rgba(163,32,43,.1)}.msg.error svg{stroke:#ec9ca1}
.msg.ok{color:#9ed1b3;border-left-color:#4f9d73;background:rgba(79,157,115,.08)}.msg.ok svg{stroke:#9ed1b3}
.msg.wait{color:#b4c7df;border-left-color:#6f93bf;background:rgba(111,147,191,.08)}.msg.wait svg{stroke:#b4c7df}
.help{text-align:center;margin-top:22px}
.help a{color:var(--muted);text-decoration:none;font-size:.8rem;letter-spacing:.06em;border-bottom:1px solid transparent;transition:.3s}
.help a:hover{color:var(--gold);border-color:var(--gold)}
.foot{padding:16px;text-align:center;color:#5f5a53;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;border-top:1px solid var(--line2)}
</style>
</head>
<body>

<div class="wrap">
<div class="card">
  <div class="head">
    <img src="https://sarawutc6689-cpu.github.io/Mouldmate-Login/logotokai.png" alt="TOKAI" width="140" height="46" fetchpriority="high">
    <div class="eyebrow">Secure Access</div>
    <h1>ระบบล็อกอินพนักงาน</h1>
    <p>เฉพาะพนักงาน TOKAISOLIDTIRE ที่ลงทะเบียนเท่านั้น</p>
  </div>

  <div class="body">
    <form id="f" autocomplete="on">
      <div class="field">
        <label>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>
          รหัสพนักงาน
        </label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="uname" name="uname" placeholder="กรุณากรอกรหัสพนักงาน" autocomplete="username" inputmode="text">
        </div>
      </div>

      <div class="field">
        <label>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          วันที่เริ่มงาน
        </label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="pass" name="pass" placeholder="กรุณากรอกวันที่เริ่มงาน (DDMMYYYY)" autocomplete="current-password" inputmode="numeric">
        </div>
      </div>

      <div id="msg" class="msg"></div>

      <button type="submit" id="btn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
        <span>เข้าสู่ระบบ</span>
      </button>

      <div class="help"><a href="#" id="help-link">ต้องการความช่วยเหลือ?</a></div>
    </form>
  </div>

  <div class="foot">ระบบรักษาความปลอดภัย © 2026 · พัฒนาโดย SARAWUT.C</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function(){
  "use strict";

  const SUPABASE_URL  = "https://dhgjbpvbbixipxksqqzu.supabase.co";
  const SUPABASE_KEY  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRoZ2picHZiYml4aXB4a3NxcXp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5OTIxMjgsImV4cCI6MjEwMTU2ODEyOH0.kZBAN01vbe8kENacfofZewHvxQBCCd2OaTFKbcFYlpM";
  const DASHBOARD_URL = "https://mouldmate.vercel.app/home.html";
  const TIMEOUT_MS    = 8000;

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const form   = document.getElementById('f');
  const unameEl = document.getElementById('uname');
  const passEl  = document.getElementById('pass');
  const msgEl  = document.getElementById('msg');
  const btn    = document.getElementById('btn');
  const btnLabel = btn.querySelector('span');
  const btnIcon  = btn.querySelector('svg');
  const origIcon = btnIcon.outerHTML;

  const ICONS = {
    spinner: '<svg class="spin" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>',
    check:   '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
    alert:   '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>',
    clock:   '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
    ban:     '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M4.9 4.9l14.2 14.2"/></svg>'
  };

  function showMsg(type, icon, text){
    msgEl.className = 'msg show ' + type;
    msgEl.innerHTML = ICONS[icon] + '<span>' + text + '</span>';
  }
  function hideMsg(){
    msgEl.className = 'msg';
    msgEl.innerHTML = '';
  }
  function shake(el){
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
  }
  function setLoading(on){
    btn.disabled = on;
    btnLabel.textContent = on ? 'กำลังตรวจสอบ...' : 'เข้าสู่ระบบ';
    btnIcon.outerHTML = on ? ICONS.spinner : origIcon;
  }

  document.getElementById('help-link').addEventListener('click', function(e){
    e.preventDefault();
    showMsg('wait', 'alert', 'รหัสพนักงาน: รหัสที่ได้รับจากบริษัท · วันที่เริ่มงาน: DDMMYYYY · ลืมรหัสติดต่อ HR');
    setTimeout(hideMsg, 6000);
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    login();
  });

  function login(){
    const user = unameEl.value.trim();
    const pass = passEl.value.trim();
    hideMsg();

    if (!user || !pass){
      showMsg('error', 'alert', 'กรุณากรอกข้อมูลให้ครบทุกช่อง');
      if (!user) shake(unameEl);
      if (!pass) shake(passEl);
      return;
    }

    setLoading(true);
    showMsg('wait', 'spinner', 'กำลังตรวจสอบข้อมูล...');

    const timeoutPromise = new Promise((_, reject) =>
      setTimeout(() => reject({ name: 'AbortError' }), TIMEOUT_MS)
    );

    Promise.race([
      supabase.rpc('login_employee', { p_code: user, p_pass: pass }),
      timeoutPromise
    ])
      .then(({ data, error }) => {
        if (error){
          showMsg('error', 'alert', 'เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่');
          setLoading(false);
          return;
        }

        if (data.status === 'success'){
          showMsg('ok', 'check', 'สำเร็จ! กำลังเข้าสู่ระบบ...');
          btnLabel.textContent = 'สำเร็จ';
          btnIcon.outerHTML = ICONS.check;
          btn.style.background = '#1ea35a';

          localStorage.setItem('username', user);
          localStorage.setItem('authToken', user);
          localStorage.setItem('expireTime', Date.now() + 1000*60*30);
          localStorage.setItem('userName', (data.name || '').toString().trim() || user);

          requestAnimationFrame(() => {
            window.open(DASHBOARD_URL, '_self');
          });

        } else if (data.status === 'denied'){
          showMsg('error', 'ban', data.message || 'บัญชีนี้ถูกระงับการใช้งาน');
          setLoading(false);
        } else {
          showMsg('error', 'alert', data.message || 'รหัสพนักงาน หรือวันที่เริ่มงานไม่ถูกต้อง');
          setLoading(false);
          shake(unameEl); shake(passEl);
        }
      })
      .catch(err => {
        if (err.name === 'AbortError'){
          showMsg('error', 'clock', 'เซิร์ฟเวอร์ตอบสนองช้าเกินไป (เกิน ' + (TIMEOUT_MS/1000) + ' วินาที) กรุณาลองใหม่');
        } else {
          showMsg('error', 'alert', 'เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่');
        }
        setLoading(false);
      });
  }
})();
</script>
</body>
</html>

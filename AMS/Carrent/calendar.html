<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ปฏิทินการจองรถ - แผนกยานยนต์</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Prompt', sans-serif; }

        :root {
            --primary: #0A2472;
            --primary-light: #0E4B9E;
            --light: #f8f9fa;
            --dark: #343a40;
            --gray: #6c757d;
            --border: #dee2e6;
            --pending: #ffc107;
            --approved: #28a745;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        .navbar {
            max-width: 1400px; margin: 0 auto 20px; background: var(--primary);
            border-radius: 20px; padding: 14px 20px; display: flex; gap: 12px;
            justify-content: center; flex-wrap: wrap;
        }
        .navbar a {
            color: white; text-decoration: none; padding: 10px 22px; border-radius: 50px;
            background: rgba(255,255,255,0.12); font-size: 14px; font-weight: 500;
            display: flex; align-items: center; gap: 8px;
        }

        .header {
            background: white; border-radius: 20px; padding: 20px 30px; margin-bottom: 30px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;
        }
        .logo { display: flex; align-items: center; gap: 15px; }
        .logo-icon {
            width: 60px; height: 60px; background: var(--primary); border-radius: 15px;
            display: flex; align-items: center; justify-content: center; color: white; font-size: 30px;
        }
        .logo-text h1 { color: var(--primary); font-size: 24px; }
        .logo-text p { color: var(--gray); font-size: 14px; }

        .controls-bar {
            background: white; border-radius: 20px; padding: 20px 25px; margin-bottom: 25px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
        }

        .month-nav { display: flex; align-items: center; gap: 15px; }
        .month-nav button {
            width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--border);
            background: white; cursor: pointer; display: flex; align-items: center; justify-content: center;
            color: var(--primary); font-size: 16px;
        }
        .month-nav button:hover { background: var(--light); }
        .month-label { font-size: 20px; font-weight: 600; color: var(--primary); min-width: 180px; text-align: center; }

        .car-filter {
            padding: 10px 18px; border: 2px solid var(--border); border-radius: 10px;
            font-family: 'Prompt', sans-serif; font-size: 14px; min-width: 200px;
        }

        .legend { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--dark); }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

        .calendar-card { background: white; border-radius: 20px; padding: 25px; margin-bottom: 25px; }

        .calendar-grid {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;
        }

        .weekday {
            text-align: center; font-weight: 600; color: var(--gray); font-size: 13px; padding: 8px 0;
        }

        .day-cell {
            min-height: 110px; border: 1px solid var(--border); border-radius: 10px;
            padding: 8px; cursor: pointer; transition: all 0.2s; overflow: hidden;
        }
        .day-cell:hover { border-color: var(--primary); background: rgba(10,36,114,0.03); }
        .day-cell.empty { background: #fafafa; cursor: default; }
        .day-cell.empty:hover { border-color: var(--border); background: #fafafa; }
        .day-cell.today { border-color: var(--primary); border-width: 2px; }

        .day-number { font-size: 14px; font-weight: 600; color: var(--dark); margin-bottom: 6px; }

        .booking-chip {
            font-size: 10px; padding: 3px 6px; border-radius: 6px; color: white;
            margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .booking-more { font-size: 10px; color: var(--gray); padding: 2px 6px; }

        @media (max-width: 900px) {
            .day-cell { min-height: 70px; }
            .booking-chip { display: none; }
            .day-cell.has-booking { background: rgba(10,36,114,0.06); }
        }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; border-radius: 20px; padding: 30px; max-width: 500px; width: 90%;
            max-height: 80vh; overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h2 { color: var(--primary); font-size: 20px; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--gray); }

        .booking-detail {
            border-left: 4px solid var(--primary); background: var(--light);
            border-radius: 10px; padding: 15px; margin-bottom: 12px;
        }
        .booking-detail .car-name { font-weight: 600; color: var(--primary); margin-bottom: 6px; }
        .booking-detail .row { font-size: 13px; color: var(--dark); margin-bottom: 3px; }
        .booking-detail .status-tag {
            display: inline-block; padding: 3px 10px; border-radius: 50px; font-size: 11px; margin-top: 5px;
        }
        .status-tag.approved { background: rgba(40,167,69,0.15); color: var(--approved); }
        .status-tag.pending { background: rgba(255,193,7,0.15); color: #b8860b; }

        .no-booking-day { text-align: center; padding: 30px; color: var(--gray); }

        .footer { text-align: center; margin-top: 30px; color: white; font-size: 13px; }

        .loading-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 9999; justify-content: center; align-items: center;
        }
        .loading-spinner { background: white; padding: 30px; border-radius: 20px; text-align: center; }
        .loading-spinner i { font-size: 40px; color: var(--primary); animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i></div>
    </div>

    <div class="modal" id="dayModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalDate">รายละเอียดการจอง</h2>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div id="modalContent"></div>
        </div>
    </div>

    <div class="container">
        <div class="navbar">
            <a href="home.html"><i class="fas fa-home"></i> หน้าแรก</a>
            <a href="index.html"><i class="fas fa-calendar-plus"></i> จองรถ</a>
            <a href="approve.html"><i class="fas fa-check-circle"></i> อนุมัติ</a>
            <a href="report.html"><i class="fas fa-chart-bar"></i> รายงาน</a>
            <a href="calendar.html"><i class="fas fa-calendar-alt"></i>ตารางการจอง</a>
            <a href="helpdesk.html"><i class="fas fa-wrench"></i>แจ้งซ่อม/PM</a>
            <a href="ams-report.html"><i class="fas fa-chart-pie"></i>รายงานซ่อม/PM</a>
        </div>

        <div class="header">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-calendar-alt"></i></div>
                <div class="logo-text">
                    <h1>ปฏิทินการจองรถ</h1>
                    <p>ดูภาพรวมว่ารถแต่ละคันถูกจองวันไหนบ้าง</p>
                </div>
            </div>
        </div>

        <div class="controls-bar">
            <div class="month-nav">
                <button id="prevMonth"><i class="fas fa-chevron-left"></i></button>
                <div class="month-label" id="monthLabel">-</div>
                <button id="nextMonth"><i class="fas fa-chevron-right"></i></button>
            </div>
            <select class="car-filter" id="carFilter">
                <option value="">รถทั้งหมด</option>
            </select>
        </div>

        <div class="calendar-card">
            <div class="legend" id="legend" style="margin-bottom: 15px;"></div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <div class="footer">
            <p>ระบบขอจองรถใช้งานบริษัท © 2026 | สำหรับใช้ภายในองค์กรเท่านั้น | พัฒนาโดย Sarawut.C</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://clowvcraydxpvwdbpkhi.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsb3d2Y3JheWR4cHZ3ZGJwa2hpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NTA3NTAsImV4cCI6MjEwMzMyNjc1MH0.pXV0g3JfakqNRgKjgCe87Reie5ZhXzqYXpZ3OVkluHk';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentDate = new Date();
        let allReservations = [];
        let allCars = [];
        let carColors = {};
        let selectedCarId = '';

        const colorPalette = ['#4361ee', '#06d6a0', '#f72585', '#118ab2', '#ffb703', '#7209b7', '#ef476f', '#3a86ff', '#8338ec', '#fb5607'];

        const monthNamesThai = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
        const weekdaysThai = ['อา','จ','อ','พ','พฤ','ศ','ส'];

        function showLoading() { document.getElementById('loadingOverlay').style.display = 'flex'; }
        function hideLoading() { document.getElementById('loadingOverlay').style.display = 'none'; }

        async function loadCars() {
            const { data, error } = await supabaseClient.from('cars').select('*').order('name');
            if (error) { console.error(error); return; }
            allCars = data || [];
            allCars.forEach((c, i) => { carColors[c.id] = colorPalette[i % colorPalette.length]; });

            const filter = document.getElementById('carFilter');
            filter.innerHTML = '<option value="">รถทั้งหมด</option>' +
                allCars.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

            renderLegend();
        }

        function renderLegend() {
            const legend = document.getElementById('legend');
            const relevant = selectedCarId ? allCars.filter(c => c.id === selectedCarId) : allCars;
            legend.innerHTML = relevant.map(c => `
                <div class="legend-item">
                    <span class="legend-dot" style="background:${carColors[c.id]};"></span>
                    ${c.name}
                </div>
            `).join('');
        }

        async function loadReservations() {
            showLoading();
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const rangeStart = new Date(year, month, 1).toISOString();
            const rangeEnd = new Date(year, month + 1, 1).toISOString();

            let query = supabaseClient
                .from('reservations')
                .select('*, cars(name)')
                .not('approval_status', 'in', '("ไม่อนุมัติ","ยกเลิก")')
                .lt('start_at', rangeEnd)
                .gt('end_at', rangeStart);

            if (selectedCarId) query = query.eq('car_id', selectedCarId);

            const { data, error } = await query;
            hideLoading();

            if (error) { console.error(error); allReservations = []; return; }
            allReservations = data || [];
            renderCalendar();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('monthLabel').textContent = `${monthNamesThai[month]} ${year + 543}`;

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = weekdaysThai.map(w => `<div class="weekday">${w}</div>`).join('');

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startOffset = firstDay.getDay();
            const totalDays = lastDay.getDate();
            const today = new Date();

            for (let i = 0; i < startOffset; i++) {
                grid.innerHTML += `<div class="day-cell empty"></div>`;
            }

            for (let day = 1; day <= totalDays; day++) {
                const cellDate = new Date(year, month, day);
                const isToday = cellDate.toDateString() === today.toDateString();

                const dayBookings = allReservations.filter(r => {
                    const s = new Date(r.start_at), e = new Date(r.end_at);
                    return cellDate >= new Date(s.getFullYear(), s.getMonth(), s.getDate()) &&
                           cellDate <= new Date(e.getFullYear(), e.getMonth(), e.getDate());
                });

                const chips = dayBookings.slice(0, 3).map(r => `
                    <div class="booking-chip" style="background:${carColors[r.car_id] || '#888'};">${r.cars?.name || ''}</div>
                `).join('');
                const more = dayBookings.length > 3 ? `<div class="booking-more">+${dayBookings.length - 3} เพิ่มเติม</div>` : '';

                grid.innerHTML += `
                    <div class="day-cell ${isToday ? 'today' : ''} ${dayBookings.length ? 'has-booking' : ''}" data-day="${day}">
                        <div class="day-number">${day}</div>
                        ${chips}${more}
                    </div>
                `;
            }

            grid.querySelectorAll('.day-cell:not(.empty)').forEach(cell => {
                cell.addEventListener('click', () => showDayDetail(parseInt(cell.dataset.day)));
            });
        }

        function showDayDetail(day) {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const cellDate = new Date(year, month, day);

            const dayBookings = allReservations.filter(r => {
                const s = new Date(r.start_at), e = new Date(r.end_at);
                return cellDate >= new Date(s.getFullYear(), s.getMonth(), s.getDate()) &&
                       cellDate <= new Date(e.getFullYear(), e.getMonth(), e.getDate());
            });

            document.getElementById('modalDate').textContent =
                `${day} ${monthNamesThai[month]} ${year + 543}`;

            const content = document.getElementById('modalContent');
            if (dayBookings.length === 0) {
                content.innerHTML = `<div class="no-booking-day"><i class="fas fa-calendar-check" style="font-size:36px;margin-bottom:10px;display:block;"></i>ไม่มีการจองในวันนี้</div>`;
            } else {
                content.innerHTML = dayBookings.map(r => {
                    const statusClass = r.approval_status === 'อนุมัติ' ? 'approved' : 'pending';
                    return `
                        <div class="booking-detail" style="border-left-color:${carColors[r.car_id] || '#888'};">
                            <div class="car-name">${r.cars?.name || '-'}</div>
                            <div class="row"><strong>เลขที่:</strong> ${r.doc_number}</div>
                            <div class="row"><strong>ผู้จอง:</strong> ${r.employee_name} (${r.employee_code})</div>
                            <div class="row"><strong>ช่วงเวลา:</strong> ${new Date(r.start_at).toLocaleString('th-TH', {timeZone:'Asia/Bangkok', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'})} - ${new Date(r.end_at).toLocaleString('th-TH', {timeZone:'Asia/Bangkok', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'})}</div>
                            <span class="status-tag ${statusClass}">${r.approval_status}</span>
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('dayModal').style.display = 'flex';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await loadCars();
            await loadReservations();

            document.getElementById('prevMonth').addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                loadReservations();
            });
            document.getElementById('nextMonth').addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                loadReservations();
            });
            document.getElementById('carFilter').addEventListener('change', (e) => {
                selectedCarId = e.target.value;
                renderLegend();
                loadReservations();
            });
            document.getElementById('closeModal').addEventListener('click', () => {
                document.getElementById('dayModal').style.display = 'none';
            });
            window.addEventListener('click', (e) => {
                if (e.target.id === 'dayModal') document.getElementById('dayModal').style.display = 'none';
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>มอบหมายงาน</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#eef6ff;--top:#d9ecff;--card:#fff;--ink:#12304f;--mute:#5f7791;--line:#dbe9f7;--edge:#9cc5ee;--gate:#1f8bf2;--ok:#1a7f55;--okbg:#ddf5e9;--warn:#a05a00;--warnbg:#fff1d6;--bad:#c62828;--badbg:#fde8e8}
@media(prefers-color-scheme:dark){:root{--bg:#0f1b2a;--top:#14304a;--card:#172a3f;--ink:#eaf3fc;--mute:#9bb2c9;--line:#2a4560;--edge:#3f6a93;--gate:#2f86e0;--ok:#6fd49b;--okbg:#17372a;--warn:#f2b95a;--warnbg:#41300f;--bad:#ff8a80;--badbg:#42201f}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--top) 0,var(--bg) 300px) var(--bg);color:var(--ink);font-family:'Noto Sans Thai',system-ui,sans-serif;line-height:1.5}
header{background:linear-gradient(135deg,#1f8bf2,#5bbcff);color:#fff;padding:16px;box-shadow:0 4px 16px rgba(31,139,242,.25);display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:1.15rem;font-weight:800}
header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.wrap{width:100%;flex:1;max-width:820px;margin:0 auto;padding:14px 12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px rgba(31,139,242,.09)}
h2{margin:0 0 8px;font-size:1.05rem}
label{display:block;font-weight:600;margin-top:10px}
input,select,textarea{width:100%;margin-top:4px;border:2px solid var(--edge);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;padding:10px 12px}
input,select{height:46px}textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.two{grid-template-columns:1fr}}
.btn{height:48px;padding:0 18px;border:0;border-radius:12px;font:inherit;font-weight:800;cursor:pointer;background:var(--gate);color:#fff}
.btn.sec{background:var(--line);color:var(--ink)}.btn.sm{height:38px;padding:0 12px;font-size:.9rem}.btn.no{background:transparent;border:2px solid var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.pick{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px}
.p{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);margin:0;font-weight:400;cursor:pointer}
.p:last-child{border-bottom:0}.p input{width:20px;height:20px;margin:0;flex:none}.p.off{opacity:.55;cursor:not-allowed}
.p small{color:var(--mute)}
.chip{font-size:.78rem;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--line);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}
.mute{color:var(--mute);font-size:.92rem}.err{color:var(--bad);min-height:1.3em;margin:8px 0 0}
.t{padding:10px 0;border-bottom:1px solid var(--line)}.t:last-child{border-bottom:0}
.t .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
#cfm{border:0;border-radius:22px;padding:26px 22px 20px;background:var(--card);color:var(--ink);width:min(380px,92vw);text-align:center;box-shadow:0 20px 60px rgba(18,48,79,.35)}
#cfm::backdrop{background:rgba(18,48,79,.45);backdrop-filter:blur(3px)}#cfm h3{margin:0 0 6px}#cfm p{margin:6px 0 0;color:var(--mute);white-space:pre-line}
.cf-row{display:flex;flex-direction:column;gap:8px;margin-top:18px}.cf-row .btn.sec{background:transparent;color:var(--mute)}
footer{text-align:center;padding:16px 12px;color:var(--mute);font-size:.85rem;border-top:1px solid var(--line);background:var(--card)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gate);outline-offset:2px}
</style>
</head>
<body>
<header><h1>มอบหมายงาน</h1><button id="out" hidden>ออกจากระบบ</button></header>
<div class="wrap">
  <div class="panel" id="login">
    <strong>ล็อกอินผู้ดูแลระบบ</strong>
    <label>ชื่อผู้ใช้ (username@tokai.local)<input type="text" id="em" autocomplete="username" autocapitalize="none"></label>
    <label>รหัสผ่าน (วันเริ่มงาน)<input type="password" id="pw" autocomplete="current-password"></label>
    <p class="err" id="le"></p><button class="btn" id="go" style="width:100%">เข้าสู่ระบบ</button>
  </div>

  <div id="app" hidden>
    <div class="panel">
      <h2>1. รายละเอียดงาน</h2>
      <label>หัวข้อ<input type="text" id="title" maxlength="120"></label>
      <label>รายละเอียด (ไม่บังคับ)<textarea id="detail"></textarea></label>
      <div class="two">
        <label>กำหนดส่ง (ไม่บังคับ)<input type="datetime-local" id="due"></label>
        <label>ความเร่งด่วน<select id="prio"><option value="normal">ปกติ</option><option value="urgent">ด่วน</option></select></label>
      </div>
    </div>

    <div class="panel">
      <h2>2. เลือกผู้รับงาน <span class="mute" id="selCount"></span></h2>
      <div class="two">
        <input type="text" id="q" placeholder="ค้นหาชื่อหรือรหัสพนักงาน">
        <select id="dept"></select>
      </div>
      <div class="bar">
        <label style="margin:0;font-weight:400"><input type="checkbox" id="onlyLinked" checked style="width:auto;height:auto;margin-right:6px">แสดงเฉพาะที่ผูก Telegram แล้ว</label>
      </div>
      <div class="bar">
        <button class="btn sec sm" id="allBtn">เลือกทั้งหมดในรายการ</button>
        <button class="btn sec sm" id="clrBtn">ล้างที่เลือก</button>
        <span class="mute" id="deptInfo"></span>
      </div>
      <div class="pick" id="pick"></div>
      <p class="err" id="se"></p>
      <button class="btn" id="send" style="width:100%">ส่งงาน</button>
    </div>

    <div class="panel"><h2>งานที่สั่งล่าสุด</h2><div id="recent"><span class="mute">กำลังโหลด…</span></div></div>
  </div>
</div>
<dialog id="cfm"><h3 id="cfT"></h3><p id="cfB"></p>
  <div class="cf-row"><button class="btn" id="cfOk">ยืนยัน</button><button class="btn sec" id="cfNo">ยกเลิก</button></div></dialog>
<footer>ระบบมอบหมายงานบริษัท © 2026 | พัฒนาโดย Sarawut.C</footer>

<script>
/* ===== ตั้งค่า ===== */
const SUPABASE_URL = 'https://clowvcraydxpvwdbpkhi.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsb3d2Y3JheWR4cHZ3ZGJwa2hpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NTA3NTAsImV4cCI6MjEwMzMyNjc1MH0.pXV0g3JfakqNRgKjgCe87Reie5ZhXzqYXpZ3OVkluHk';
const EMAIL_DOMAIN = '@tokai.local';   // พิมพ์แค่ชื่อผู้ใช้ ระบบต่อโดเมนให้
/* ================== */
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fdt = t => t ? new Date(t).toLocaleString('th-TH', { timeZone: 'Asia/Bangkok', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
let emps = [], sel = new Set(), shown = [];

function ask(title, body, ok = 'ยืนยัน', cancel = 'ยกเลิก'){
  return new Promise(res => {
    const d = $('#cfm'); $('#cfT').textContent = title; $('#cfB').textContent = body;
    $('#cfOk').textContent = ok; $('#cfNo').textContent = cancel || ''; $('#cfNo').hidden = !cancel;
    const done = v => { d.close(); res(v); };
    $('#cfOk').onclick = () => done(true); $('#cfNo').onclick = () => done(false);
    d.oncancel = e => { e.preventDefault(); done(false); }; d.showModal();
  });
}
async function call(body){
  const { data, error } = await sb.functions.invoke('assign-task', { body });
  if (error){ let m = error.message; try { const j = await error.context.json(); m = j.error || m; } catch (_) {} throw new Error(m); }
  return data;
}

$('#go').onclick = async () => {
  $('#le').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: (v => v.includes('@') ? v : v + EMAIL_DOMAIN)($('#em').value.trim().toLowerCase()), password: $('#pw').value });
  if (error){ $('#le').textContent = 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'; return; }
  start();
};
$('#out').onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function start(){
  const { data: { user } } = await sb.auth.getUser(); if (!user) return;
  const { data: a } = await sb.from('task_admins').select('user_id').eq('user_id', user.id).eq('active', true).maybeSingle();
  if (!a){ $('#le').textContent = 'บัญชีนี้ไม่ได้อยู่ในรายชื่อผู้สั่งงาน'; await sb.auth.signOut(); return; }
  $('#login').hidden = true; $('#app').hidden = false; $('#out').hidden = false;
  const { data, error } = await sb.from('employees').select('id,code,name,department,position,telegram_chat_id').order('name');
  if (error){ $('#pick').innerHTML = `<div class="p">โหลดรายชื่อไม่สำเร็จ: ${esc(error.message)}</div>`; return; }
  emps = data || [];
  const depts = {}; emps.forEach(e => { const d = e.department || '(ไม่ระบุแผนก)'; depts[d] = (depts[d] || 0) + 1; });
  $('#dept').innerHTML = '<option value="">ทุกแผนก</option>' + Object.keys(depts).sort().map(d => `<option value="${esc(d)}">${esc(d)} (${depts[d]})</option>`).join('');
  render(); loadRecent();
}

function render(){
  const q = $('#q').value.trim().toLowerCase(), d = $('#dept').value, only = $('#onlyLinked').checked;
  const inDept = emps.filter(e => !d || (e.department || '(ไม่ระบุแผนก)') === d);
  const linked = inDept.filter(e => e.telegram_chat_id).length;
  $('#deptInfo').textContent = d ? `ผูกแล้ว ${linked} จาก ${inDept.length} คนในแผนกนี้` : `ผูกแล้ว ${emps.filter(e => e.telegram_chat_id).length} จาก ${emps.length} คน`;
  shown = inDept.filter(e => (!only || e.telegram_chat_id) && (!q || e.name.toLowerCase().includes(q) || String(e.code).toLowerCase().includes(q)));
  $('#pick').innerHTML = shown.length ? shown.slice(0, 300).map(e => `
    <label class="p ${e.telegram_chat_id ? '' : 'off'}"><input type="checkbox" value="${e.id}" ${sel.has(e.id) ? 'checked' : ''} ${e.telegram_chat_id ? '' : 'disabled'}>
      <span style="flex:1">${esc(e.name)} <small>${esc(e.code)} · ${esc(e.department || '-')}</small></span>
      <span class="chip ${e.telegram_chat_id ? 'ok' : ''}">${e.telegram_chat_id ? 'ผูกแล้ว' : 'ยังไม่ผูก'}</span></label>`).join('')
    : '<div class="p"><span class="mute">ไม่พบรายชื่อ (ลองยกเลิกตัวกรอง "แสดงเฉพาะที่ผูก")</span></div>';
  $('#selCount').textContent = sel.size ? `(เลือกแล้ว ${sel.size} คน)` : '';
}
$('#pick').onchange = e => { e.target.checked ? sel.add(e.target.value) : sel.delete(e.target.value); $('#selCount').textContent = sel.size ? `(เลือกแล้ว ${sel.size} คน)` : ''; };
['#q', '#dept', '#onlyLinked'].forEach(s => $(s).oninput = render);
$('#allBtn').onclick = () => { shown.filter(e => e.telegram_chat_id).forEach(e => sel.add(e.id)); render(); };
$('#clrBtn').onclick = () => { sel.clear(); render(); };

$('#send').onclick = async () => {
  const title = $('#title').value.trim(); $('#se').textContent = '';
  if (!title){ $('#se').textContent = 'กรอกหัวข้องาน'; return; }
  if (!sel.size){ $('#se').textContent = 'เลือกผู้รับงานอย่างน้อย 1 คน'; return; }
  const due = $('#due').value ? new Date($('#due').value + ':00+07:00').toISOString() : null;
  if (!await ask('ยืนยันส่งงาน', `"${title}"\nส่งให้ ${sel.size} คน${$('#prio').value === 'urgent' ? '\nระดับ: ด่วน' : ''}`, 'ส่งงาน')) return;
  $('#send').disabled = true;
  try {
    const r = await call({ action: 'create', title, detail: $('#detail').value, due_at: due, priority: $('#prio').value, employee_ids: [...sel] });
    await ask('ส่งงานแล้ว', `สร้างงาน ${r.created} รายการ\nส่งสำเร็จ ${r.sent} · ส่งไม่สำเร็จ ${r.failed}${r.skipped?.length ? '\nข้าม (ยังไม่ผูก): ' + r.skipped.join(', ') : ''}`, 'ตกลง', null);
    sel.clear(); $('#title').value = ''; $('#detail').value = ''; $('#due').value = ''; render(); loadRecent();
  } catch (e){ $('#se').textContent = e.message; }
  $('#send').disabled = false;
};

const ST = { pending: ['รอรับทราบ', 'warn'], acknowledged: ['รับทราบแล้ว', ''], done: ['เสร็จแล้ว', 'ok'], cancelled: ['ยกเลิก', 'bad'] };
async function loadRecent(){
  try {
    const { tasks } = await call({ action: 'list' });
    $('#recent').innerHTML = tasks.length ? tasks.map(t => { const s = ST[t.status] || [t.status, '']; return `
      <div class="t"><div class="top"><div><b>${esc(t.title)}</b>${t.priority === 'urgent' ? ' <span class="chip bad">ด่วน</span>' : ''}<br>
        <span class="mute">${esc(t.assignee_name)} · สั่งเมื่อ ${fdt(t.created_at)}${t.due_at ? ' · กำหนด ' + fdt(t.due_at) : ''}</span>
        ${t.notify_status === 'failed' ? '<br><span class="chip bad">ส่ง Telegram ไม่สำเร็จ</span>' : ''}</div>
        <div style="text-align:right"><span class="chip ${s[1]}">${s[0]}</span>
        ${['pending', 'acknowledged'].includes(t.status) ? `<br><button class="btn no sm" style="margin-top:6px" onclick="cancelTask('${t.id}')">ยกเลิก</button>` : ''}</div></div></div>`; }).join('')
      : '<span class="mute">ยังไม่มีงาน</span>';
  } catch (e){ $('#recent').innerHTML = `<span class="mute">โหลดไม่สำเร็จ: ${esc(e.message)}</span>`; }
}
async function cancelTask(id){
  if (!await ask('ยกเลิกงานนี้?', 'สถานะจะเปลี่ยนเป็นยกเลิก ข้อความที่ส่งไปแล้วยังอยู่ใน Telegram ของพนักงาน', 'ยกเลิกงาน')) return;
  try { await call({ action: 'cancel', id }); loadRecent(); } catch (e){ await ask('ไม่สำเร็จ', e.message, 'ตกลง', null); }
}
sb.auth.getSession().then(({ data }) => { if (data.session) start(); });
</script>
</body>
</html>

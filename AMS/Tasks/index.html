<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบมอบหมายงาน</title>
    <!-- ใช้ Tailwind CSS ผ่าน CDN เพื่อความรวดเร็ว -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">📝 มอบหมายงานใหม่</h1>
        
        <form id="assignForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">เลือกพนักงาน (ช่างซ่อม)</label>
                <select id="employeeSelect" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required>
                    <option value="">-- กำลังโหลดรายชื่อ... --</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">หัวข้องาน</label>
                <input type="text" id="taskTitle" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required placeholder="เช่น ซ่อมเปลี่ยนถ่ายน้ำมันเครื่อง">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">รายละเอียด</label>
                <textarea id="taskDetail" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required placeholder="ระบุรายละเอียดงาน..."></textarea>
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition">
                มอบหมายงาน & แจ้งเตือน Telegram
            </button>
        </form>
        <div id="statusMessage" class="mt-4 text-center font-bold"></div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>

<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>รายงาน รปภ. รายวัน</title><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');
:root{--bg:#f5f9ff;--card:#fff;--ink:#0f1e36;--mute:#64748b;--line:#e2eaf8;--brand:#2563eb;--brand-d:#1d4ed8;--brand-light:#eff6ff;--bad:#e11d48;--bad-light:#fff1f2;--ok:#10b981;--ok-light:#ecfdf5;--pending-light:#fef3c7;--shadow:0 10px 30px -10px rgba(37,99,235,.08),0 1px 3px rgba(0,0,0,.02);--radius:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans Thai","Sarabun",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.top{background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 100%);color:#fff;padding:40px 16px 72px;text-align:center;position:relative;overflow:hidden}
.top::before{content:"";position:absolute;top:-50%;left:-20%;width:140%;height:140%;background:radial-gradient(circle,rgba(255,255,255,.1) 0%,transparent 60%);pointer-events:none}
.top>*{max-width:640px;margin-left:auto;margin-right:auto;position:relative;z-index:1}
.top h1{font-size:1.8rem;font-weight:700;letter-spacing:-.025em;margin-bottom:6px}
.top p{opacity:.9;font-size:.95rem}
main{position:relative;max-width:640px;margin:-48px auto 0;padding:0 16px 56px}
h2{font-size:1.1rem;font-weight:600;margin-bottom:16px}
#app>h2{margin:32px 0 14px;font-size:1.15rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:16px;box-shadow:var(--shadow)}
label{display:block;margin-bottom:16px;font-size:.88rem;font-weight:600;color:#344054}
input,select,textarea{display:block;width:100%;margin-top:6px;padding:12px 14px;font:inherit;color:var(--ink);background:#fff;border:1px solid #d0d5dd;border-radius:8px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(37,99,235,.12)}
.row{display:flex;gap:12px}.row>label{flex:1;min-width:0}
button{font:inherit;font-weight:600;padding:12px 20px;border:0;border-radius:8px;background:var(--brand);color:#fff;cursor:pointer;transition:background .15s;box-shadow:0 1px 2px rgba(16,24,40,.05)}
button:hover{background:var(--brand-d)}
form button{width:100%}
button.bad{background:#fff;color:var(--bad);border:1px solid var(--bad)}button.bad:hover{background:var(--bad-light)}
button.link{width:auto;background:none;color:var(--brand);padding:0;font-weight:500;box-shadow:none}
button.link:hover{color:var(--brand-d);text-decoration:underline}
:focus-visible{outline:3px solid rgba(37,99,235,.35);outline-offset:2px}
.msg:not(:empty){margin-top:14px;padding:12px 16px;border-radius:8px;font-size:.9rem;background:var(--bad-light);border:1px solid #fecdd3;color:var(--bad)}
.msg.ok:not(:empty){background:var(--brand-light);border-color:#bfdbfe;color:var(--brand)}
.muted{color:var(--mute);font-size:.9rem}a{color:var(--brand);text-decoration:none;font-weight:500}a:hover{text-decoration:underline}
.hello{display:flex;justify-content:space-between;align-items:center;background:var(--brand-light);border:1px solid #dbeafe;border-radius:12px;padding:12px 16px;margin-bottom:20px}
.hello span{font-weight:500;color:var(--brand)}
.item{display:grid;gap:4px;border-left:4px solid var(--brand)}
.item small{color:var(--mute);font-size:.82rem}.item .top-row{display:flex;justify-content:space-between;gap:12px;align-items:start}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap}
.badge.s-pending_manager,.badge.s-pending_hr{background:var(--pending-light);color:#92400e}
.badge.s-approved{background:var(--ok-light);color:#065f46}.badge.s-rejected{background:var(--bad-light);color:#9f1239}
.badge.s-cancelled{background:#f1f5f9;color:#475569}
.note{font-size:.85rem;color:var(--mute);margin-top:8px;padding-top:6px;border-top:1px dashed var(--line)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.actions input{flex:1 1 100%;margin:0}.actions button{flex:1}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:14px}
.tab{flex:1;background:none;color:var(--mute);box-shadow:none}.tab:hover{background:var(--brand-light)}
.tab[aria-pressed=true]{background:var(--brand);color:#fff}
.tabs a{flex:1;text-align:center;padding:10px;border-radius:8px;color:var(--mute);font-weight:600}.tabs a:hover{background:var(--brand-light);text-decoration:none}.tabs a[aria-current]{background:var(--brand);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:1.6rem}.stat small{color:var(--mute)}
.wrap{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;font-size:.9rem}.tbl th,.tbl td{padding:8px;border-bottom:1px solid var(--line);text-align:left}.tbl .n{text-align:right}.tbl th{color:var(--mute);font-weight:600}
.dayrow{display:flex;gap:8px;align-items:center}.dayrow input{margin:0;flex:2}.dayrow button{flex:1;padding:10px}
@media print{.top,.tabs,.dayctl,#login,#prt{display:none!important}body{background:#fff}.card{box-shadow:none}}

</style></head><body><header class="top"><h1>รายงาน รปภ. รายวัน</h1><p>รายชื่อผู้ได้รับอนุญาตออกนอกสถานที่</p></header><main>
<section id="app"><div class="card dayctl"><div class="dayrow"><button type="button" id="prev">‹ วันก่อน</button><input id="d" type="date"><button type="button" id="next">วันถัดไป ›</button></div></div>
<p class="muted" id="count" style="margin-bottom:10px"></p><div class="card wrap"><table class="tbl"><thead><tr><th>เวลา</th><th>ชื่อ</th><th>แผนก</th><th>สถานที่</th><th>ประเภท</th></tr></thead><tbody id="rows"></tbody></table></div>
<button type="button" id="prt" onclick="window.print()">พิมพ์รายงาน</button><p class="msg" id="msg" aria-live="polite"></p></section></main>
<script src="assets/app.js"></script><script>
const shift = n => { const x = new Date($('d').value + 'T00:00'); x.setDate(x.getDate() + n); $('d').value = x.toLocaleDateString('sv'); run(load); };
async function load() {
  const r = await rpc('outing_daily_public', { p_date: $('d').value });
  $('count').textContent = new Date($('d').value + 'T00:00').toLocaleDateString('th-TH', { dateStyle: 'full' }) + ' · ผู้ได้รับอนุญาต ' + r.rows.length + ' คน';
  $('rows').innerHTML = r.rows.map(o => `<tr><td>${hm(o.time_out)}–${hm(o.time_back)}</td><td>${esc(o.full_name)}</td><td>${esc(o.department_name)}</td><td>${esc(o.destination)}</td><td>${esc(TYPE[o.outing_type])}</td></tr>`).join('')
    || '<tr><td colspan="5" class="muted">ไม่มีผู้ได้รับอนุญาตออกนอกสถานที่ในวันนี้</td></tr>';
}
ERR.out_of_range = 'ดูย้อนหลังหรือล่วงหน้าได้ไม่เกิน 3 วัน';
$('d').value = new Date().toLocaleDateString('sv'); run(load);
$('prev').onclick = () => shift(-1); $('next').onclick = () => shift(1); $('d').onchange = () => run(load);
</script></body></html>

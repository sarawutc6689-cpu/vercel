<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10294a">
<title>ลงเวลาทำงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --ink:#10294a;
  --ink-soft:#c9d6e8;
  --paper:#f4f6f9;
  --surface:#ffffff;
  --line:#d9e0ea;
  --text:#14202e;
  --muted:#5b6b7d;
  --in:#15803d;
  --out:#c2410c;
  --bad:#b42318;
  --warn:#a15c07;
  --bar-h:150px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'IBM Plex Sans Thai','Noto Sans Thai','Sarabun',system-ui,sans-serif;
  background:var(--paper);color:var(--text);
  font-size:16px;line-height:1.5;min-height:100vh;
  padding-bottom:calc(var(--bar-h) + env(safe-area-inset-bottom));
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid #2f7de1;outline-offset:2px}

/* ── หัวหน้า: นาฬิกาเป็นตัวเอก ── */
.top{
  background:var(--ink);color:#fff;
  padding:calc(14px + env(safe-area-inset-top)) 20px 22px;
}
.top-row{display:flex;align-items:center;justify-content:space-between}
.top-name{font-size:16px;font-weight:500;color:var(--ink-soft)}
.top-link{
  color:#fff;text-decoration:none;font-size:15px;font-weight:500;
  padding:8px 14px;border:1.5px solid rgba(255,255,255,.35);border-radius:999px;
}
.top-link:active{background:rgba(255,255,255,.12)}
#clock{
  font-size:clamp(52px,17vw,76px);font-weight:700;line-height:1.05;
  font-variant-numeric:tabular-nums;letter-spacing:.01em;margin-top:18px;
}
#date-lbl{font-size:16px;color:var(--ink-soft);margin-top:4px}

/* ── ขั้นตอน ── */
main{padding:24px 16px 8px;max-width:520px;margin:0 auto}
.step{display:grid;grid-template-columns:32px 1fr;column-gap:14px;position:relative;padding-bottom:28px}
.step:not(:last-child)::before{content:"";position:absolute;left:15px;top:36px;bottom:4px;width:2px;background:var(--line)}
.badge{
  width:32px;height:32px;border-radius:50%;
  display:grid;place-items:center;
  border:2px solid var(--line);background:var(--surface);
  font-weight:700;font-size:15px;color:var(--muted);
}
.step.done .badge{background:var(--in);border-color:var(--in);color:#fff}
.step.bad  .badge{background:var(--bad);border-color:var(--bad);color:#fff}
.step.wait .badge{border-color:var(--warn);color:var(--warn)}
.step h2{font-size:18px;font-weight:700;line-height:32px;margin-bottom:8px}

/* รหัสพนักงาน */
#emp-id{
  width:100%;height:58px;padding:0 16px;
  font-size:26px;font-weight:500;letter-spacing:.08em;font-variant-numeric:tabular-nums;
  background:var(--surface);border:2px solid var(--line);border-radius:12px;
  outline:none;-webkit-appearance:none;appearance:none;
}
#emp-id:focus{border-color:var(--ink)}
#emp-id::placeholder{font-size:17px;letter-spacing:0;color:var(--muted);font-weight:400}
.emp-result{min-height:26px;margin-top:8px;font-size:17px;font-weight:500}
.emp-result.ok{color:var(--in)}
.emp-result.err{color:var(--bad)}

/* GPS */
.gps-line{display:flex;gap:10px;align-items:flex-start;font-size:16px;margin-bottom:10px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--warn);flex-shrink:0;margin-top:7px}
.dot.ok{background:var(--in)}.dot.err{background:var(--bad)}
.dot.pulse{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.gps-sub{font-size:14px;color:var(--muted)}
.retry{height:46px;padding:0 18px;margin:0 0 10px;border-radius:12px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);font-weight:700;font-size:16px}
#map{height:140px;border-radius:12px;border:1px solid var(--line);overflow:hidden;background:#e5ebf2}

/* กล้อง */
.cam{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#0b1118}
#video,#preview{width:100%;height:100%;object-fit:cover;display:block}
#video{transform:scaleX(-1)}
#preview{display:none}
.cam-msg{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:20px;color:#e6edf5;font-size:16px;background:rgba(11,17,24,.82);
}
.cam-msg.hidden{display:none}
.flip{
  position:absolute;top:10px;right:10px;width:46px;height:46px;border-radius:50%;
  background:rgba(0,0,0,.45);border:1.5px solid rgba(255,255,255,.5);color:#fff;
  display:grid;place-items:center;cursor:pointer;
}
.flip svg{width:22px;height:22px}
.shutter-row{display:flex;justify-content:center;margin-top:14px}
.shutter{
  width:76px;height:76px;border-radius:50%;cursor:pointer;
  background:var(--surface);border:4px solid var(--ink);
  box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 40px var(--ink);
  transition:transform .08s;
}
.shutter:active{transform:scale(.92)}
.shutter:disabled{opacity:.3}
.retake{
  display:none;width:100%;height:50px;margin-top:12px;
  background:var(--surface);border:2px solid var(--line);border-radius:12px;
  font-weight:500;font-size:17px;cursor:pointer;
}
.retake.show{display:block}

/* แถบปุ่มด้านล่าง (โซนนิ้วโป้ง) */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:var(--surface);border-top:1px solid var(--line);
  box-shadow:0 -6px 20px rgba(16,41,74,.08);
  padding:10px 16px calc(12px + env(safe-area-inset-bottom));
}
.bar-in{max-width:520px;margin:0 auto}
#hint{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;line-height:1.35;color:var(--muted);padding:0 4px 8px}
#hint.ready{color:var(--in);font-weight:500}
#hint.error{color:var(--bad);font-weight:500}
#hint.busy{color:var(--ink);font-weight:500}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{
  height:64px;border:0;border-radius:14px;cursor:pointer;
  font-size:21px;font-weight:700;color:#fff;
  transition:transform .08s,opacity .15s;
}
.act:active{transform:scale(.97)}
.act:disabled{opacity:.3;cursor:not-allowed;transform:none}
.act.in{background:var(--in)}
.act.out{background:var(--out)}

.credit{text-align:center;font-size:13px;color:var(--muted);padding:6px 0 18px}

/* ผลลัพธ์เต็มจอ */
.done{
  position:fixed;inset:0;z-index:50;display:none;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:32px 24px calc(32px + env(safe-area-inset-bottom));
  color:#fff;background:var(--in);
}
.done.show{display:flex}
.done.out{background:var(--out)}
.done-mark{width:112px;height:112px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;margin-bottom:24px}
.done-mark svg{width:60px;height:60px}
.done.show .done-mark{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.done h2{font-size:34px;font-weight:700;line-height:1.2}
.done .who{font-size:21px;margin-top:10px}
.done .when{font-size:44px;font-weight:700;margin-top:18px;font-variant-numeric:tabular-nums}
.done button{
  margin-top:36px;height:56px;padding:0 44px;border-radius:14px;border:2px solid rgba(255,255,255,.7);
  background:transparent;color:#fff;font-size:19px;font-weight:700;cursor:pointer;
}
.done button:active{background:rgba(255,255,255,.15)}
@media (prefers-reduced-motion:reduce){
  .dot.pulse,.done.show .done-mark{animation:none}
  *{transition:none!important}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <span class="top-name">ลงเวลาทำงาน</span>
    <!-- หน้ารายงานตรวจสิทธิ์ด้วย Supabase Auth ใน admin.html -->
    <a class="top-link" href="admin.html">รายงาน</a>
  </div>
  <div id="clock" aria-live="off">--:--:--</div>
  <div id="date-lbl">&nbsp;</div>
</header>

<main>
  <section class="step" id="s1">
    <div class="badge" id="b1">1</div>
    <div>
      <h2>รหัสพนักงาน</h2>
      <input id="emp-id" type="text" inputmode="numeric" pattern="[0-9]*"
             autocomplete="off" spellcheck="false" placeholder="กรอกรหัสพนักงาน"
             aria-label="รหัสพนักงาน" oninput="onEmp()" onfocus="this.select()">
      <div class="emp-result" id="emp-result" aria-live="polite"></div>
    </div>
  </section>

  <section class="step wait" id="s2">
    <div class="badge" id="b2">2</div>
    <div>
      <h2>ตำแหน่ง</h2>
      <div class="gps-line">
        <span class="dot pulse" id="gps-dot"></span>
        <div><div id="gps-txt">กำลังหาตำแหน่ง...</div><div class="gps-sub" id="gps-sub"></div></div>
      </div>
      <button class="retry" id="gps-retry" type="button" onclick="retryGPS()" hidden>ลองหาตำแหน่งใหม่</button>
      <div id="map"></div>
    </div>
  </section>

  <section class="step" id="s3">
    <div class="badge" id="b3">3</div>
    <div>
      <h2>ถ่ายภาพยืนยัน</h2>
      <div class="cam">
        <video id="video" autoplay playsinline muted></video>
        <img id="preview" alt="ภาพที่ถ่าย">
        <div class="cam-msg" id="cam-msg">กำลังเปิดกล้อง...</div>
        <button class="flip" id="flip" onclick="flipCam()" aria-label="สลับกล้องหน้า/หลัง">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>
        </button>
      </div>
      <canvas id="canvas" style="display:none"></canvas>
      <div class="shutter-row" id="sh-row">
        <button class="shutter" id="shutter" onclick="snap()" disabled aria-label="ถ่ายภาพ"></button>
      </div>
      <button class="retake" id="retake" onclick="retake()">ถ่ายใหม่</button>
    </div>
  </section>

  <p class="credit">ใช้ภายในบริษัทเท่านั้น · พัฒนาโดย Sarawut.C</p>
</main>

<div class="bar">
  <div class="bar-in">
    <div id="hint" role="status" aria-live="polite">กรอกรหัสพนักงานเพื่อเริ่มต้น</div>
    <div class="acts">
      <button class="act in"  id="btn-in"  onclick="go('IN')"  disabled>เข้างาน</button>
      <button class="act out" id="btn-out" onclick="go('OUT')" disabled>ออกงาน</button>
    </div>
  </div>
</div>

<div class="done" id="done" role="dialog" aria-modal="true" aria-labelledby="done-title">
  <div class="done-mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
  </div>
  <h2 id="done-title"></h2>
  <div class="who" id="done-who"></div>
  <div class="when" id="done-when"></div>
  <button onclick="location.reload()">เสร็จสิ้น</button>
</div>

<script>
// ===== ตั้งค่า: Supabase Dashboard → Project Settings → API =====
const SUPABASE_URL      = "https://ppzdyvomrfiitahxwrwz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwemR5dm9tcmZpaXRhaHh3cnd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMjQ0MjIsImV4cCI6MjEwNDYwMDQyMn0.iArUz6swMfwhFT_1qEvCwK1B3aiCxdWt46_FBjT6_Y0";   // ใช้ anon key เท่านั้น ห้ามใส่ service_role
const PHOTO_BUCKET      = "attendance-photos";

// จุดลงเวลาดึงจากตาราง attendance_sites ใน Supabase (เพิ่ม/แก้จุดได้ที่ฐานข้อมูล ไม่ต้องแก้ไฟล์นี้)
// ใช้แสดงผลบนหน้าจอเท่านั้น — เซิร์ฟเวอร์เป็นผู้ตัดสินว่าอยู่ในพื้นที่หรือไม่
let SITES=[], siteLayer=null;
const LAST_KEY="attendance:last_code";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);

let emp=null, gps=null, inArea=null, photo=null, facing='user', stream=null, empT=null, lookupSeq=0, mapObj, pin, busy=false;

document.addEventListener('DOMContentLoaded',()=>{
  clk(); setInterval(clk,1000);
  initMap(); initGPS(); initCam();
  // ล้างรหัสที่เคยจำไว้จากเวอร์ชันก่อน เพื่อให้ต้องกรอกใหม่ทุกครั้ง
  try{ localStorage.removeItem(LAST_KEY); }catch(e){}
});

function clk(){
  const n=new Date();
  $('clock').textContent=n.toLocaleTimeString('th-TH',{hour12:false});
  $('date-lbl').textContent=n.toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}

/* ---------- ขั้นตอนที่ 1: พนักงาน ---------- */
function setStep(n,state){
  const s=$('s'+n), b=$('b'+n);
  s.classList.remove('done','bad','wait');
  if(state) s.classList.add(state);
  b.textContent = state==='done' ? '✓' : state==='bad' ? '!' : String(n);
}

function onEmp(){
  emp=null; setStep(1,null);
  const r=$('emp-result'); r.className='emp-result'; r.textContent='';
  clearTimeout(empT); chk();
  const v=$('emp-id').value.trim();
  if(!v) return;
  const seq=++lookupSeq;
  empT=setTimeout(async()=>{
    const{data,error}=await sb.rpc('attendance_get_employee',{p_code:v});
    if(seq!==lookupSeq) return;               // ข้ามผลของคำค้นเก่า
    if(error){ r.className='emp-result err'; r.textContent='เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'; setStep(1,'bad'); chk(); return; }
    if(data&&data.length){
      emp={id:data[0].employee_code,name:data[0].full_name};
      r.className='emp-result ok'; r.textContent=emp.name;
      setStep(1,'done');
    }else{
      r.className='emp-result err'; r.textContent='ไม่พบรหัสนี้ ตรวจสอบรหัสอีกครั้ง';
      setStep(1,'bad');
    }
    chk();
  },500);
}

/* ---------- ขั้นตอนที่ 2: แผนที่ / GPS ---------- */
function initMap(){
  mapObj=L.map('map',{zoomControl:false,attributionControl:false,dragging:false,touchZoom:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,tap:false})
    .setView([14.2,100.79],11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapObj);
  loadSites();
}
async function loadSites(){
  const{data,error}=await sb.rpc('attendance_get_sites');
  if(error||!data||!data.length){ setHint('error','โหลดจุดลงเวลาไม่ได้ ลองโหลดหน้าใหม่'); return; }
  SITES=data;
  if(siteLayer) mapObj.removeLayer(siteLayer);
  siteLayer=L.layerGroup().addTo(mapObj);
  SITES.forEach(s=>{
    L.circle([s.latitude,s.longitude],{radius:s.radius_m,color:'#10294a',fillColor:'#10294a',fillOpacity:.12,weight:2}).addTo(siteLayer);
  });
  if(gps) updateArea();
  else mapObj.fitBounds(L.latLngBounds(SITES.map(s=>[s.latitude,s.longitude])).pad(.5),{maxZoom:17,animate:false});
}
function nearestSite(lat,lng){
  let best=null;
  for(const s of SITES){
    const d=dist(lat,lng,s.latitude,s.longitude);
    if(!best||d<best.d) best={d,s};
  }
  return best;
}
function setPin(lat,lng,site){
  if(pin) mapObj.removeLayer(pin);
  pin=L.circleMarker([lat,lng],{radius:8,color:'#fff',weight:3,fillColor:'#2f7de1',fillOpacity:1}).addTo(mapObj);
  const pts=[[lat,lng]];
  if(site) pts.push([site.latitude,site.longitude]);
  mapObj.fitBounds(L.latLngBounds(pts).pad(.5),{maxZoom:18,animate:false});
}
function setGPS(state,text,sub){
  $('gps-dot').className='dot '+(state==='ok'?'ok':state==='err'?'err':'pulse');
  $('gps-txt').textContent=text; $('gps-sub').textContent=sub||'';
  setStep(2, state==='ok'?'done':state==='err'?'bad':'wait');
}
function updateArea(){
  if(!gps) return;
  const n=SITES.length?nearestSite(gps.lat,gps.lng):null;
  setPin(gps.lat,gps.lng,n&&n.s);
  const weak=gps.accuracy>50?' · สัญญาณ GPS ไม่แม่นยำ ลองออกไปที่โล่ง':'';
  const acc='คลาดเคลื่อน ±'+Math.round(gps.accuracy)+' ม.'+weak;
  if(!n){ inArea=null; setGPS('ok','ได้ตำแหน่งแล้ว',acc); chk(); return; }
  const d=Math.round(n.d);
  inArea=d<=n.s.radius_m;
  setGPS(inArea?'ok':'err',
    inArea?'อยู่ในพื้นที่ทำงาน · '+n.s.name:'อยู่นอกพื้นที่ทำงาน',
    'ห่างจาก'+n.s.name+' '+d+' ม. · '+acc);
  chk();
}
let watchId=null, gpsTimer=null, envNote='';

function gotFix(pos){
  clearTimeout(gpsTimer);
  const{latitude:lat,longitude:lng,accuracy}=pos.coords;
  gps={lat,lng,accuracy};
  $('gps-retry').hidden=true;
  updateArea();
}
function gpsFail(code){
  clearTimeout(gpsTimer);
  if(gps) return;                       // มีตำแหน่งเดิมอยู่แล้ว ไม่ต้องแจ้งซ้ำ
  const m={1:'ไม่ได้รับอนุญาตใช้ตำแหน่ง',2:'หาตำแหน่งไม่ได้',3:'หาตำแหน่งนานเกินไป'};
  const h={
    1:'เปิดการอนุญาตตำแหน่งให้เบราว์เซอร์ในการตั้งค่าของมือถือ แล้วกดลองใหม่',
    2:'เปิด GPS ของมือถือ และออกไปที่โล่ง แล้วกดลองใหม่',
    3:'ตรวจว่าเปิด GPS ของมือถือ ออกไปที่โล่ง แล้วกดลองใหม่'
  };
  setGPS('err',m[code]||'หาตำแหน่งไม่ได้',(h[code]||h[3])+(envNote?' · '+envNote:''));
  $('gps-retry').hidden=false; chk();
}
function retryGPS(){
  if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
  gps=null; inArea=null; chk(); initGPS();
}
function initGPS(){
  if(!window.isSecureContext){ setGPS('err','ต้องเปิดผ่าน https:// เท่านั้น','เปิดลิงก์ของเว็บที่ deploy แล้ว ไม่ใช่ไฟล์ในเครื่องหรือ http://'); return; }
  if(!navigator.geolocation){ setGPS('err','เบราว์เซอร์นี้ไม่รองรับ GPS','ลองเปิดด้วย Chrome หรือ Safari'); return; }
  envNote=/Line\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(navigator.userAgent||'')
    ? 'ตอนนี้เปิดอยู่ในแอปอื่น (เช่น LINE) ให้เปิดลิงก์นี้ด้วย Chrome หรือ Safari แทน' : '';
  $('gps-retry').hidden=true;
  setGPS('pulse','กำลังหาตำแหน่ง...','ถ้ามีหน้าต่างขออนุญาตตำแหน่ง ให้กด "อนุญาต"'+(envNote?' · '+envNote:''));

  // ตรวจสิทธิ์ล่วงหน้า: ถ้าถูกบล็อกไว้ จะแจ้งทันทีแทนที่จะรอเฉยๆ
  if(navigator.permissions&&navigator.permissions.query){
    navigator.permissions.query({name:'geolocation'}).then(p=>{
      if(p.state==='denied') gpsFail(1);
      p.onchange=()=>{ if(p.state==='granted'&&!gps) retryGPS(); };
    }).catch(()=>{});
  }
  // 1) ขอตำแหน่งแบบเร็วก่อน (ไม่บังคับความแม่นยำสูง) จะได้ไม่ค้างตอนอยู่ในอาคาร
  navigator.geolocation.getCurrentPosition(gotFix,()=>{},{enableHighAccuracy:false,timeout:8000,maximumAge:60000});
  // 2) แล้วติดตามต่อด้วยความแม่นยำสูง
  watchId=navigator.geolocation.watchPosition(gotFix,e=>gpsFail(e.code),{enableHighAccuracy:true,timeout:20000,maximumAge:5000});
  // 3) กันค้าง: ถ้า 20 วินาทียังไม่ได้ตำแหน่งเลย ให้บอกวิธีแก้
  clearTimeout(gpsTimer);
  gpsTimer=setTimeout(()=>{ if(!gps) gpsFail(3); },20000);
}

/* ---------- ขั้นตอนที่ 3: กล้อง ---------- */
async function initCam(){ await startCam('user'); }
async function startCam(f){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  const msg=$('cam-msg');
  msg.className='cam-msg'; msg.textContent='กำลังเปิดกล้อง...';
  $('shutter').disabled=true;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:f},width:{ideal:640},height:{ideal:480}},audio:false});
    const v=$('video'); v.srcObject=stream; await v.play();
    v.style.transform=f==='user'?'scaleX(-1)':'scaleX(1)';
    msg.classList.add('hidden');
    $('shutter').disabled=false;
  }catch(e){
    let t='เปิดกล้องไม่ได้';
    if(e.name==='NotAllowedError')  t='ไม่ได้รับอนุญาตใช้กล้อง เปิดการอนุญาตกล้องในการตั้งค่าเบราว์เซอร์ แล้วโหลดหน้าใหม่';
    if(e.name==='NotFoundError')    t='ไม่พบกล้องบนอุปกรณ์นี้';
    if(e.name==='NotReadableError') t='กล้องกำลังถูกใช้อยู่ ปิดแอปอื่นแล้วโหลดหน้าใหม่';
    msg.textContent=t;
  }
}
function flipCam(){ facing=facing==='user'?'environment':'user'; retake(); startCam(facing); }

function snap(){
  const v=$('video'),c=$('canvas');
  c.width=480; c.height=360;
  const ctx=c.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0);
  if(facing==='user'){ctx.translate(480,0);ctx.scale(-1,1);}
  ctx.drawImage(v,0,0,480,360);
  photo=c.toDataURL('image/jpeg',0.7).split(',')[1];
  const p=$('preview'); p.src='data:image/jpeg;base64,'+photo; p.style.display='block';
  v.style.display='none'; $('flip').style.display='none'; $('sh-row').style.display='none';
  $('cam-msg').classList.add('hidden');
  $('retake').classList.add('show');
  setStep(3,'done'); chk();
}
function retake(){
  photo=null;
  const p=$('preview'); p.style.display='none'; p.removeAttribute('src');
  $('video').style.display='block'; $('flip').style.display='grid'; $('sh-row').style.display='';
  $('retake').classList.remove('show');
  setStep(3,null); chk();
}

/* ---------- แถบปุ่ม / คำบอกสถานะ ---------- */
function setHint(kind,text){ const h=$('hint'); h.className=kind||''; h.textContent=text; }
function chk(){
  if(busy) return;
  const ok=!!emp&&!!gps&&!!photo;
  $('btn-in').disabled=!ok; $('btn-out').disabled=!ok;
  if(ok){
    if(inArea===false) setHint('error','คุณอยู่นอกพื้นที่ทำงาน ระบบอาจไม่บันทึกการลงเวลา');
    else setHint('ready','พร้อมลงเวลา');
  }else if(!emp) setHint('','กรอกรหัสพนักงานให้ถูกต้อง');
  else if(!gps)  setHint('','รอสัญญาณ GPS...');
  else if(!photo)setHint('','ถ่ายภาพยืนยันเพื่อลงเวลา');
}
function setBusy(b){ busy=b; $('btn-in').disabled=b; $('btn-out').disabled=b; if(!b) chk(); }

/* ---------- ลงเวลา ---------- */
function b64ToBlob(b64){
  const bin=atob(b64),arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:'image/jpeg'});
}
async function go(type){
  if(busy||!emp||!gps||!photo) return;
  setBusy(true);
  setHint('busy',type==='IN'?'กำลังบันทึกเข้างาน...':'กำลังบันทึกออกงาน...');
  try{
    const path=emp.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
    const up=await sb.storage.from(PHOTO_BUCKET).upload(path,b64ToBlob(photo),{contentType:'image/jpeg'});
    if(up.error) throw up.error;

    const{data,error}=await sb.rpc('attendance_clock',{
      p_code:emp.id,p_status:type,
      p_lat:gps.lat,p_lng:gps.lng,
      p_accuracy:Math.round(gps.accuracy),p_photo_path:path
    });
    if(error) throw error;

    if(data.result==='success'){ showDone(type); }
    else{ setBusy(false); setHint('error',data.message); }
  }catch(e){
    setBusy(false);
    setHint('error','ลงเวลาไม่สำเร็จ ตรวจสอบสัญญาณอินเทอร์เน็ตแล้วลองอีกครั้ง');
  }
}
function showDone(type){
  const d=$('done');
  d.className='done show'+(type==='OUT'?' out':'');
  $('done-title').textContent=type==='IN'?'เข้างานแล้ว':'ออกงานแล้ว';
  $('done-who').textContent=emp.name;
  $('done-when').textContent=new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',hour12:false})+' น.';
  if(navigator.vibrate) navigator.vibrate(120);
  setTimeout(()=>location.reload(),6000);
}

function dist(a,b,c,d){
  const R=6371e3,p1=a*Math.PI/180,p2=c*Math.PI/180;
  const x=Math.sin((c-a)*Math.PI/360)**2+Math.cos(p1)*Math.cos(p2)*Math.sin((d-b)*Math.PI/360)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10294a">
<meta name="robots" content="noindex">
<title>รายงานลงเวลา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --ink:#10294a;--ink-soft:#c9d6e8;
  --paper:#f4f6f9;--surface:#fff;--line:#d9e0ea;
  --text:#14202e;--muted:#5b6b7d;
  --in:#15803d;--out:#c2410c;--bad:#b42318;--link:#1d5fbf;
  --tab-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'IBM Plex Sans Thai','Noto Sans Thai','Sarabun',system-ui,sans-serif;
  background:var(--paper);color:var(--text);font-size:16px;line-height:1.5;min-height:100vh;
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));
}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #2f7de1;outline-offset:2px}

/* ── เข้าสู่ระบบ ── */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 22px;background:var(--ink);color:#fff;
  padding-top:calc(32px + env(safe-area-inset-top));padding-bottom:calc(32px + env(safe-area-inset-bottom))}
.login-in{width:100%;max-width:380px;margin:0 auto}
.login h1{font-size:30px;font-weight:700;line-height:1.2}
.login p.lead{color:var(--ink-soft);margin:6px 0 28px}
.login label{display:block;font-size:15px;font-weight:500;margin:14px 0 6px}
.login input{width:100%;height:54px;padding:0 14px;font-size:18px;border-radius:12px;border:2px solid transparent;background:#fff;color:var(--text);outline:none}
.login input:focus{border-color:#7ab4ff}
.login .go{width:100%;height:58px;margin-top:22px;border:0;border-radius:14px;background:#fff;color:var(--ink);font-size:19px;font-weight:700}
.login .go:disabled{opacity:.5}
.login .alt{display:block;width:100%;margin-top:14px;padding:12px;background:none;border:0;color:var(--ink-soft);font-size:16px;text-decoration:underline}
.login .lmsg{min-height:48px;margin-top:14px;font-size:15px;line-height:1.4;color:#ffd3cc}
.login .lmsg.ok{color:#b8f0cb}
.login .back{display:block;margin-top:10px;text-align:center;color:var(--ink-soft);font-size:15px}

/* ── หัวหน้า ── */
.top{background:var(--ink);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 20px 22px}
.top-in{max-width:960px;margin:0 auto}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top-name{font-size:16px;font-weight:500;color:var(--ink-soft)}
.top-act{display:flex;gap:8px}
.pill{color:#fff;text-decoration:none;font-size:15px;font-weight:500;padding:8px 14px;border:1.5px solid rgba(255,255,255,.35);border-radius:999px;background:none;line-height:1.3}
.pill:active{background:rgba(255,255,255,.12)}
.who{font-size:13px;color:var(--ink-soft);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-lbl{font-size:17px;margin-top:16px;color:var(--ink-soft)}
.hero-num{font-size:clamp(56px,19vw,88px);font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.hero-num small{font-size:.32em;font-weight:500;margin-left:8px;color:var(--ink-soft)}
.hero-sub{font-size:15px;color:var(--ink-soft);margin-top:2px;min-height:23px}

/* ── แท็บ ── */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:960px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{height:var(--tab-h);background:none;border:0;border-top:3px solid transparent;font-size:17px;font-weight:500;color:var(--muted)}
.tab.active{border-top-color:var(--ink);color:var(--ink);font-weight:700}

/* ── เนื้อหา ── */
main{max-width:960px;margin:0 auto;padding:18px 16px 12px}
.filters{margin-bottom:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:16px;font-weight:500}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.dates label{font-size:14px;color:var(--muted);display:block}
.dates input{display:block;width:100%;height:50px;margin-top:4px;padding:0 12px;font-size:17px;background:var(--surface);border:2px solid var(--line);border-radius:12px;outline:none}
.dates input:focus{border-color:var(--ink)}
.fbtns{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-top:12px}
.btn{height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:17px;font-weight:700}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn:disabled{opacity:.5}
.upd{font-size:13px;color:var(--muted);margin-top:8px}
.msg{margin-top:10px;padding:12px 14px;border-radius:10px;background:#fdecea;color:var(--bad);font-size:15px;font-weight:500}

h2.sec{font-size:18px;font-weight:700;margin:4px 0 10px}
.panel{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:22px}
.cell{padding:14px 10px;text-align:center}
.cell+.cell{border-left:1px solid var(--line)}
.cell b{display:block;font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.cell span{display:block;font-size:14px;color:var(--muted);margin-top:4px;line-height:1.3}

.tool{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.search{width:100%;height:50px;padding:0 14px;font-size:17px;background:var(--surface);border:2px solid var(--line);border-radius:12px;outline:none}
.search:focus{border-color:var(--ink)}
.count{font-size:14px;color:var(--muted);margin-bottom:8px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.sum{grid-template-columns:1fr auto}
.thumb{width:52px;height:52px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#e5ebf2;padding:0;display:grid;place-items:center;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.none{cursor:default}
.nm{font-size:17px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub a{color:var(--link);text-decoration:none;font-weight:500}
.rt{text-align:right}
.st{display:inline-block;padding:2px 10px;border-radius:999px;font-size:14px;font-weight:700}
.st.in{background:#dcfce7;color:var(--in)}
.st.out{background:#ffe6db;color:var(--out)}
.time{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:3px}
.date{font-size:13px;color:var(--muted)}
.big{font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.empty{padding:36px 12px;text-align:center;color:var(--muted)}
.more{width:100%;height:52px;margin-top:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:17px;font-weight:700}

/* รูปขยาย */
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,12,22,.88);display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{width:100%;max-width:440px;text-align:center}
.mbox img{width:100%;max-height:68vh;object-fit:contain;border-radius:12px;background:#000;display:block}
.minfo{color:#e6edf5;font-size:16px;margin:12px 0}
.mclose{height:52px;padding:0 40px;border-radius:12px;border:2px solid rgba(255,255,255,.6);background:none;color:#fff;font-size:18px;font-weight:700}

/* จอใหญ่: แท็บย้ายขึ้นบน */
@media(min-width:900px){
  body{padding-bottom:0}
  .tabs{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line)}
  .tabs-in{grid-template-columns:repeat(3,160px)}
  .tab{height:52px;border-top:0;border-bottom:3px solid transparent}
  .tab.active{border-bottom-color:var(--ink)}
  .tool{flex-direction:row;align-items:center}
  .search{max-width:360px}
}
@media(min-width:900px){.row{grid-template-columns:56px 1fr auto}}
</style>
</head>
<body>

<!-- ───── เข้าสู่ระบบ ───── -->
<section class="login" id="login" hidden>
  <div class="login-in">
    <h1>รายงานลงเวลา</h1>
    <p class="lead">สำหรับผู้ดูแลระบบเท่านั้น</p>
    <form onsubmit="login(event)">
      <label for="lg-email">อีเมล</label>
      <input id="lg-email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required>
      <label for="lg-pw">รหัสผ่าน</label>
      <input id="lg-pw" type="password" autocomplete="current-password">
      <button class="go" id="lg-go" type="submit">เข้าสู่ระบบ</button>
    </form>
    <button class="alt" type="button" onclick="magic()">ส่งลิงก์เข้าสู่ระบบทางอีเมลแทน</button>
    <div class="lmsg" id="lg-msg" role="alert"></div>
    <a class="back" href="index.html">กลับไปหน้าลงเวลา</a>
  </div>
</section>

<!-- ───── แอป ───── -->
<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <div class="top-row">
        <span class="top-name">รายงานลงเวลา</span>
        <div class="top-act">
          <a class="pill" href="index.html">หน้าลงเวลา</a>
          <button class="pill" onclick="logout()">ออกจากระบบ</button>
        </div>
      </div>
      <div class="who" id="who"></div>
      <div class="hero-lbl">เข้างานวันนี้</div>
      <div class="hero-num" id="h-in">–</div>
      <div class="hero-sub" id="h-sub"></div>
    </div>
  </header>

  <nav class="tabs" aria-label="เมนูรายงาน">
    <div class="tabs-in">
      <button class="tab active" data-tab="overview" onclick="showTab('overview')">ภาพรวม</button>
      <button class="tab" data-tab="log" onclick="showTab('log')">บันทึก</button>
      <button class="tab" data-tab="summary" onclick="showTab('summary')">รายคน</button>
    </div>
  </nav>

  <main>
    <section class="filters">
      <div class="chips" id="chips">
        <button class="chip" data-n="1"  onclick="preset(1)">วันนี้</button>
        <button class="chip" data-n="7"  onclick="preset(7)">7 วัน</button>
        <button class="chip" data-n="30" onclick="preset(30)">30 วัน</button>
      </div>
      <div class="dates">
        <label>ตั้งแต่<input type="date" id="d-from" onchange="clearChips()"></label>
        <label>ถึง<input type="date" id="d-to" onchange="clearChips()"></label>
      </div>
      <div class="fbtns">
        <button class="btn primary" id="load-btn" onclick="load()">โหลดข้อมูล</button>
        <button class="btn" onclick="exportCSV()">ส่งออก CSV</button>
      </div>
      <div class="upd" id="upd"></div>
      <div class="msg" id="msg" role="alert" hidden></div>
    </section>

    <section id="tab-overview">
      <div class="panel" id="panel"></div>
      <h2 class="sec">รายการล่าสุด</h2>
      <div id="recent"></div>
    </section>

    <section id="tab-log" hidden>
      <div class="tool">
        <input class="search" id="q" type="search" placeholder="ค้นหาชื่อหรือรหัสพนักงาน" oninput="logLimit=30;renderLog()">
        <div class="chips" id="st-chips">
          <button class="chip active" data-st="" onclick="setStatus('')">ทั้งหมด</button>
          <button class="chip" data-st="IN"  onclick="setStatus('IN')">เข้างาน</button>
          <button class="chip" data-st="OUT" onclick="setStatus('OUT')">ออกงาน</button>
        </div>
      </div>
      <div id="log"></div>
    </section>

    <section id="tab-summary" hidden>
      <div class="tool">
        <input class="search" id="q2" type="search" placeholder="ค้นหาชื่อหรือรหัสพนักงาน" oninput="renderSummary()">
      </div>
      <div id="sum"></div>
    </section>
  </main>
</div>

<div class="modal" id="modal" hidden onclick="closeModal()">
  <div class="mbox" onclick="event.stopPropagation()">
    <img id="m-img" alt="ภาพยืนยันการลงเวลา">
    <div class="minfo" id="m-info"></div>
    <button class="mclose" onclick="closeModal()">ปิด</button>
  </div>
</div>

<script>
// ===== ตั้งค่า: Supabase Dashboard → Project Settings → API =====
const SUPABASE_URL      = "https://ppzdyvomrfiitahxwrwz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwemR5dm9tcmZpaXRhaHh3cnd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMjQ0MjIsImV4cCI6MjEwNDYwMDQyMn0.iArUz6swMfwhFT_1qEvCwK1B3aiCxdWt46_FBjT6_Y0";   // ใช้ anon key เท่านั้น ห้ามใส่ service_role
const PHOTO_BUCKET      = "attendance-photos";
const ROW_CAP           = 20000;

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let rows=[], loaded=null, curTab='overview', logLimit=30, statusFilter='';
let sessUid=null, authBusy=false;
const signed=new Map();

/* ================= เข้าสู่ระบบ ================= */
function showLogin(msg){ $('app').hidden=true; $('login').hidden=false; if(msg!==undefined) loginMsg(msg); }
function showApp(email){ $('login').hidden=true; $('app').hidden=false; $('who').textContent=email||''; }
function loginMsg(t,ok){ const m=$('lg-msg'); m.textContent=t||''; m.className='lmsg'+(ok?' ok':''); }

async function handleSession(session){
  if(!session){ sessUid=null; showLogin(); return; }
  if(sessUid===session.user.id || authBusy) return;
  authBusy=true;
  try{
    const{data,error}=await sb.rpc('is_hr_admin');
    if(error||data!==true){
      const mail=session.user.email;
      await sb.auth.signOut();
      sessUid=null;
      showLogin('บัญชี '+mail+' ไม่มีสิทธิ์ดูรายงาน ติดต่อผู้ดูแลระบบ');
      return;
    }
    sessUid=session.user.id;
    showApp(session.user.email);
    preset(30);
  }finally{ authBusy=false; }
}

async function login(e){
  e.preventDefault();
  const email=$('lg-email').value.trim().toLowerCase(), password=$('lg-pw').value;
  if(!email||!password){ loginMsg('กรอกอีเมลและรหัสผ่าน'); return; }
  $('lg-go').disabled=true; loginMsg('กำลังตรวจสอบ...',true);
  const{error}=await sb.auth.signInWithPassword({email,password});
  $('lg-go').disabled=false;
  if(error) loginMsg('อีเมลหรือรหัสผ่านไม่ถูกต้อง'); else loginMsg('');
}
async function magic(){
  const email=$('lg-email').value.trim().toLowerCase();
  if(!email){ loginMsg('กรอกอีเมลก่อน แล้วกดส่งลิงก์'); return; }
  loginMsg('กำลังส่งลิงก์...',true);
  const{error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:location.origin+location.pathname}});
  if(error) loginMsg('ส่งลิงก์ไม่สำเร็จ ตรวจสอบอีเมลหรือรอสักครู่แล้วลองใหม่');
  else loginMsg('ส่งลิงก์ไปที่อีเมลแล้ว เปิดลิงก์นั้นบนเครื่องนี้',true);
}
async function logout(){ await sb.auth.signOut(); rows=[]; loaded=null; signed.clear(); }

(async()=>{
  const{data:{session}}=await sb.auth.getSession();
  await handleSession(session);
  sb.auth.onAuthStateChange((ev,s)=>{
    if(ev==='SIGNED_IN'||ev==='SIGNED_OUT') setTimeout(()=>handleSession(s),0);
  });
})();

/* ================= ตัวกรองวันที่ ================= */
function dateStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function preset(n){
  const to=new Date(), from=new Date(); from.setDate(from.getDate()-(n-1));
  $('d-from').value=dateStr(from); $('d-to').value=dateStr(to);
  document.querySelectorAll('#chips .chip').forEach(c=>c.classList.toggle('active',+c.dataset.n===n));
  load();
}
function clearChips(){ document.querySelectorAll('#chips .chip').forEach(c=>c.classList.remove('active')); }

/* ================= โหลดข้อมูล ================= */
function showMsg(t){ const m=$('msg'); m.hidden=!t; m.textContent=t||''; }

async function load(){
  const from=$('d-from').value, to=$('d-to').value;
  if(!from||!to||from>to){ showMsg('เลือกช่วงวันที่ให้ถูกต้อง'); return; }
  const btn=$('load-btn'); btn.disabled=true; btn.textContent='กำลังโหลด...'; showMsg('');
  try{
    const start=new Date(from+'T00:00:00').toISOString();
    const e=new Date(to+'T00:00:00'); e.setDate(e.getDate()+1);
    const end=e.toISOString();
    let all=[]; const STEP=1000;
    for(let off=0; off<ROW_CAP; off+=STEP){
      const{data,error}=await sb.from('attendance_logs')
        .select('id,employee_code,status,latitude,longitude,accuracy,distance_m,photo_path,created_at,employees(full_name,departments(name))')
        .gte('created_at',start).lt('created_at',end)
        .order('created_at',{ascending:false}).order('id')
        .range(off,off+STEP-1);
      if(error) throw error;
      all=all.concat(data);
      if(data.length<STEP) break;
    }
    rows=all; loaded={from,to}; signed.clear(); logLimit=30;
    $('upd').textContent='อัปเดตล่าสุด '+new Date().toLocaleTimeString('th-TH',{hour12:false})+' · '+rows.length.toLocaleString('th-TH')+' รายการ';
    if(rows.length>=ROW_CAP) showMsg('แสดงได้สูงสุด '+ROW_CAP.toLocaleString('th-TH')+' รายการ ลดช่วงวันที่เพื่อดูให้ครบ');
    renderAll();
  }catch(err){
    if(err&&(err.code==='PGRST301'||err.status===401||/JWT/i.test(err.message||''))){ await logout(); showLogin('หมดเวลาเข้าสู่ระบบ กรุณาเข้าสู่ระบบอีกครั้ง'); }
    else showMsg('โหลดข้อมูลไม่สำเร็จ ตรวจสอบสัญญาณอินเทอร์เน็ตแล้วกดโหลดใหม่');
  }
  btn.disabled=false; btn.textContent='โหลดข้อมูล';
}

/* ================= แสดงผล ================= */
function showTab(t){
  curTab=t;
  ['overview','log','summary'].forEach(x=>$('tab-'+x).hidden=x!==t);
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  renderAll(); window.scrollTo({top:0});
}
function renderAll(){
  renderHero();
  if(curTab==='overview') renderOverview();
  if(curTab==='log') renderLog();
  if(curTab==='summary') renderSummary();
}

function todayStats(){
  if(!loaded) return null;
  const today=dateStr(new Date());
  if(today<loaded.from||today>loaded.to) return null;
  const latest=new Map(), ins=new Set(), outs=new Set();
  for(const r of rows){            // rows เรียงใหม่→เก่า
    if(dateStr(new Date(r.created_at))!==today) continue;
    if(!latest.has(r.employee_code)) latest.set(r.employee_code,r.status);
    (r.status==='IN'?ins:outs).add(r.employee_code);
  }
  let still=0; latest.forEach(s=>{ if(s==='IN') still++; });
  return {ins:ins.size,outs:outs.size,still};
}
function renderHero(){
  const t=todayStats();
  $('h-in').innerHTML=t?esc(t.ins)+'<small>คน</small>':'–';
  $('h-sub').textContent=t?'':(loaded?'ช่วงวันที่ที่เลือกไม่รวมวันนี้':'');
}

function fmtTime(d){return d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',hour12:false});}
function fmtDate(d){return d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'});}

function logRow(r){
  const name=r.employees?.full_name||'ไม่พบข้อมูลพนักงาน';
  const dept=r.employees?.departments?.name||'';
  const d=new Date(r.created_at);
  const thumb=r.photo_path
    ? '<button class="thumb" data-open="'+esc(r.photo_path)+'" data-info="'+esc(name+' · '+fmtDate(d)+' '+fmtTime(d))+'" aria-label="ดูรูป"><img data-path="'+esc(r.photo_path)+'" alt=""></button>'
    : '<div class="thumb none">—</div>';
  const dist=r.distance_m!=null?'ห่าง '+Math.round(r.distance_m)+' ม.':'';
  const map=(r.latitude!=null&&r.longitude!=null)
    ? ' <a href="https://www.google.com/maps?q='+encodeURIComponent(r.latitude+','+r.longitude)+'" target="_blank" rel="noopener">แผนที่</a>':'';
  return '<div class="row">'+thumb+
    '<div style="min-width:0"><div class="nm">'+esc(name)+'</div>'+
    '<div class="sub">'+esc(r.employee_code)+(dept?' · '+esc(dept):'')+'</div>'+
    '<div class="sub">'+esc(dist)+map+'</div></div>'+
    '<div class="rt"><span class="st '+(r.status==='IN'?'in':'out')+'">'+(r.status==='IN'?'เข้างาน':'ออกงาน')+'</span>'+
    '<div class="time">'+fmtTime(d)+'</div><div class="date">'+fmtDate(d)+'</div></div></div>';
}
function emptyBox(t){ return '<div class="list"><div class="empty">'+esc(t)+'</div></div>'; }

function renderOverview(){
  const t=todayStats();
  $('panel').innerHTML=
    '<div class="cell"><b>'+(t?t.still:'–')+'</b><span>ยังไม่ออกงาน</span></div>'+
    '<div class="cell"><b>'+(t?t.outs:'–')+'</b><span>ออกงานวันนี้</span></div>'+
    '<div class="cell"><b>'+rows.length.toLocaleString('th-TH')+'</b><span>รายการในช่วงที่เลือก</span></div>';
  const r=rows.slice(0,20);
  $('recent').innerHTML=r.length?'<div class="list">'+r.map(logRow).join('')+'</div>':emptyBox('ไม่มีรายการในช่วงวันที่นี้ ลองขยายช่วงวันที่');
  hydrate($('recent'));
}

function setStatus(s){
  statusFilter=s; logLimit=30;
  document.querySelectorAll('#st-chips .chip').forEach(c=>c.classList.toggle('active',c.dataset.st===s));
  renderLog();
}
function matchQ(r,q){
  if(!q) return true;
  return (r.employees?.full_name||'').toLowerCase().includes(q)||String(r.employee_code).toLowerCase().includes(q);
}
function renderLog(){
  const q=$('q').value.trim().toLowerCase();
  const f=rows.filter(r=>(!statusFilter||r.status===statusFilter)&&matchQ(r,q));
  if(!f.length){ $('log').innerHTML=emptyBox(rows.length?'ไม่พบรายการที่ตรงกับคำค้นหา':'ไม่มีรายการในช่วงวันที่นี้ ลองขยายช่วงวันที่'); return; }
  const sl=f.slice(0,logLimit);
  $('log').innerHTML='<div class="count">แสดง '+sl.length.toLocaleString('th-TH')+' จาก '+f.length.toLocaleString('th-TH')+' รายการ</div>'+
    '<div class="list">'+sl.map(logRow).join('')+'</div>'+
    (f.length>logLimit?'<button class="more" onclick="logLimit+=30;renderLog()">แสดงเพิ่ม</button>':'');
  hydrate($('log'));
}

function renderSummary(){
  const q=$('q2').value.trim().toLowerCase();
  const m=new Map();
  for(const r of rows){
    let v=m.get(r.employee_code);
    if(!v){ v={code:r.employee_code,name:r.employees?.full_name||'ไม่พบข้อมูลพนักงาน',dept:r.employees?.departments?.name||'',days:new Set(),inn:0,out:0,last:r.created_at}; m.set(r.employee_code,v); }
    if(r.status==='IN'){ v.inn++; v.days.add(dateStr(new Date(r.created_at))); } else v.out++;
  }
  const list=[...m.values()].filter(v=>!q||v.name.toLowerCase().includes(q)||String(v.code).toLowerCase().includes(q))
    .sort((a,b)=>a.name.localeCompare(b.name,'th'));
  if(!list.length){ $('sum').innerHTML=emptyBox(rows.length?'ไม่พบพนักงานที่ตรงกับคำค้นหา':'ไม่มีรายการในช่วงวันที่นี้ ลองขยายช่วงวันที่'); return; }
  $('sum').innerHTML='<div class="count">'+list.length.toLocaleString('th-TH')+' คน</div><div class="list">'+list.map(v=>{
    const d=new Date(v.last);
    return '<div class="row sum"><div style="min-width:0"><div class="nm">'+esc(v.name)+'</div>'+
      '<div class="sub">'+esc(v.code)+(v.dept?' · '+esc(v.dept):'')+'</div>'+
      '<div class="sub">เข้า '+v.inn+' · ออก '+v.out+' · ล่าสุด '+esc(fmtDate(d)+' '+fmtTime(d))+'</div></div>'+
      '<div class="rt"><div class="big">'+v.days.size+'</div><div class="date">วันทำงาน</div></div></div>';
  }).join('')+'</div>';
}

/* ================= รูปภาพ (bucket เป็น private → signed URL) ================= */
async function signPaths(paths){
  const need=[...new Set(paths)].filter(p=>p&&!signed.has(p));
  for(let i=0;i<need.length;i+=50){
    const{data,error}=await sb.storage.from(PHOTO_BUCKET).createSignedUrls(need.slice(i,i+50),3600);
    if(error||!data) continue;
    data.forEach(x=>{ if(x.signedUrl) signed.set(x.path,x.signedUrl); });
  }
}
async function hydrate(root){
  const imgs=[...root.querySelectorAll('img[data-path]:not([src])')];
  if(!imgs.length) return;
  await signPaths(imgs.map(i=>i.dataset.path));
  imgs.forEach(i=>{
    const u=signed.get(i.dataset.path);
    if(u) i.src=u; else { i.remove(); }
  });
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-open]'); if(!b) return;
  const p=b.dataset.open;
  await signPaths([p]);
  const u=signed.get(p); if(!u){ showMsg('เปิดรูปไม่ได้'); return; }
  $('m-img').src=u; $('m-info').textContent=b.dataset.info||''; $('modal').hidden=false;
});
function closeModal(){ $('modal').hidden=true; $('m-img').removeAttribute('src'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

/* ================= ส่งออก CSV ================= */
function csvCell(v){
  let s=String(v??'');
  if(/^[=+\-@\t\r]/.test(s)) s="'"+s;          // กันสูตร Excel
  return '"'+s.replace(/"/g,'""')+'"';
}
function localTs(iso){
  const d=new Date(iso);
  return dateStr(d)+' '+d.toLocaleTimeString('en-GB',{hour12:false});
}
function exportCSV(){
  if(!rows.length){ showMsg('ยังไม่มีข้อมูลให้ส่งออก'); return; }
  const hdr=['รหัสพนักงาน','ชื่อ','แผนก','วันเวลา','สถานะ','Latitude','Longitude','ระยะจากจุดลงเวลา (ม.)','ไฟล์รูป'];
  const lines=rows.map(r=>[
    r.employee_code,r.employees?.full_name,r.employees?.departments?.name,localTs(r.created_at),
    r.status,r.latitude,r.longitude,r.distance_m!=null?Math.round(r.distance_m):'',r.photo_path
  ].map(csvCell).join(','));
  const blob=new Blob(['\uFEFF'+hdr.map(csvCell).join(',')+'\n'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:'attendance_'+loaded.from+'_'+loaded.to+'.csv'});
  document.body.appendChild(a); a.click(); a.remove();
}

<!doctype html>
<html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>เบิกของใช้ - แม่บ้าน</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body><main>
<section id="login" class="card">
  <h1>เบิกของใช้</h1><p class="muted">เข้าสู่ระบบด้วยรหัสพนักงาน</p>
  <label for="code">รหัสพนักงาน</label><input id="code" inputmode="numeric" autocomplete="username">
  <p><button id="loginBtn">เข้าสู่ระบบ</button></p>
</section>

<section id="app" class="hide">
  <div class="top"><div><h1>เบิกของใช้</h1><div class="muted" id="who"></div></div><button class="ghost" id="logout">ออกจากระบบ</button></div>
  <div class="card">
    <div class="row">
      <div><label for="item">รายการ</label><select id="item"></select></div>
      <div><label for="qty">จำนวน</label><input id="qty" type="number" min="1" value="1"></div>
      <button id="send">ส่งคำขอเบิก</button>
    </div>
  </div>
  <h2>คำขอของฉัน</h2>
  <div class="card scroll"><table><thead><tr><th>วันที่</th><th>รายการ</th><th>จำนวน</th><th>สถานะ</th></tr></thead><tbody id="mine"></tbody></table></div>
</section>
<p id="msg" role="status"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const label = {pending:"รออนุมัติ", approved:"อนุมัติแล้ว", rejected:"ไม่อนุมัติ"};
let items = [];
function say(t, bad){ $("msg").textContent = t; $("msg").className = bad ? "err" : ""; }

async function show(session){
  $("login").classList.toggle("hide", !!session);
  $("app").classList.toggle("hide", !session);
  if(!session) return;
  const email = session.user.email;
  if(email === "hr@local.com"){ location.href = "admin.html"; return; }
  $("who").textContent = "รหัสพนักงาน " + email.split("@")[0];
  sb.from("housekeepers").select("name").maybeSingle().then(({data}) => { if(data) $("who").textContent = data.name + " (รหัส " + email.split("@")[0] + ")"; });
  await load();
}
async function load(){
  const [i, r] = await Promise.all([
    sb.from("items").select("*").eq("active", true).order("name"),
    sb.from("requests").select("*, items(name,unit)").order("created_at", {ascending:false}).limit(50)
  ]);
  if(i.error || r.error){ say((i.error||r.error).message, true); return; }
  items = i.data;
  $("item").innerHTML = items.map(x => `<option value="${x.id}">${x.name} (เหลือ ${x.stock} ${x.unit})</option>`).join("");
  $("mine").innerHTML = r.data.length ? r.data.map(x => `<tr><td>${new Date(x.created_at).toLocaleDateString("th-TH")}</td><td>${x.items.name}</td><td>${x.qty} ${x.items.unit}</td><td><span class="tag ${x.status}">${label[x.status]}</span></td></tr>`).join("")
    : `<tr><td colspan="4" class="muted">ยังไม่มีคำขอ เลือกรายการด้านบนเพื่อเบิกของ</td></tr>`;
}
$("loginBtn").onclick = async () => {
  const code = $("code").value.trim();
  if(!code) return say("กรอกรหัสพนักงาน", true);
  const { error } = await sb.auth.signInWithPassword({ email: `${code}@${EMAIL_DOMAIN}`, password: code + CODE_SUFFIX });
  if(error) say("ไม่พบรหัสพนักงานนี้ หรือถูกปิดการใช้งาน", true); else say("");
};
$("code").addEventListener("keydown", e => { if(e.key === "Enter") $("loginBtn").click(); });
$("logout").onclick = () => sb.auth.signOut();
$("send").onclick = async () => {
  const qty = parseInt($("qty").value, 10);
  if(!(qty > 0)) return say("จำนวนต้องมากกว่า 0", true);
  $("send").disabled = true;
  const { error } = await sb.from("requests").insert({ item_id: +$("item").value, qty });
  $("send").disabled = false;
  if(error) return say(error.message, true);
  say("ส่งคำขอแล้ว รอผู้ดูแลอนุมัติ"); $("qty").value = 1; load();
};
sb.auth.onAuthStateChange((_e, s) => show(s));
sb.auth.getSession().then(({data}) => show(data.session));
</script></body></html>

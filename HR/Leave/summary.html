<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>สรุปการลาของพนักงาน</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ui.js"></script>
<style>
  :root{--bg:#eaf3fd;--card:#fff;--text:#1e3a5f;--muted:#5b7391;--line:#d6e4f5;--primary:#1d6fd8;--ok:#16a34a;--warn:#f59e0b;--bad:#dc2626}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--text)}
  header{background:linear-gradient(90deg,#1558b8,#2f8cf0);color:#fff;border-bottom:0;padding:14px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;flex:1}
  main{max-width:1200px;margin:0 auto;padding:16px}
  select,input,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
  button{background:var(--primary);color:#fff;border:0;cursor:pointer}
  button.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .lt h3{margin:0 0 2px;font-size:15px}
  .lt .sub{color:var(--muted);font-size:12px;min-height:16px}
  .lt .num{font-size:26px;font-weight:700;margin:8px 0 4px}
  .lt .num small{font-size:13px;font-weight:400;color:var(--muted)}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--ok)}
  .lt.na{opacity:.45}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
  th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#f0f5ff}
  .wrap{overflow-x:auto}
  .muted{color:var(--muted)}
  .low{color:var(--bad);font-weight:600}
  .tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:#dbeafe;color:#1e40af}
  #login{max-width:340px;margin:80px auto}
  #login input{width:100%;margin-bottom:10px}
  .err{color:var(--bad);font-size:13px;min-height:18px}
</style>
</head>
<body>

<!-- ===== ตั้งค่า: ใส่ค่าของโปรเจกต์ Supabase ===== -->
<script>
const SUPABASE_URL      = "https://ppzdyvomrfiitahxwrwz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwemR5dm9tcmZpaXRhaHh3cnd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMjQ0MjIsImV4cCI6MjEwNDYwMDQyMn0.iArUz6swMfwhFT_1qEvCwK1B3aiCxdWt46_FBjT6_Y0";

// ชื่อตาราง/คอลัมน์ ปรับให้ตรงกับฐานข้อมูลจริงได้ที่นี่
const T = {
  employees: "employees",
  leaves: "leave_requests",
  cols: { id:"employee_code", code:"employee_code", prefix:"prefix", first:"first_name", last:"last_name", hire:"hire_date" }
};

// ชั่วโมงทำงานต่อวัน (ใช้แปลงชั่วโมง <-> วัน)
const HOURS_PER_DAY = 8;
</script>

<div id="login" class="card" style="display:none">
  <h2 style="margin-top:0">เข้าสู่ระบบ HR</h2>
  <input id="email" type="email" placeholder="อีเมล">
  <input id="password" type="password" placeholder="รหัสผ่าน">
  <div class="err" id="loginErr"></div>
  <button id="loginBtn" style="width:100%">เข้าสู่ระบบ</button>
</div>

<div id="app" style="display:none">
  <header>
    <h1>สรุปการลาของพนักงาน</h1>
    <a href="leave-types.html" style="color:#fff;text-decoration:none;font-size:14px">ประเภทการลา</a>
    <a href="index.html" style="color:#fff;text-decoration:none;font-size:14px">หน้าหลัก</a>
    <a href="add-leave.html" style="color:#fff;text-decoration:none;font-size:14px">บันทึกการลา</a>
    <label>ปี <select id="year"></select></label>
    <input id="search" placeholder="ค้นหาชื่อ / รหัส" style="min-width:200px">
    <button class="ghost" id="logout">ออกจากระบบ</button>
  </header>
  <main>
    <div class="card" id="detail" style="display:none"></div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <b>ภาพรวมวันลาคงเหลือ (วัน)</b>
        <span class="muted" id="count"></span>
      </div>
      <div class="wrap"><table id="tbl"></table></div>
    </div>
  </main>
</div>

<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------- ประเภทการลา: โหลดจากตาราง leave_types (จัดการที่ leave-types.html) ---------- */
const DEFAULT_TYPES = [
  { code:"vacation", name:"ลาพักร้อน", quota_mode:"tenure", quota_days:0, tenure_tiers:[{min_months:0,days:0},{min_months:4,days:6},{min_months:24,days:7},{min_months:36,days:8}], hourly_allowed:false, gender:"all", active:true },
  { code:"personal_paid", name:"ลากิจ (รับค่าจ้าง)", quota_mode:"fixed", quota_days:6, hourly_allowed:true, gender:"all", active:true },
  { code:"personal_unpaid", name:"ลากิจ (ไม่รับค่าจ้าง)", quota_mode:"fixed", quota_days:6, hourly_allowed:true, gender:"all", active:true },
  { code:"sick", name:"ลาป่วย", quota_mode:"fixed", quota_days:30, hourly_allowed:false, gender:"all", active:true },
  { code:"maternity", name:"ลาคลอด", quota_mode:"fixed", quota_days:90, hourly_allowed:false, gender:"F", active:true },
  { code:"military", name:"ลาราชการทหาร", quota_mode:"fixed", quota_days:3, hourly_allowed:false, gender:"M", active:true },
];
let LEAVE_TYPES = [];
async function loadTypes(){
  const { data, error } = await sb.from("leave_types").select("*").order("sort_order").order("created_at");
  const rows = (!error && data && data.length) ? data : DEFAULT_TYPES;
  LEAVE_TYPES = rows.map(t => ({ ...t, key:t.code, hourly:t.hourly_allowed }));
}
// สิทธิ์ต่อปีของคนหนึ่งสำหรับประเภทหนึ่ง (null = ไม่มีสิทธิ์) — ต้องตรงกับ _leave_quota ใน leave_types.sql
function typeQuota(t, gender, months){
  if (!t) return null;
  if (t.gender !== "all" && t.gender !== gender) return null;
  if (t.quota_mode === "tenure"){
    let q = 0;
    for (const x of [...(t.tenure_tiers||[])].sort((a,b)=>a.min_months-b.min_months)) if (months >= x.min_months) q = Number(x.days);
    return q;
  }
  return Number(t.quota_days||0);
}

const isFemale = p => ["นางสาว","น.ส.","นส.","นาง"].includes((p||"").trim());
const isMale   = p => (p||"").trim() === "นาย";
const shown = () => LEAVE_TYPES.filter(t => t.active);   // คอลัมน์ในตาราง = เฉพาะประเภทที่เปิดใช้งาน

function monthsBetween(from, to){
  const a = new Date(from), b = new Date(to);
  let m = (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth());
  if (b.getDate() < a.getDate()) m--;
  return Math.max(m,0);
}
function tenureText(m){ const y=Math.floor(m/12), r=m%12; return (y?`${y} ปี `:"")+`${r} เดือน`; }
const fmt = n => Number.isInteger(n) ? n : n.toFixed(2).replace(/\.?0+$/,"");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function daysHours(d){ // 1.5 วัน -> "1 วัน 4 ชม."
  const whole = Math.floor(d+1e-9), h = Math.round((d-whole)*HOURS_PER_DAY);
  return h ? `${whole} วัน ${h} ชม.` : `${whole} วัน`;
}

/* ---------- ข้อมูล ---------- */
let EMPS = [], USED = {}, YEAR = new Date().getFullYear();

async function load(){
  await loadTypes();
  const { data: emps, error: e1 } = await sb.from(T.employees).select("*");
  if (e1) return uiAlert({ title:"โหลดพนักงานไม่สำเร็จ", message:e1.message, tone:"error" });
  if (!emps.length) return uiAlert({ title:"ไม่พบข้อมูลพนักงาน", message:"ไม่พบข้อมูลในตาราง "+T.employees+"\n(ตรวจ RLS policy ว่าอนุญาตให้อ่านได้)", tone:"warn" });
  console.log("คอลัมน์ของ employees:", Object.keys(emps[0]));

  const pick = (r, names) => { for (const n of names) if (r[n] != null && r[n] !== "") return r[n]; return null; };
  const has  = (r, names) => names.some(n => n in r);
  const PFX = /^(นางสาว|น\.ส\.|นส\.|นาย|นาง)\s*/;

  EMPS = emps.map(r => {
    const code  = pick(r, ["employee_code","emp_code","employee_id","emp_id","code","id"]);
    let prefix  = pick(r, ["prefix","title","name_prefix","prefix_th","title_th"]);
    let first   = pick(r, ["first_name","firstname","first_name_th","fname","name_th","name"]);
    let last    = pick(r, ["last_name","lastname","last_name_th","lname","surname"]);
    const full  = pick(r, ["full_name","fullname","name_th","name"]);
    let name    = (first || last) ? `${first||""} ${last||""}`.trim() : (full || "");
    // ถ้าไม่มีคอลัมน์คำนำหน้า ลองแยกจากต้นชื่อ
    if (!prefix) { const m = String(name).match(PFX); if (m) prefix = m[1]; }
    else if (!PFX.test(name)) name = prefix + name;
    // เพศ: คำนำหน้า > คอลัมน์ gender/sex
    let gender = null;
    if (prefix) gender = isMale(prefix) ? "M" : isFemale(prefix) ? "F" : null;
    if (!gender) {
      const g = String(pick(r, ["gender","sex"]) || "").trim().toLowerCase();
      if (["ชาย","male","m"].includes(g)) gender = "M";
      else if (["หญิง","female","f"].includes(g)) gender = "F";
    }
    return { id:String(code), code, prefix, gender, name,
             hire: pick(r, ["hire_date","start_date","join_date","date_hired"]) };
  }).sort((a,b)=>String(a.code).localeCompare(String(b.code)));

  const { data: ls, error: e2 } = await sb.from(T.leaves)
    .select("employee_id,leave_type,days,status")
    .gte("start_date", `${YEAR}-01-01`).lte("start_date", `${YEAR}-12-31`)
    .in("status", ["approved","pending","pending_manager","pending_hr"]);
  if (e2) return uiAlert({ title:"โหลดการลาไม่สำเร็จ", message:e2.message+"\n(ตรวจว่าสร้างตาราง leave_requests แล้ว)", tone:"error" });

  USED = {};
  for (const l of ls){
    const u = (USED[l.employee_id] ??= {});
    const k = l.leave_type;
    u[k] ??= { approved:0, pending:0 };
    u[k][l.status === "approved" ? "approved" : "pending"] += Number(l.days);
  }
  render();
}

function asOf(){ // นับอายุงาน ณ วันนี้ (ปีปัจจุบัน) หรือสิ้นปีของปีที่เลือก
  const now = new Date();
  return YEAR >= now.getFullYear() ? now : new Date(YEAR,11,31);
}

function calc(emp){
  const months = emp.hire ? monthsBetween(emp.hire, asOf()) : 0;
  const rows = shown().map(t=>{
    const quota = typeQuota(t, emp.gender, months);
    const u = USED[emp.id]?.[t.key] || {approved:0,pending:0};
    return { ...t, quota, used:u.approved, pending:u.pending,
             remain: quota==null ? null : quota - u.approved };
  });
  return { months, rows };
}

/* ---------- แสดงผล ---------- */
function render(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const list = EMPS.filter(e => !q || e.name.toLowerCase().includes(q) || String(e.code||"").toLowerCase().includes(q));
  document.getElementById("count").textContent = `${list.length} คน`;

  const head = `<thead><tr><th>รหัส</th><th>ชื่อ-สกุล</th><th>อายุงาน</th>${
    shown().map(t=>`<th>${t.name}</th>`).join("")}</tr></thead>`;
  const body = list.map(e=>{
    const { months, rows } = calc(e);
    return `<tr data-id="${esc(e.id)}"><td>${esc(e.code)}</td><td>${esc(e.name)}</td><td>${tenureText(months)}</td>${
      rows.map(r=> r.quota==null ? `<td class="muted">-</td>`
        : `<td class="${r.remain<=0?'low':''}">${fmt(r.remain)}<span class="muted">/${r.quota}</span></td>`).join("")}</tr>`;
  }).join("");
  document.getElementById("tbl").innerHTML = head + `<tbody>${body}</tbody>`;
  document.querySelectorAll("#tbl tbody tr").forEach(tr=>tr.onclick=()=>showDetail(tr.dataset.id));
}

function showDetail(id){
  const e = EMPS.find(x=>String(x.id)===String(id)); if(!e) return;
  const { months, rows } = calc(e);
  const el = document.getElementById("detail");
  el.style.display = "block";
  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <div><b style="font-size:17px">${esc(e.name)}</b> <span class="muted">(${esc(e.code)})</span><br>
        <span class="muted">เริ่มงาน ${esc(e.hire||"-")} · อายุงาน ${tenureText(months)} · ปี ${YEAR}</span></div>
      <button class="ghost" onclick="document.getElementById('detail').style.display='none'">ปิด</button>
    </div>
    <div class="grid">${rows.map(r=>{
      if (r.quota==null) return `<div class="card lt na" style="margin:0"><h3>${r.name}</h3><div class="sub">ไม่มีสิทธิ์</div></div>`;
      const pct = Math.min(100, r.quota? r.used/r.quota*100 : 0);
      const color = pct>=100?"var(--bad)":pct>=75?"var(--warn)":"var(--ok)";
      return `<div class="card lt" style="margin:0">
        <h3>${r.name}</h3>
        <div class="sub">${r.hourly?'<span class="tag">ลารายชั่วโมงได้</span>':''}</div>
        <div class="num">${fmt(r.remain)} <small>/ ${r.quota} วัน คงเหลือ</small></div>
        <div class="bar"><i style="width:${pct}%;background:${color}"></i></div>
        <div class="sub" style="margin-top:6px">ใช้แล้ว ${daysHours(r.used)}${r.pending?` · รออนุมัติ ${daysHours(r.pending)}`:""}</div>
      </div>`;}).join("")}</div>`;
  el.scrollIntoView({behavior:"smooth"});
}

/* ---------- Auth + เริ่มต้น ---------- */
async function start(){
  const { data:{ session } } = await sb.auth.getSession();
  document.getElementById("login").style.display = session ? "none":"block";
  document.getElementById("app").style.display   = session ? "block":"none";
  if (session) load();
}
document.getElementById("loginBtn").onclick = async ()=>{
  const { error } = await sb.auth.signInWithPassword({
    email: document.getElementById("email").value,
    password: document.getElementById("password").value });
  if (error) document.getElementById("loginErr").textContent = error.message; else start();
};
document.getElementById("logout").onclick = async ()=>{ await sb.auth.signOut(); start(); };
document.getElementById("search").oninput = render;

const ys = document.getElementById("year");
for (let y=YEAR; y>=YEAR-3; y--) ys.insertAdjacentHTML("beforeend",`<option>${y}</option>`);
ys.onchange = ()=>{ YEAR=Number(ys.value); load(); };

start();
</script>
<footer style="text-align:center;padding:16px;margin-top:24px;font-size:12px;color:#5b7391;border-top:1px solid #d6e4f5">ตรวจสอบวันลา | ใช้ภายในบริษัทเท่านั้น | พัฒนาโดย Sarawut.C</footer>
</body>
</html>

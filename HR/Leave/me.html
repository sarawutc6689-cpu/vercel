<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>การลาของฉัน</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ui.js"></script>
<style>
  :root{--bg:#eaf3fd;--card:#fff;--text:#1e3a5f;--muted:#5b7391;--line:#d6e4f5;--primary:#1d6fd8;--ok:#16a34a;--warn:#f59e0b;--bad:#dc2626}
  *{box-sizing:border-box}
  body::before{content:"";display:block;height:8px;background:linear-gradient(90deg,#1558b8,#2f8cf0)}
  body{margin:0;font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--text)}
  main{max-width:900px;margin:0 auto;padding:16px}
  select,input,textarea,button{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
  button{background:var(--primary);color:#fff;border:0;cursor:pointer}
  button.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}
  button.small{padding:4px 10px;font-size:13px}
  button:disabled{opacity:.6}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .lt{margin:0}
  .lt h3{margin:0 0 2px;font-size:15px}
  .lt .sub{color:var(--muted);font-size:12px;min-height:16px}
  .lt .num{font-size:26px;font-weight:700;margin:8px 0 4px}
  .lt .num small{font-size:13px;font-weight:400;color:var(--muted)}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%}
  .lt.na{opacity:.45}
  .muted{color:var(--muted)}
  .tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:#dbeafe;color:#1e40af}
  .st-approved{background:#dcfce7;color:#166534}
  .st-pending,.st-pending_manager,.st-pending_hr{background:#fef3c7;color:#92400e}
  .st-rejected,.st-cancelled{background:#fee2e2;color:#991b1b}
  #login{max-width:380px;margin:60px auto}
  #login input{width:100%;margin-bottom:10px}
  .err{color:var(--bad);font-size:13px;min-height:18px;margin-bottom:6px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  .wrap{overflow-x:auto}
  .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:flex-start;margin-bottom:12px}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .row input,.row select,.row textarea{width:100%}
  .info{background:#f0f5ff;border:1px solid #dbe6ff;border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:12px}
  .info.warn{background:#fffbeb;border-color:#fde68a}
  .info.bad{background:#fef2f2;border-color:#fecaca;color:#991b1b}
  .msg{font-size:14px;min-height:20px;margin:8px 0}
  .msg.ok{color:var(--ok)} .msg.er{color:var(--bad)}
  .hide{display:none}
  .note{font-size:12px;color:#991b1b;margin-top:4px}
</style>
</head>
<body>

<script>
const SUPABASE_URL      = "https://YOUR-PROJECT.supabase.co";
const SUPABASE_ANON_KEY = "YOUR-ANON-KEY";
const COUNT_SAT = false;   // true = นับวันเสาร์เป็นวันทำงานตอนคำนวณจำนวนวันลา (ถ้าบริษัททำงานวันเสาร์)
</script>

<main>
  <div id="login" class="card">
    <h2 style="margin-top:0">การลาของฉัน</h2>
    <input id="code" placeholder="รหัสพนักงาน" autocomplete="username" inputmode="text">
    <input id="pass" type="password" placeholder="รหัสผ่าน (วันเริ่มงาน เช่น 01112569)" autocomplete="current-password" inputmode="numeric">
    <div class="err" id="err"></div>
    <button id="loginBtn" style="width:100%">เข้าสู่ระบบ</button>
    <p class="muted" style="font-size:12px;margin-bottom:0">รหัสผ่าน = วัน/เดือน/ปี พ.ศ. ที่เริ่มงาน ต่อกันไม่มีเครื่องหมาย</p>
    <p style="font-size:13px;text-align:center;margin:12px 0 0"><a href="index.html" style="color:var(--primary);text-decoration:none">← กลับหน้าหลัก</a></p>
  </div>

  <div id="app" style="display:none">
    <div class="card">
      <div class="top">
        <div><b style="font-size:18px" id="name"></b><br><span class="muted" id="info"></span></div>
        <div style="display:flex;gap:8px">
          <select id="year"></select>
          <button class="ghost" id="logout">ออกจากระบบ</button>
        </div>
      </div>
      <div class="grid" id="cards"></div>
    </div>

    <div class="card">
      <b>ยื่นใบลา</b>
      <p class="muted" style="font-size:13px;margin:4px 0 12px">ใบลาจะส่งให้ผู้จัดการฝ่ายอนุมัติก่อน แล้วส่งต่อฝ่ายบุคคล เมื่อฝ่ายบุคคลอนุมัติจึงนับเป็นวันลาที่ใช้แล้ว</p>
      <div class="row">
        <div><label>ประเภทการลา</label><select id="ftype"></select></div>
        <div id="fmodeBox" class="hide">
          <label>รูปแบบการลา</label>
          <select id="fmode"><option value="day">เต็มวัน / หลายวัน</option><option value="hour">รายชั่วโมง</option></select>
        </div>
      </div>
      <div class="row">
        <div><label>วันที่เริ่มลา</label><input type="date" id="fstart"></div>
        <div id="fendBox"><label>ถึงวันที่</label><input type="date" id="fend"></div>
        <div id="fhoursBox" class="hide"><label>จำนวนชั่วโมง (ไม่เกิน 8)</label><input type="number" id="fhours" min="0.5" max="8" step="0.5" placeholder="เช่น 2"></div>
      </div>
      <div class="row"><div style="grid-column:1/-1"><label>เหตุผล</label><textarea id="freason" rows="2" placeholder="ระบุเหตุผลการลา"></textarea></div></div>
      <div id="fcalc" class="info hide"></div>
      <div class="msg" id="fmsg"></div>
      <button id="fsubmit">ส่งใบลา</button>
    </div>

    <div class="card">
      <b>ประวัติการลา</b>
      <div class="wrap"><table id="hist" style="margin-top:8px"></table></div>
    </div>
  </div>
</main>

<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const HOURS_PER_DAY = 8;
const $ = id => document.getElementById(id);

/* ---------- ประเภทการลาและสิทธิ์ของแต่ละคน มาจากฐานข้อมูล (จัดการที่ leave-types.html) ผ่านฟังก์ชัน employee_leave_summary ---------- */
const STATUS_TH = {
  pending_manager:"รอผู้จัดการฝ่ายอนุมัติ", pending_hr:"รอฝ่ายบุคคลอนุมัติ", pending:"รออนุมัติ",
  approved:"อนุมัติแล้ว", rejected:"ไม่อนุมัติ", cancelled:"ยกเลิก"
};
const PENDING = ["pending","pending_manager","pending_hr"];

function monthsBetween(from,to){
  const a=new Date(from), b=new Date(to);
  let m=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
  if(b.getDate()<a.getDate()) m--;
  return Math.max(m,0);
}
const tenureText = m => (m>=12?`${Math.floor(m/12)} ปี `:"")+`${m%12} เดือน`;
const fmt = n => Number.isInteger(n) ? n : Number(n.toFixed(3)).toString();
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function daysHours(d){ const w=Math.floor(d+1e-9), h=Math.round((d-w)*HOURS_PER_DAY); return h?`${w} วัน ${h} ชม.`:`${w} วัน`; }
function thaiDate(iso){ if(!iso) return "-"; const [y,m,d]=iso.slice(0,10).split("-"); return `${d}/${m}/${Number(y)+543}`; }
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

/* ---------- เรียกข้อมูล ---------- */
let CRED = null;   // เก็บในหน่วยความจำเท่านั้น (ไม่เขียนลง storage)
let CTX  = null;   // ข้อมูลของปีที่กำลังดู: { year, gender, months, used, holidays }
const ERR = {
  invalid_credentials: "รหัสพนักงานหรือรหัสผ่านไม่ถูกต้อง",
  too_many_attempts:   "ใส่ผิดหลายครั้ง กรุณารอ 15 นาทีแล้วลองใหม่ หรือติดต่อ HR",
  invalid_type:  "ประเภทการลาไม่ถูกต้อง",
  invalid_dates: "ช่วงวันที่ไม่ถูกต้อง",
  invalid_hours: "ลารายชั่วโมงทำได้เฉพาะลากิจ วันเดียว และไม่เกิน 8 ชั่วโมง",
  invalid_days:  "จำนวนวันลาไม่ถูกต้อง",
  cross_year:    "ลาข้ามปีไม่ได้ กรุณาแยกเป็นสองใบ",
  overlap:       "ช่วงวันที่ซ้ำกับใบลาที่มีอยู่แล้ว (รออนุมัติหรืออนุมัติแล้ว)",
  not_entitled:  "ไม่มีสิทธิ์ลาประเภทนี้",
  cannot_cancel: "ยกเลิกรายการนี้ไม่ได้ (อาจอนุมัติหรือยกเลิกไปแล้ว)",
};
function errText(d){
  if (d.error==="over_quota") return `เกินสิทธิ์ที่เหลือ (สิทธิ์ ${fmt(Number(d.quota))} วัน · ใช้และรออนุมัติแล้ว ${fmt(Number(d.used))} วัน)`;
  return ERR[d.error] || ("เกิดข้อผิดพลาด: "+d.error);
}

async function rpc(fn, args){
  const { data, error } = await sb.rpc(fn, { p_code: CRED.code, p_pass: CRED.pass, ...args });
  if (error) return { error: error.message };
  return data;
}
const fetchSummary = year => rpc("employee_leave_summary", { p_year: year });

async function doLogin(){
  const code = $("code").value.trim(), pass = $("pass").value.trim();
  const err = $("err"), btn = $("loginBtn");
  err.textContent = "";
  if (!code || !pass){ err.textContent = "กรอกรหัสพนักงานและรหัสผ่าน"; return; }
  btn.disabled = true;
  CRED = { code, pass };
  const d = await fetchSummary(Number($("year").value) || null);
  btn.disabled = false;
  if (d.error){ CRED = null; err.textContent = errText(d); return; }
  $("pass").value = "";
  $("login").style.display = "none";
  $("app").style.display = "block";
  if (!$("fstart").value) $("fstart").value = ymd(new Date());
  render(d);
}

/* ---------- แสดงผล ---------- */
function render(d){
  const name = d.full || "";
  const now = new Date();
  const asOf = d.year >= now.getFullYear() ? now : new Date(d.year,11,31);
  const months = monthsBetween(d.hire, asOf);

  $("name").textContent = name || d.code;
  $("info").textContent =
    `รหัส ${d.code}${d.department?` · ${d.department}`:""} · เริ่มงาน ${thaiDate(d.hire)} · อายุงาน ${tenureText(months)} · ปี ${d.year+543}`;

  const ys = $("year");
  if (!ys.options.length){
    for (let y=now.getFullYear(); y>=now.getFullYear()-3; y--)
      ys.insertAdjacentHTML("beforeend", `<option value="${y}">${y+543}</option>`);
  }
  ys.value = d.year;

  const types = d.types || [];
  const used = {};
  for (const l of d.leaves){
    if (l.status!=="approved" && !PENDING.includes(l.status)) continue;
    const u = (used[l.leave_type] ??= {approved:0,pending:0});
    u[l.status==="approved"?"approved":"pending"] += Number(l.days);
  }
  CTX = { year:d.year, months, types, used, holidays:new Set((d.holidays||[]).map(x=>String(x).slice(0,10))) };

  $("cards").innerHTML = types.map(t=>{
    if (t.quota==null) return `<div class="card lt na"><h3>${esc(t.name)}</h3><div class="sub">ไม่มีสิทธิ์</div></div>`;
    const quota = Number(t.quota);
    const u = used[t.code] || {approved:0,pending:0};
    const remain = quota - u.approved;
    const pct = quota ? Math.min(100,u.approved/quota*100) : 0;
    const color = pct>=100?"var(--bad)":pct>=75?"var(--warn)":"var(--ok)";
    return `<div class="card lt">
      <h3>${esc(t.name)}${t.active?"":' <span class="muted" style="font-weight:400;font-size:12px">(ปิดใช้งานแล้ว)</span>'}</h3>
      <div class="sub">${t.hourly?'<span class="tag">ลารายชั่วโมงได้</span>':''}</div>
      <div class="num">${fmt(remain)} <small>/ ${fmt(quota)} วัน คงเหลือ</small></div>
      <div class="bar"><i style="width:${pct}%;background:${color}"></i></div>
      <div class="sub" style="margin-top:6px">ใช้แล้ว ${daysHours(u.approved)}${u.pending?` · รออนุมัติ ${daysHours(u.pending)}`:""}</div>
    </div>`;
  }).join("");

  renderForm();
  renderHist(d.leaves);
}

function statusCell(l){
  let label = STATUS_TH[l.status] || l.status;
  let extra = "";
  if (l.status==="rejected"){
    label += ` (${l.stage==="hr"?"ฝ่ายบุคคล":"ผู้จัดการฝ่าย"})`;
    const n = l.stage==="hr" ? l.hr_note : l.manager_note;
    if (n) extra = `<div class="note">เหตุผล: ${esc(n)}</div>`;
  } else if (l.status==="pending_hr"){
    extra = `<div class="muted" style="font-size:12px;margin-top:4px">ผู้จัดการฝ่ายผ่านแล้ว / ข้ามขั้นตอน</div>`;
  }
  return `<span class="tag st-${esc(l.status)}">${esc(label)}</span>${extra}`;
}

function renderHist(rows){
  $("hist").innerHTML = rows.length
    ? `<thead><tr><th>วันที่ลา</th><th>ประเภท</th><th>จำนวน</th><th>สถานะ</th><th>เหตุผล</th><th></th></tr></thead><tbody>${
        rows.map(l=>{
          const canCancel = l.requested_by==="employee" && (l.status==="pending_manager"||l.status==="pending_hr");
          return `<tr>
          <td>${thaiDate(l.start_date)}${l.end_date!==l.start_date?` – ${thaiDate(l.end_date)}`:""}</td>
          <td>${esc(l.type_name||l.leave_type)}</td>
          <td>${l.hours?`${fmt(Number(l.hours))} ชม.`:daysHours(Number(l.days))}</td>
          <td>${statusCell(l)}</td>
          <td class="muted">${esc(l.reason||"")}</td>
          <td>${canCancel?`<button class="ghost small" data-cancel="${esc(l.id)}">ยกเลิก</button>`:""}</td></tr>`; }).join("")}</tbody>`
    : `<tbody><tr><td class="muted">ยังไม่มีรายการลาในปีนี้</td></tr></tbody>`;
  document.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=async()=>{
    if (!await uiConfirm({ title:"ยกเลิกใบลา", message:"ยืนยันยกเลิกใบลานี้ใช่หรือไม่?", okText:"ยกเลิกใบลา", cancelText:"ไม่ยกเลิก", tone:"danger" })) return;
    const r = await rpc("employee_cancel_leave", { p_id: b.dataset.cancel });
    if (r.error){ await uiAlert({ title:"ยกเลิกไม่สำเร็จ", message:errText(r), tone:"error" }); return; }
    reload();
  });
}

async function reload(){
  const d = await fetchSummary(CTX ? CTX.year : null);
  if (d.error){ await uiAlert({ title:"โหลดข้อมูลไม่สำเร็จ", message:errText(d), tone:"error" }); return; }
  render(d);
}

/* ---------- ฟอร์มยื่นใบลา ---------- */
function remainOf(key){
  const t = CTX.types.find(x=>x.code===key);
  if (!t || t.quota==null) return null;
  const q = Number(t.quota);
  const u = CTX.used[key]||{approved:0,pending:0};
  return { quota:q, remain:q-u.approved-u.pending };
}

function renderForm(){
  const keep = $("ftype").value;
  $("ftype").innerHTML = CTX.types.filter(t=>t.active).map(t=>{
    const r = remainOf(t.code);
    return r ? `<option value="${esc(t.code)}">${esc(t.name)} (เหลือ ${fmt(r.remain)} วัน)</option>` : "";
  }).join("");
  if (keep && [...$("ftype").options].some(o=>o.value===keep)) $("ftype").value = keep;
  onFormChange();
}

function countDays(s,e){
  let n=0, d=new Date(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10));
  const end=new Date(+e.slice(0,4), +e.slice(5,7)-1, +e.slice(8,10));
  for (; d<=end; d.setDate(d.getDate()+1)){
    const w=d.getDay();
    if (w===0) continue;
    if (w===6 && !COUNT_SAT) continue;
    if (CTX.holidays.has(ymd(d))) continue;
    n++;
  }
  return n;
}

let FCALC = null;
function onFormChange(){
  FCALC = null;
  if (!CTX) return;
  const key = $("ftype").value, t = CTX.types.find(x=>x.code===key);
  $("fmodeBox").classList.toggle("hide", !t?.hourly);
  if (!t?.hourly) $("fmode").value = "day";
  const hourly = $("fmode").value==="hour";
  $("fhoursBox").classList.toggle("hide", !hourly);
  $("fendBox").classList.toggle("hide", hourly);

  const box = $("fcalc"), s = $("fstart").value;
  if (!key || !s){ box.className="info hide"; return; }
  const e = hourly ? s : ($("fend").value || s);
  if (e < s){ box.className="info bad"; box.textContent="วันที่สิ้นสุดต้องไม่ก่อนวันที่เริ่ม"; return; }
  if (s.slice(0,4)!==e.slice(0,4)){ box.className="info bad"; box.textContent="ลาข้ามปีไม่ได้ กรุณาแยกเป็นสองใบ"; return; }

  let days, hours = null;
  if (hourly){
    hours = Number($("fhours").value);
    if (!hours || hours<=0 || hours>8){ box.className="info hide"; return; }
    days = hours/HOURS_PER_DAY;
  } else {
    days = countDays(s,e);
    if (days===0){ box.className="info warn"; box.textContent="ช่วงวันที่เลือกไม่มีวันทำงาน (เสาร์-อาทิตย์/วันหยุด)"; return; }
  }

  let after = null, txt = `จำนวนที่ลา: <b>${hourly?`${fmt(hours)} ชม. (${fmt(days)} วัน)`:daysHours(days)}</b>`;
  if (Number(s.slice(0,4)) === CTX.year){
    const r = remainOf(key);
    after = r.remain - days;
    txt += `<br>เหลือก่อนลา ${fmt(r.remain)} วัน → หลังลา <b>${fmt(after)}</b> วัน${after<0?" ⚠ เกินสิทธิ์ ส่งไม่ได้":""}`;
  } else {
    txt += `<br><span class="muted">ระบบจะตรวจสิทธิ์ของปี ${Number(s.slice(0,4))+543} ตอนส่งใบลา</span>`;
  }
  box.className = "info" + (after!=null && after<0 ? " warn" : "");
  box.innerHTML = txt;
  FCALC = { days, hours, start:s, end:e, over: after!=null && after<0 };
}

function fmsg(t,k){ const m=$("fmsg"); m.textContent=t||""; m.className="msg "+(k||""); }

async function submitLeave(){
  fmsg("");
  onFormChange();
  if (!FCALC) return fmsg("ตรวจสอบประเภท วันที่ และจำนวนชั่วโมงอีกครั้ง","er");
  if (FCALC.over) return fmsg("จำนวนวันลาเกินสิทธิ์ที่เหลือ","er");
  const reason = $("freason").value.trim();
  if (!reason) return fmsg("กรุณาระบุเหตุผลการลา","er");
  const ok = await uiConfirm({
    title:"ยืนยันส่งใบลา", message:"ตรวจสอบรายละเอียดก่อนส่ง ใบลาจะเข้าสู่ขั้นตอนอนุมัติทันที",
    rows:[
      ["ประเภท", CTX.types.find(x=>x.code===$("ftype").value).name],
      ["วันที่ลา", thaiDate(FCALC.start) + (FCALC.end!==FCALC.start ? " – "+thaiDate(FCALC.end) : "")],
      ["จำนวน", FCALC.hours!=null ? `${fmt(FCALC.hours)} ชม.` : daysHours(FCALC.days)],
      ["เหตุผล", reason]
    ],
    okText:"ส่งใบลา", cancelText:"กลับไปแก้ไข", tone:"primary" });
  if (!ok) return;

  $("fsubmit").disabled = true;
  const hourly = FCALC.hours!=null;
  const r = await rpc("employee_submit_leave", {
    p_type: $("ftype").value, p_start: FCALC.start, p_end: FCALC.end,
    p_hours: hourly ? FCALC.hours : null, p_days: hourly ? null : FCALC.days, p_reason: reason });
  $("fsubmit").disabled = false;
  if (r.error) return fmsg(errText(r),"er");

  fmsg(r.status==="pending_hr" ? "ส่งใบลาแล้ว — ส่งให้ฝ่ายบุคคลอนุมัติโดยตรง" : "ส่งใบลาแล้ว — รอผู้จัดการฝ่ายอนุมัติ","ok");
  $("freason").value=""; $("fhours").value="";
  const yr = Number(FCALC.start.slice(0,4));
  const d = await fetchSummary(yr);
  if (!d.error) render(d);
}

/* ---------- events ---------- */
$("loginBtn").onclick = doLogin;
$("pass").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
$("code").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
$("year").onchange = async e=>{
  const d = await fetchSummary(Number(e.target.value));
  if (d.error){ await uiAlert({ title:"โหลดข้อมูลไม่สำเร็จ", message:errText(d), tone:"error" }); return; }
  render(d);
};
$("logout").onclick = ()=>{
  CRED = null; CTX = null;
  $("app").style.display = "none";
  $("login").style.display = "block";
  $("code").value = "";
  $("year").innerHTML = "";
};
$("ftype").onchange = onFormChange;
$("fmode").onchange = onFormChange;
$("fstart").onchange = ()=>{ if(!$("fend").value || $("fend").value<$("fstart").value) $("fend").value=$("fstart").value; onFormChange(); };
["fend","fhours"].forEach(id=>$(id).addEventListener("input", onFormChange));
$("fsubmit").onclick = submitLeave;
</script>

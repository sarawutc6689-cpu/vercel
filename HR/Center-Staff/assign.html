<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เลือกพนักงานจากส่วนกลาง — HR Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2B3E; --ink-soft:#6E85A0;
    --bg-a:#EAF3FB; --bg-b:#F7FBFE; --panel:#FFFFFF; --line:#DCE9F5;
    --accent:#2F7FB8; --accent-dark:#24628F; --accent-ink:#FFFFFF;
    --accent-soft:#E7F2FB; --accent-soft-2:#F1F8FD;
    --danger:#C1596A; --danger-soft:#FBEBEE;
    --ok:#1F8A4C; --ok-soft:#E5F5EC;
    --warn:#B4791F; --warn-soft:#FDF3E0;
    --sun-bg:#FBEBEE;   --sun-fg:#C1596A;
    --com-bg:#FDF3E0;   --com-fg:#B4791F;
    --spe-bg:#E5F5EC;   --spe-fg:#1F8A4C;
    --radius:16px;
    --shadow:0 1px 2px rgba(27,60,90,.04), 0 10px 30px rgba(27,60,90,.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:linear-gradient(180deg, var(--bg-a) 0%, var(--bg-b) 320px, var(--bg-b) 100%);
    color:var(--ink); font-family:'Inter',system-ui,sans-serif; font-size:15px; line-height:1.5;
  }
  h1,h2,h3{font-family:'Space Grotesk',system-ui,sans-serif; margin:0; font-weight:600; letter-spacing:-0.01em;}

  /* login */
  #login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .login-card{
    width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line);
    border-radius:20px; padding:38px 34px; box-shadow:var(--shadow); text-align:center;
  }
  .login-mark{
    width:52px; height:52px; margin:0 auto 18px; border-radius:14px;
    background:linear-gradient(135deg, var(--accent), #6FB4E0);
    display:flex; align-items:center; justify-content:center;
  }
  .login-mark svg{width:26px; height:26px;}
  .login-card h1{font-size:20px; margin-bottom:6px;}
  .login-card p.sub{color:var(--ink-soft); font-size:13.5px; margin:0 0 24px;}
  .login-card .field{text-align:left; margin-top:16px;}

  /* header */
  #app{display:none;}
  header{
    background:rgba(255,255,255,.85); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line); padding:14px 32px;
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:20;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:34px; height:34px; border-radius:10px;
    background:linear-gradient(135deg, var(--accent), #6FB4E0);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand-mark svg{width:18px; height:18px;}
  header h1{font-size:17px;}
  header .who{font-size:13px; color:var(--ink-soft);}
  .btn-ghost{
    background:#fff; border:1px solid var(--line); color:var(--ink-soft);
    padding:8px 16px; border-radius:10px; font-size:13.5px; font-family:inherit; cursor:pointer; transition:.15s;
  }
  .btn-ghost:hover{border-color:var(--accent); color:var(--accent-dark);}
  main{max-width:1480px; margin:0 auto; padding:32px; display:grid; gap:24px;}
  main > *{min-width:0;}
  @media (max-width:860px){ main{padding:20px;} header{padding:12px 20px;} }
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:26px; box-shadow:var(--shadow);}
  .panel-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px;}
  .panel-head h2{font-size:16px;}
  .sub-note{font-size:12.5px; color:var(--ink-soft);}

  /* form controls */
  .field{margin-top:0;}
  .field label{display:block; font-size:13px; color:var(--ink-soft); margin-bottom:6px; font-weight:500;}
  input[type=text], input[type=email], input[type=password], input[type=date], input[type=month], input[type=search], select{
    width:100%; padding:10px 13px; border:1.5px solid var(--line); border-radius:10px;
    font-size:14px; font-family:inherit; color:var(--ink); background:#fff; transition:.15s;
  }
  input:focus, select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft);}
  .login-card .field{margin-top:16px;}
  .controls{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px; align-items:end;}
  .btn{padding:11px 20px; border-radius:10px; border:none; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer; transition:.15s;}
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn:disabled{opacity:.6; cursor:default;}
  #login-btn{width:100%; margin-top:22px;}
  .seg{display:flex; background:var(--accent-soft-2); border:1.5px solid var(--line); border-radius:10px; padding:3px; gap:3px;}
  .seg button{
    flex:1; border:none; background:none; padding:8px 12px; border-radius:7px; font:inherit;
    font-size:13.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; transition:.15s; white-space:nowrap;
  }
  .seg button:hover{color:var(--ink);}
  .seg button.active{background:var(--accent); color:#fff;}
  .count-tag{
    font-size:12.5px; color:var(--accent-dark); background:var(--accent-soft);
    padding:5px 12px; border-radius:100px; white-space:nowrap; font-weight:600;
  }
  .count-tag.warn{color:var(--warn); background:var(--warn-soft);}
  .count-tag.bad{color:var(--danger); background:var(--danger-soft);}
  .count-tag.good{color:var(--ok); background:var(--ok-soft);}
  .badge{display:inline-block; padding:3px 10px; border-radius:100px; font-size:12px; font-weight:600; white-space:nowrap;}
  .badge.none{background:var(--danger-soft); color:var(--danger);}
  .badge.partial{background:var(--warn-soft); color:var(--warn);}
  .badge.done{background:var(--ok-soft); color:var(--ok);}
  .code-cell{color:var(--accent-dark); font-weight:600; background:var(--accent-soft); padding:3px 9px; border-radius:7px; display:inline-block;}
  .empty-state{text-align:center; color:var(--ink-soft); padding:40px 12px; font-size:14px;}

  /* list table */
  table.list{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.list th{
    text-align:left; font-weight:600; color:var(--ink-soft); font-size:12px;
    padding:10px 12px; border-bottom:1.5px solid var(--line); white-space:nowrap; background:#fff;
  }
  table.list td{padding:10px 12px; border-bottom:1px solid var(--bg-a); vertical-align:top;}
  table.list tbody tr:hover td{background:var(--accent-soft-2);}
  .nowrap{white-space:nowrap;}

  /* banner */
  #status-banner{display:none; max-width:1480px; margin:0 auto; padding:16px 32px 0;}
  .banner{padding:12px 18px; border-radius:12px; font-size:13.5px; box-shadow:var(--shadow); font-weight:500; background:#fff;}
  .banner.ok{color:var(--accent-dark); border:1px solid var(--accent-soft);}
  .banner.err{color:var(--danger); border:1px solid var(--danger-soft);}
  .app-footer{text-align:center; color:var(--ink-soft); font-size:12.5px; padding:8px 20px 32px;}

  /* ---------- top navigation ---------- */
  header{flex-wrap:wrap; gap:10px 24px;}
  .topnav{display:flex; gap:4px; flex-wrap:wrap; align-items:center;}
  .topnav a{
    padding:7px 13px; border-radius:9px; font-size:13.5px; font-weight:600;
    color:var(--ink-soft); text-decoration:none; white-space:nowrap; transition:.15s;
  }
  .topnav a:hover{background:var(--accent-soft-2); color:var(--accent-dark);}
  .topnav a.active{background:var(--accent-soft); color:var(--accent-dark);}
  @media (max-width:1100px){ .topnav{order:3; width:100%;} }


  main{max-width:1280px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start;}
  @media (max-width:900px){ .grid2{grid-template-columns:1fr;} }
  .ctl{display:grid; grid-template-columns:2fr 1fr 1fr 2fr; gap:14px; align-items:end;}
  @media (max-width:900px){ .ctl{grid-template-columns:1fr 1fr;} }
  .hint{font-size:13px; color:var(--ink-soft);}
  .pick-tools{display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
  .pick-tools input{flex:1; min-width:160px;}
  .pick-list{max-height:460px; overflow:auto; border:1px solid var(--line); border-radius:12px;}
  .pick-row{display:flex; gap:10px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); cursor:pointer; font-size:14px;}
  .pick-row:last-child{border-bottom:none;}
  .pick-row:hover{background:var(--accent-soft-2);}
  .pick-row.sel{background:var(--accent-soft);}
  .pick-row input{width:16px; height:16px; accent-color:var(--accent);}
  .pick-row .nm{flex:1; min-width:0;}
  .pick-row .nm b{font-weight:600;}
  .pick-row .sm{font-size:12px; color:var(--ink-soft);}
  .sel-row{display:flex; gap:10px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); font-size:14px;}
  .sel-row:last-child{border-bottom:none;}
  .sel-row .nm{flex:1; min-width:0;}
  .sel-row .x{border:none; background:none; color:var(--ink-soft); cursor:pointer; font-size:18px; line-height:1; padding:2px 6px; border-radius:6px;}
  .sel-row .x:hover{background:var(--danger-soft); color:var(--danger);}
  .tag{display:inline-block; font-size:11.5px; padding:1px 8px; border-radius:99px; background:var(--warn-soft); color:var(--warn); margin-left:6px; white-space:nowrap;}
  .tag.bad{background:var(--danger-soft); color:var(--danger);}
  .tag.off{background:#EEF1F4; color:#6b7785;}
  .chips{display:flex; flex-wrap:wrap; gap:4px;}
  .chip{font-size:12px; background:var(--accent-soft-2); border:1px solid var(--line); border-radius:99px; padding:1px 9px;}
  .warn-card{border:1px solid #F1D9A8; background:var(--warn-soft); border-radius:12px; padding:12px 14px; margin-bottom:10px; font-size:14px;}
  .warn-card.bad{border-color:#EBC0C8; background:var(--danger-soft);}
  .warn-card h3{font-size:14px; margin-bottom:4px;}
  .warn-card ul{margin:4px 0 0; padding-left:18px;}
  .warn-card .hl{font-weight:600; color:var(--danger);}
  .btn-warn{background:var(--warn); color:#fff; border:none;}
  .btn-warn:hover{filter:brightness(.95);}
  .row-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:14px; align-items:center;}
  td.cancelled{color:#98a3b0; text-decoration:line-through;}
  /* ---------- modal ---------- */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(20,40,60,.35);
    backdrop-filter:blur(2px);
    align-items:flex-start;
    justify-content:center;
    padding:6vh 20px;
    z-index:100;
    overflow-y:auto;
  }
  .modal-overlay.open{display:flex;}
  .modal-card{
    width:100%;
    max-width:560px;
    background:var(--panel);
    border-radius:20px;
    box-shadow:0 20px 60px rgba(20,40,60,.25);
    padding:26px 28px 28px;
    animation:modal-in .18s ease-out;
  }
  .modal-card.narrow{max-width:440px;}
  @keyframes modal-in{
    from{opacity:0; transform:translateY(8px) scale(.98);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  .modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .modal-header h2{font-size:16px;}
  .modal-close{
    background:var(--accent-soft-2);
    border:none;
    width:30px; height:30px;
    border-radius:9px;
    color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:.15s;
    flex-shrink:0;
  }
  .modal-close:hover{background:var(--danger-soft); color:var(--danger);}
  .form-actions{display:flex; gap:10px; margin-top:24px;}
  .form-actions .btn{flex:1;}</style>
</head>
<body>
  <div id="login-screen">
    <div class="login-card">
      <div class="login-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
      <h1>เลือกพนักงานจากส่วนกลาง</h1>
      <p class="sub">เข้าสู่ระบบด้วยบัญชีของตนเอง</p>
      <div class="field"><label for="login-email">อีเมล</label><input id="login-email" type="email" autocomplete="username"></div>
      <div class="field"><label for="login-password">รหัสผ่าน</label><input id="login-password" type="password" autocomplete="current-password"></div>
      <button id="login-btn" class="btn btn-primary">เข้าสู่ระบบ</button>
      <p id="login-error" style="color:var(--danger); font-size:13px; margin-top:12px; display:none;"></p>
    </div>
  </div>

  <div id="status-banner"><div class="banner" id="banner-inner"></div></div>
  <div id="app">
    <header>
      <div class="brand">
        <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
        <h1>เลือกพนักงานจากส่วนกลาง</h1>
      </div>
      <div style="display:flex; align-items:center; gap:14px;">
        <span class="who" id="who-label"></span>
        <button class="btn-ghost" id="logout-btn">ออกจากระบบ</button>
      </div>
    </header>

    <main>
      <section class="panel">
        <div class="panel-head"><h2>1) แผนกปลายทางและช่วงเวลา</h2></div>
        <div class="ctl">
          <div class="field"><label for="f-dept">แผนกปลายทาง</label><select id="f-dept"></select></div>
          <div class="field"><label for="f-start">วันที่เริ่ม</label><input id="f-start" type="date"></div>
          <div class="field"><label for="f-end">วันที่สิ้นสุด</label><input id="f-end" type="date"></div>
          <div class="field"><label for="f-note">หมายเหตุ (ถ้ามี)</label><input id="f-note" type="text" maxlength="200"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>2) เลือกพนักงานจากส่วนกลางไปแผนกของท่าน</h2><span class="sub-note" id="pick-note"></span></div>
        <div class="grid2">
          <div>
            <div class="pick-tools">
              <input id="q" type="search" placeholder="ค้นหารหัส / ชื่อ / ตำแหน่ง">
              <select id="q-dept" style="max-width:220px"><option value="">ทุกแผนกต้นสังกัด</option></select>
            </div>
            <div class="pick-list" id="pick-list"></div>
            <p class="hint" id="pick-count" style="margin:8px 0 0"></p>
          </div>
          <div>
            <div class="panel-head" style="margin-bottom:8px"><h2 style="font-size:15px">ที่เลือกแล้ว <span id="sel-count">0</span> คน</h2></div>
            <div class="pick-list" id="sel-list"></div>
            <div class="row-actions">
              <button class="btn-ghost" id="clear-btn" type="button">ล้างที่เลือก</button>
              <button class="btn btn-primary" id="save-btn" type="button">บันทึกการกำหนด</button>
            </div>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>รายการที่กำหนดแล้ว</h2>
          <select id="h-dept" style="max-width:240px"><option value="">ทุกแผนก</option></select></div>
        <div style="overflow-x:auto"><table class="list" id="hist"><thead><tr>
          <th>#</th><th>แผนกปลายทาง</th><th>ช่วงเวลา</th><th>พนักงาน</th><th>ผู้บันทึก</th><th>สถานะ</th><th></th>
        </tr></thead><tbody id="hist-body"></tbody></table></div>
      </section>
    </main>
  </div>

  <div id="warn-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header"><h2 id="warn-title">แจ้งเตือน</h2>
        <button type="button" class="modal-close" id="warn-x" aria-label="ปิด"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
      <div id="warn-body"></div>
      <div class="form-actions">
        <button class="btn btn-ghost" id="warn-no" type="button" style="border:1px solid var(--line)"></button>
        <button class="btn btn-warn" id="warn-yes" type="button"></button>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ============================================================
  // โปรเจค hr-master (โปรเจคเดียวกับหน้าอื่น ๆ)
  // anon key ฝังในหน้าเว็บได้ เพราะ RLS เป็นตัวคุมสิทธิ์จริง
  // ห้ามใส่ service_role key ที่นี่เด็ดขาด
  // ============================================================

  const SUPABASE_URL = "https://ppzdyvomrfiitahxwrwz.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwemR5dm9tcmZpaXRhaHh3cnd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMjQ0MjIsImV4cCI6MjEwNDYwMDQyMn0.iArUz6swMfwhFT_1qEvCwK1B3aiCxdWt46_FBjT6_Y0";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ---------- เมนูนำทาง: ไฮไลต์หน้าปัจจุบัน และซ่อนเมนูเฉพาะ HR ถ้าไม่ใช่ HR ----------
  (function(){
    const here = decodeURIComponent(location.pathname.split('/').pop() || 'index.html');
    document.querySelectorAll('.topnav a').forEach(a => { if (a.getAttribute('href') === here) a.classList.add('active'); });
    let doneFor = null;
    sb.auth.onAuthStateChange((_e, session) => {
      if (!session || doneFor === session.user.id) return;
      doneFor = session.user.id;
      setTimeout(async () => {
        const { data, error } = await sb.rpc('is_hr_admin');
        if (error) return;                       // ยังไม่ได้รัน calendar.sql → ไม่ซ่อนเมนู
        document.querySelectorAll('.topnav [data-hr]').forEach(a => { a.style.display = data === true ? '' : 'none'; });
      }, 0);
    });
  })();

  const el = (id) => document.getElementById(id);
  const WEEKDAYS = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];

  function escapeHtml(s){
    return String(s ?? '').replace(/[&<>"']/g, c => (
      { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
    ));
  }
  function showBanner(message, isError=false){
    const wrap = el('status-banner');
    const inner = el('banner-inner');
    inner.textContent = message;
    inner.className = 'banner ' + (isError ? 'err' : 'ok');
    wrap.style.display = 'block';
    clearTimeout(showBanner._t);
    showBanner._t = setTimeout(() => wrap.style.display = 'none', isError ? 9000 : 3500);
  }
  const pad = (n) => String(n).padStart(2, '0');
  function parseISO(iso){ const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); }
  function toISO(d){ return d.toISOString().slice(0, 10); }
  function fmtThai(iso){
    return parseISO(iso).toLocaleDateString('th-TH', { day:'numeric', month:'short', year:'numeric', timeZone:'UTC' });
  }
  function daysBetween(start, end){
    const out = [];
    let d = parseISO(start);
    const last = parseISO(end);
    while (d <= last && out.length < 400) { out.push(toISO(d)); d = new Date(d.getTime() + 86400000); }
    return out;
  }
  function todayISO(){ return new Date().toLocaleDateString('sv-SE'); }
  function lastDayOfMonth(ym){ const [y, m] = ym.split('-').map(Number); return toISO(new Date(Date.UTC(y, m, 0))); }
  function fmtTime(t){ return String(t || '').slice(0, 5).replace(':', '.'); }

  // ตำแหน่งมีคำว่า "หัวหน้างาน" → ตารางหัวหน้างาน ที่เหลือทั้งหมด → ตารางพนักงาน (กติกาเดียวกับหน้า shift-schedule)
  function groupOf(emp){ return String(emp.position_name || '').includes('หัวหน้างาน') ? 'supervisor' : 'employee'; }
  const GROUP_LABEL = { employee: 'พนักงาน', supervisor: 'หัวหน้างาน' };

  // รหัสวันหยุดตามประเภทการจ้าง (รายเดือน/รายวัน)
  function offCodeFor(emp, shift){
    if (!shift) return null;
    if (emp.work_type === 'รายวัน') return shift.off_code_daily || shift.off_code_monthly;
    if (emp.work_type === 'รายเดือน') return shift.off_code_monthly;
    return null;
  }

  // ดึงข้อมูลทุกหน้า (PostgREST จำกัด 1,000 แถวต่อคำขอ)
  async function fetchAll(build){
    const pageSize = 1000;
    let from = 0, all = [];
    while (true) {
      const { data, error } = await build().range(from, from + pageSize - 1);
      if (error) throw error;
      all = all.concat(data);
      if (data.length < pageSize) break;
      from += pageSize;
    }
    return all;
  }

  // ---------------- AUTH ----------------
  async function doLogin(){
    const email = el('login-email').value.trim();
    const password = el('login-password').value;
    el('login-error').style.display = 'none';
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      el('login-error').textContent = 'เข้าสู่ระบบไม่สำเร็จ: ' + error.message;
      el('login-error').style.display = 'block';
    }
  }
  el('login-btn').addEventListener('click', doLogin);
  el('login-password').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
  el('logout-btn').addEventListener('click', async () => { await sb.auth.signOut(); });

  // supabase ยิง SIGNED_IN ซ้ำได้เมื่อสลับแท็บกลับมา กัน init() ซ้ำ
  // แสดงชื่อ-นามสกุลแทนอีเมล (ชื่อในบัญชี -> my_display_name() -> อีเมล) เอาเมาส์ชี้เพื่อดูอีเมล
  const whoCache = {};
  function showWho(session){
    const uid = session.user.id, email = session.user.email || '';
    const meta = session.user.user_metadata && session.user.user_metadata.full_name;
    el('who-label').title = email;
    el('who-label').textContent = whoCache[uid] || meta || email;
    if (meta || uid in whoCache) return;
    whoCache[uid] = '';
    setTimeout(async () => {
      try {
        const { data } = await sb.rpc('my_display_name');
        if (data) { whoCache[uid] = data; el('who-label').textContent = data; }
      } catch (e) { /* ยังไม่ได้รัน approval-names.sql: แสดงอีเมลต่อไป */ }
    }, 0);
  }

  let initializedFor = null;
  sb.auth.onAuthStateChange((_event, session) => {
    if (session) {
      el('login-screen').style.display = 'none';
      el('app').style.display = 'block';
      showWho(session);
      if (initializedFor !== session.user.id) {
        initializedFor = session.user.id;
        init(session);
      }
    } else {
      initializedFor = null;
      el('login-screen').style.display = 'flex';
      el('app').style.display = 'none';
    }
  });



  const DEPT_NAME = {};      // department_code -> ชื่อ
  let DIR = [];              // รายชื่อกลาง
  const SEL = new Map();     // employee_code -> { emp, loan, ack }
  let BUSY = false;

  function fmtRange(s, e){ return s === e ? fmtThai(s) : fmtThai(s) + ' – ' + fmtThai(e); }
  function deptLabel(c){ return c ? (c + ' ' + (DEPT_NAME[c] || '')).trim() : ''; }

  async function init(){
    try {
      const { data: ds, error } = await sb.rpc('assign_depts');
      if (error) throw error;
      ds.forEach(d => DEPT_NAME[d.department_code] = d.name);
      el('f-dept').innerHTML = '<option value="">— เลือกแผนก —</option>' +
        ds.map(d => `<option value="${escapeHtml(d.department_code)}">${escapeHtml(deptLabel(d.department_code))}</option>`).join('');
      el('h-dept').innerHTML = '<option value="">ทุกแผนก</option>' +
        ds.map(d => `<option value="${escapeHtml(d.department_code)}">${escapeHtml(deptLabel(d.department_code))}</option>`).join('');
      DIR = await fetchAll(() => sb.rpc('assign_directory'));
      const homes = [...new Map(DIR.map(e => [e.department_code, e.department_name])).entries()].sort();
      el('q-dept').innerHTML = '<option value="">ทุกแผนกต้นสังกัด</option>' +
        homes.map(([c, n]) => `<option value="${escapeHtml(c)}">${escapeHtml((c || '') + ' ' + (n || ''))}</option>`).join('');
      if (!ds.length) showBanner('บัญชีนี้ยังไม่มีสิทธิ์กำหนดพนักงานเข้าแผนกใด (ต้องเป็น HR / ธุรการ / ผู้จัดการแผนก)', true);
    } catch (e) {
      showBanner('โหลดข้อมูลไม่สำเร็จ (ตรวจว่ารัน assign.sql แล้ว): ' + (e.message || e), true);
    }
    const t = todayISO();
    if (!el('f-start').value) { el('f-start').value = t; el('f-end').value = t; }
    renderPick(); renderSel(); loadHist();
  }

  // ---------- รายชื่อกลาง ----------
  function renderPick(){
    const q = el('q').value.trim().toLowerCase(), hd = el('q-dept').value;
    const rows = DIR.filter(e => (!hd || e.department_code === hd) &&
      (!q || (e.employee_code + ' ' + e.full_name + ' ' + (e.position_name || '')).toLowerCase().includes(q)));
    const shown = rows.slice(0, 200);
    el('pick-list').innerHTML = shown.map(e => `
      <label class="pick-row ${SEL.has(e.employee_code) ? 'sel' : ''}" data-c="${escapeHtml(e.employee_code)}">
        <input type="checkbox" ${SEL.has(e.employee_code) ? 'checked' : ''}>
        <span class="nm"><b>${escapeHtml(e.full_name)}</b> <span class="sm">${escapeHtml(e.employee_code)}</span><br>
          <span class="sm">${escapeHtml(e.department_name || '')}${e.position_name ? ' · ' + escapeHtml(e.position_name) : ''}</span></span>
      </label>`).join('') || '<div class="empty-state" style="padding:22px">ไม่พบพนักงานในส่วนกลาง (ฝ่ายบุคคลต้องเพิ่มเข้าส่วนกลางก่อน)</div>';
    el('pick-count').textContent = rows.length > shown.length
      ? `แสดง ${shown.length} จาก ${rows.length} คน — พิมพ์ค้นหาเพื่อกรองเพิ่ม` : `${rows.length} คน`;
  }
  function renderSel(){
    el('sel-count').textContent = SEL.size;
    el('sel-list').innerHTML = [...SEL.values()].map(({ emp, loan, ack }) => `
      <div class="sel-row"><span class="nm"><b>${escapeHtml(emp.full_name)}</b> <span class="sm">${escapeHtml(emp.employee_code)}</span>
        ${loan ? '<span class="tag">อยู่ในระบบยืม</span>' : ''}<br><span class="sm">${escapeHtml(emp.department_name || '')}</span></span>
        <button class="x" data-rm="${escapeHtml(emp.employee_code)}" title="เอาออก">×</button></div>`).join('')
      || '<div class="empty-state" style="padding:22px">ยังไม่ได้เลือกพนักงาน</div>';
  }

  // ---------- modal ----------
  // ask({title, html, yes, no, canYes}) -> Promise<boolean>
  function ask({ title, html, yes, no, canYes = true }){
    return new Promise(resolve => {
      el('warn-title').textContent = title; el('warn-body').innerHTML = html;
      el('warn-yes').textContent = yes; el('warn-yes').style.display = canYes ? '' : 'none';
      el('warn-no').textContent = no;
      el('warn-modal').classList.add('open');
      const done = (v) => {
        el('warn-modal').classList.remove('open');
        el('warn-yes').onclick = el('warn-no').onclick = el('warn-x').onclick = null;
        resolve(v);
      };
      el('warn-yes').onclick = () => done(true);
      el('warn-no').onclick = () => done(false);
      el('warn-x').onclick = () => done(false);
    });
  }
  function warnHtml(list){
    return list.map(w => {
      const parts = [];
      if (w.loan) {
        const l = w.loan;
        parts.push(`<div class="warn-card"><h3>${escapeHtml(w.emp.full_name)} (${escapeHtml(w.emp.employee_code)})</h3>
          ${l.same_dept ? '<div class="hl">ถูกโอนย้ายมาแผนกปลายทางนี้แล้วในระบบยืมพนักงาน</div>'
                        : 'ถูกโอนย้ายไปแผนกอื่นแล้วในระบบยืมพนักงาน'}
          <ul>
            <li>แผนกต้นสังกัด: ${escapeHtml(l.home_dept_name || '-')}</li>
            <li>ปัจจุบันอยู่แผนก: <b>${escapeHtml(l.current_dept_name || '-')}</b></li>
            <li>เลขที่คำขอ: ${escapeHtml(l.request_no || '-')}</li>
            <li>ช่วงเวลา: ${l.start_date && l.end_date ? escapeHtml(fmtRange(l.start_date, l.end_date)) : '-'}
              ${l.overlaps ? '<span class="tag bad">ซ้อนกับช่วงที่เลือก</span>' : '<span class="tag off">ไม่ซ้อนกับช่วงที่เลือก</span>'}</li>
          </ul></div>`);
      }
      if (w.loanErr) parts.push(`<div class="warn-card"><h3>${escapeHtml(w.emp.full_name)}</h3>ตรวจระบบยืมพนักงานไม่สำเร็จ: ${escapeHtml(w.loanErr)}<br><span class="hint">ยืนยันเลือกต่อได้ แต่ควรตรวจสถานะการยืมด้วยตนเอง</span></div>`);
      (w.overlaps || []).forEach(o => parts.push(`<div class="warn-card bad"><h3>${escapeHtml(w.emp.full_name)} (${escapeHtml(w.emp.employee_code)})</h3>
        มีรายการกำหนดซ้อนช่วงเวลาในระบบนี้แล้ว: แผนก ${escapeHtml(deptLabel(o.dept_code))} ${escapeHtml(fmtRange(o.start_date, o.end_date))} (#${o.request_id})<br>
        <span class="hint">ไม่สามารถกำหนดซ้ำช่วงเวลาเดียวกันได้ — ปรับวันที่หรือยกเลิกรายการเดิมก่อน</span></div>`));
      return parts.join('');
    }).join('');
  }

  // ตรวจรายการพนักงาน -> [{emp, loan|null, loanErr, overlaps[]}] เฉพาะคนที่มีประเด็น
  async function checkEmployees(emps){
    const dept = el('f-dept').value, s = el('f-start').value, e = el('f-end').value;
    const codes = emps.map(x => x.employee_code);
    const [lc, ov] = await Promise.all([
      sb.functions.invoke('loan-check', { body: { codes, dept_code: dept, dept_name: DEPT_NAME[dept] || '', start_date: s, end_date: e } })
        .then(r => r.error ? { err: (r.error.message || 'เรียกฟังก์ชันไม่สำเร็จ') } : (r.data && r.data.error ? { err: r.data.error } : { items: r.data.items || [] }))
        .catch(x => ({ err: x.message || String(x) })),
      sb.rpc('assign_overlaps', { p_codes: codes, p_start: s, p_end: e })
    ]);
    const loanBy = new Map((lc.items || []).map(i => [i.employee_code, i]));
    const ovBy = {}; (ov.data || []).forEach(o => (ovBy[o.employee_code] ||= []).push(o));
    return emps.map(emp => ({ emp, loan: loanBy.get(emp.employee_code) || null, loanErr: lc.err || null, overlaps: ovBy[emp.employee_code] || [] }))
      .filter(w => w.loan || w.loanErr || w.overlaps.length);
  }
  function needSetup(){
    if (!el('f-dept').value) { showBanner('กรุณาเลือกแผนกปลายทางก่อน', true); return true; }
    const s = el('f-start').value, e = el('f-end').value;
    if (!s || !e || e < s) { showBanner('กรุณาระบุช่วงวันที่ให้ถูกต้อง', true); return true; }
    return false;
  }

  // เลือก/ยกเลิกพนักงานจากรายชื่อ
  async function toggle(code, checkbox){
    if (SEL.has(code)) { SEL.delete(code); renderPick(); renderSel(); return; }
    if (needSetup()) { checkbox.checked = false; return; }
    if (BUSY) { checkbox.checked = false; return; }
    BUSY = true;
    const emp = DIR.find(x => x.employee_code === code);
    let warn = [];
    try { warn = await checkEmployees([emp]); } catch (e) { showBanner('ตรวจสอบไม่สำเร็จ: ' + (e.message || e), true); }
    BUSY = false;
    let loan = null, ack = false;
    if (warn.length) {
      const hardBlock = warn[0].overlaps.length > 0;
      const ok = await ask({ title: 'พบข้อมูลที่ต้องตรวจสอบก่อนเลือก', html: warnHtml(warn),
        yes: 'เลือกต่อ', no: hardBlock ? 'ปิด (ไม่เลือก)' : 'ไม่เลือกคนนี้', canYes: !hardBlock });
      if (!ok) { renderPick(); return; }
      loan = warn[0].loan || null; ack = true;
    }
    SEL.set(code, { emp, loan, ack });
    renderPick(); renderSel();
  }

  el('pick-list').addEventListener('click', (ev) => {
    const row = ev.target.closest('.pick-row'); if (!row) return;
    ev.preventDefault();
    toggle(row.dataset.c, row.querySelector('input'));
  });
  el('sel-list').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-rm]'); if (!b) return;
    SEL.delete(b.dataset.rm); renderPick(); renderSel();
  });
  el('q').addEventListener('input', renderPick);
  el('q-dept').addEventListener('change', renderPick);
  el('clear-btn').addEventListener('click', () => { SEL.clear(); renderPick(); renderSel(); });
  // เปลี่ยนแผนก/ช่วงเวลา: ผลตรวจเดิมอาจไม่ตรงแล้ว จะตรวจซ้ำตอนบันทึก
  ['f-dept', 'f-start', 'f-end'].forEach(id => el(id).addEventListener('change', () => {
    if (SEL.size) showBanner('เปลี่ยนเงื่อนไขแล้ว ระบบจะตรวจพนักงานที่เลือกอีกครั้งตอนกดบันทึก');
  }));

  // ---------- บันทึก ----------
  el('save-btn').addEventListener('click', async () => {
    if (BUSY) return;
    if (needSetup()) return;
    if (!SEL.size) { showBanner('กรุณาเลือกพนักงานอย่างน้อย 1 คน', true); return; }
    BUSY = true; el('save-btn').disabled = true;
    try {
      const emps = [...SEL.values()].map(v => v.emp);
      const warn = await checkEmployees(emps);
      const hard = warn.filter(w => w.overlaps.length);
      if (warn.length) {
        const ok = await ask({ title: 'ตรวจสอบอีกครั้งก่อนบันทึก (' + warn.length + ' คน)', html: warnHtml(warn),
          yes: 'ยืนยันบันทึก', no: 'กลับไปแก้ไข', canYes: !hard.length });
        if (!ok) return;
      }
      const wBy = new Map(warn.map(w => [w.emp.employee_code, w]));
      const items = emps.map(e => ({ code: e.employee_code, loan: (wBy.get(e.employee_code) || {}).loan || null, ack: wBy.has(e.employee_code) }));
      const { error } = await sb.rpc('assign_create', { p_dept: el('f-dept').value, p_start: el('f-start').value,
        p_end: el('f-end').value, p_note: el('f-note').value, p_items: items });
      if (error) throw error;
      showBanner('บันทึกแล้ว ' + items.length + ' คน');
      SEL.clear(); el('f-note').value = ''; renderPick(); renderSel(); loadHist();
    } catch (e) { showBanner('บันทึกไม่สำเร็จ: ' + (e.message || e), true); }
    finally { BUSY = false; el('save-btn').disabled = false; }
  });

  // ---------- ประวัติ ----------
  async function loadHist(){
    const body = el('hist-body');
    let q = sb.from('assign_requests').select('*, assign_items(employee_code, full_name, loan_info)')
      .order('created_at', { ascending: false }).limit(200);
    if (el('h-dept').value) q = q.eq('dept_code', el('h-dept').value);
    const { data, error } = await q;
    if (error) { body.innerHTML = `<tr><td colspan="7" class="empty-state">${escapeHtml(error.message)}</td></tr>`; return; }
    body.innerHTML = data.map(r => {
      const off = r.status === 'cancelled';
      const chips = (r.assign_items || []).map(i => `<span class="chip" title="${escapeHtml(i.employee_code)}">${escapeHtml(i.full_name || i.employee_code)}${i.loan_info ? ' ⚠' : ''}</span>`).join('');
      return `<tr><td class="${off ? 'cancelled' : ''}">${r.id}</td>
        <td class="${off ? 'cancelled' : ''}">${escapeHtml(deptLabel(r.dept_code))}</td>
        <td class="nowrap ${off ? 'cancelled' : ''}">${escapeHtml(fmtRange(r.start_date, r.end_date))}</td>
        <td><div class="chips">${chips}</div>${r.note ? `<div class="hint">${escapeHtml(r.note)}</div>` : ''}</td>
        <td>${escapeHtml(r.created_by_name || r.created_by)}<div class="hint">${escapeHtml(fmtThai(r.created_at.slice(0, 10)))}</div></td>
        <td>${off ? '<span class="tag off">ยกเลิกแล้ว</span>' : '<span class="badge done">ใช้งาน</span>'}</td>
        <td>${off ? '' : `<button class="btn-ghost" data-cancel="${r.id}">ยกเลิก</button>`}</td></tr>`;
    }).join('') || '<tr><td colspan="7" class="empty-state">ยังไม่มีรายการ</td></tr>';
  }
  el('h-dept').addEventListener('change', loadHist);
  el('hist-body').addEventListener('click', async (ev) => {
    const b = ev.target.closest('[data-cancel]'); if (!b) return;
    const note = prompt('เหตุผลที่ยกเลิกรายการ #' + b.dataset.cancel + ' (ไม่บังคับ)');
    if (note === null) return;
    const { error } = await sb.rpc('assign_cancel', { p_id: Number(b.dataset.cancel), p_note: note });
    if (error) showBanner('ยกเลิกไม่สำเร็จ: ' + error.message, true); else { showBanner('ยกเลิกแล้ว'); loadHist(); }
  });
</script>
</body>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>รปภ. - ตรวจเลขไมล์รถ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
:root{--bg:#f3f1ea;--card:#fff;--ink:#1d2733;--mute:#66707c;--line:#d9d5c8;--gate:#f2b90f;--ok:#1f7a4d;--okbg:#dff2e6;--warn:#a05a00;--warnbg:#fff0d1;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#161a1f;--card:#212831;--ink:#eef0f2;--mute:#9aa4af;--line:#38424d;--okbg:#17372a;--ok:#6fd49b;--warnbg:#41300f;--warn:#f2b95a;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai',system-ui,sans-serif;font-size:16px;line-height:1.5}
header{background:var(--ink);color:var(--bg);padding:14px 16px;border-bottom:6px solid var(--gate)}
header h1{margin:0;font-size:1.15rem;font-weight:800}
.wrap{max-width:720px;margin:0 auto;padding:12px}
.datebar{display:flex;gap:8px;align-items:center;margin:8px 0}
.datebar button,.datebar input{height:48px;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-weight:600}
.datebar button{width:48px;font-size:1.3rem;cursor:pointer}
.datebar input{flex:1;padding:0 10px;text-align:center}
.summary{color:var(--mute);margin:4px 2px 12px}
.card{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card.done{border-left-color:var(--ok)}.card.half{border-left-color:var(--gate)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.plate{font-size:1.5rem;font-weight:800;letter-spacing:.02em}
.meta{color:var(--mute);font-size:.92rem}
.badge{font-size:.85rem;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap;background:var(--line);color:var(--ink)}
.badge.done{background:var(--okbg);color:var(--ok)}.badge.half{background:var(--warnbg);color:var(--warn)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media(max-width:480px){.slots{grid-template-columns:1fr}}
.slot{border:1px solid var(--line);border-radius:10px;padding:10px}
.slot h3{margin:0 0 6px;font-size:.95rem}
.val{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.val small{font-size:.8rem;font-weight:400;color:var(--mute)}
.pick{display:block;width:100%;height:52px;border:2px dashed var(--ink);border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-align:center;line-height:48px}
.pick input{display:none}
.entry{display:none;margin-top:8px}.entry.on{display:block}
.entry img{width:100%;max-height:140px;object-fit:contain;border-radius:8px;background:#000}
.entry input[type=text]{width:100%;height:52px;margin:8px 0;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);font:800 1.5rem 'Noto Sans Thai',sans-serif;text-align:center;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px}
.btn{flex:1;height:48px;border:0;border-radius:10px;font:inherit;font-weight:800;cursor:pointer}
.btn.go{background:var(--gate);color:#1d2733}.btn.no{background:var(--line);color:var(--ink);flex:0 0 90px}
.btn:disabled{opacity:.5}
.hint{font-size:.85rem;color:var(--mute);margin:0}
.err{color:var(--bad);font-size:.9rem;margin:4px 0 0}
.empty{text-align:center;color:var(--mute);padding:40px 12px}
dialog{border:0;border-radius:14px;padding:20px;background:var(--card);color:var(--ink);width:min(320px,92vw)}
dialog input{width:100%;height:48px;margin:10px 0;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;text-align:center;font-size:1.3rem}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--gate);outline-offset:2px}
</style>
</head>
<body>
<header><h1>รปภ. ตรวจเลขไมล์รถ</h1></header>
<div class="wrap">
  <div class="datebar">
    <button id="prev" aria-label="วันก่อนหน้า">‹</button>
    <input type="date" id="date">
    <button id="next" aria-label="วันถัดไป">›</button>
  </div>
  <div class="summary" id="summary">กำลังโหลด…</div>
  <div id="list"></div>
</div>

<dialog id="pinDlg">
  <form method="dialog" id="pinForm">
    <strong>กรอกรหัส รปภ.</strong>
    <input type="password" id="pin" inputmode="numeric" autocomplete="off">
    <button class="btn go" style="width:100%">เข้าใช้งาน</button>
  </form>
</dialog>

<script>
/* ===== ตั้งค่า: แก้ 2 ค่านี้ให้ตรงกับโปรเจกต์ ===== */
const SUPABASE_URL = 'https://clowvcraydxpvwdbpkhi.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsb3d2Y3JheWR4cHZ3ZGJwa2hpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NTA3NTAsImV4cCI6MjEwMzMyNjc1MH0.pXV0g3JfakqNRgKjgCe87Reie5ZhXzqYXpZ3OVkluHk';
/* ============================================== */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
let pin = sessionStorage.getItem('guard_pin') || '';
let rows = [];
let worker = null;

const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmt = n => n == null ? '' : Number(n).toLocaleString('th-TH');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const time = t => t ? new Date(t).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Bangkok'}) : '';

function shift(days){
  const d = new Date($('#date').value || new Date());
  d.setDate(d.getDate() + days);
  $('#date').value = iso(d);
  load();
}
$('#prev').onclick = () => shift(-1);
$('#next').onclick = () => shift(1);
$('#date').onchange = load;

async function ensurePin(){
  if (pin) return;
  $('#pinDlg').showModal();
  await new Promise(r => $('#pinForm').addEventListener('submit', r, {once:true}));
  pin = $('#pin').value.trim();
  try { sessionStorage.setItem('guard_pin', pin); } catch(e){}
}

async function load(){
  await ensurePin();
  $('#summary').textContent = 'กำลังโหลด…';
  const { data, error } = await sb.rpc('guard_list', { p_date: $('#date').value, p_pin: pin });
  if (error){
    if (/pin/i.test(error.message)){ pin=''; try{sessionStorage.removeItem('guard_pin')}catch(e){} return load(); }
    $('#summary').textContent = 'โหลดไม่สำเร็จ: ' + error.message; return;
  }
  rows = data || [];
  render();
}

function render(){
  const done = rows.filter(r => r.odometer_before != null && r.odometer_after != null).length;
  $('#summary').textContent = rows.length ? `สำเร็จ ${done} จาก ${rows.length} คัน` : '';
  if (!rows.length){ $('#list').innerHTML = '<div class="empty">วันนี้ไม่มีรถที่อนุมัติ (รถบรรทุก / กระบะ / รถยนต์)</div>'; return; }
  $('#list').innerHTML = rows.map(r => {
    const hasB = r.odometer_before != null, hasA = r.odometer_after != null;
    const st = hasB && hasA ? ['done','สำเร็จ'] : (hasB || hasA ? ['half','รอเลขไมล์'+(hasB?'หลัง':'ก่อน')] : ['','ยังไม่บันทึก']);
    return `<div class="card ${st[0]}" data-id="${r.id}">
      <div class="top"><div><div class="plate">${esc(r.car_name)}</div>
        <div class="meta">${esc(r.car_type)}<br>${esc(r.employee_name||'')}${r.department?' ('+esc(r.department)+')':''}<br>${esc(r.reason||'-')}<br>${time(r.start_at)}${r.end_at?' – '+time(r.end_at):''}</div></div>
        <span class="badge ${st[0]}">${st[1]}</span></div>
      <div class="slots">${slot(r,'before',hasB)}${slot(r,'after',hasA)}</div></div>`;
  }).join('');
}

function slot(r, kind, has){
  const label = kind === 'before' ? 'เลขไมล์ก่อนออก' : 'เลขไมล์หลังกลับ';
  const v = r['odometer_' + kind];
  if (has) return `<div class="slot"><h3>${label}</h3><div class="val">${fmt(v)} <small>กม.</small></div></div>`;
  const locked = kind === 'after' && r.odometer_before == null;
  if (locked) return `<div class="slot"><h3>${label}</h3><p class="hint">บันทึกเลขก่อนออกก่อน</p></div>`;
  return `<div class="slot" data-kind="${kind}"><h3>${label}</h3>
    <label class="pick">ถ่ายรูปเลขไมล์<input type="file" accept="image/*" capture="environment" onchange="onPhoto(this,'${r.id}','${kind}')"></label>
    <div class="entry"></div></div>`;
}

async function getWorker(){
  if (worker) return worker;
  worker = await Tesseract.createWorker('eng');
  await worker.setParameters({ tessedit_char_whitelist: '0123456789', tessedit_pageseg_mode: '7' });
  return worker;
}

function prep(file){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const w = Math.min(1000, img.width), h = img.height * w / img.width;
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.drawImage(img, 0, 0, w, h);
      const d = x.getImageData(0, 0, w, h), p = d.data;
      for (let i = 0; i < p.length; i += 4){
        let g = .299*p[i] + .587*p[i+1] + .114*p[i+2];
        g = Math.max(0, Math.min(255, (g - 128) * 1.6 + 128));
        p[i] = p[i+1] = p[i+2] = g;
      }
      x.putImageData(d, 0, 0);
      res({ canvas: c, url: URL.createObjectURL(file) });
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

async function onPhoto(input, id, kind){
  const file = input.files[0]; if (!file) return;
  const slotEl = input.closest('.slot'), entry = slotEl.querySelector('.entry');
  entry.className = 'entry on';
  entry.innerHTML = '<p class="hint">กำลังอ่านตัวเลข…</p>';
  let guess = '', url = '';
  try {
    const p = await prep(file); url = p.url;
    const w = await getWorker();
    const { data } = await w.recognize(p.canvas);
    const m = (data.text || '').match(/\d+/g);
    if (m) guess = m.sort((a,b) => b.length - a.length)[0];
  } catch(e){ console.error(e); }
  entry.innerHTML = `<img src="${url}" alt="รูปเลขไมล์">
    <input type="text" inputmode="numeric" maxlength="7" value="${guess}" aria-label="เลขไมล์">
    <p class="hint">${guess ? 'ตรวจเลขให้ตรงกับรูป แก้ได้ก่อนกดบันทึก' : 'อ่านเลขไม่ได้ พิมพ์เลขเอง หรือถ่ายใหม่'}</p>
    <p class="err" hidden></p>
    <div class="row"><button class="btn no" onclick="render()">ยกเลิก</button>
    <button class="btn go" onclick="save(this,'${id}','${kind}')">บันทึก</button></div>`;
}

async function save(btn, id, kind){
  const entry = btn.closest('.entry'), err = entry.querySelector('.err');
  const txt = entry.querySelector('input').value.replace(/\D/g, '');
  const r = rows.find(x => x.id == id);
  err.hidden = false;
  if (!txt){ err.textContent = 'กรอกเลขไมล์'; return; }
  const n = parseInt(txt, 10);
  if (kind === 'after' && r.odometer_before != null && n < r.odometer_before){
    err.textContent = `เลขหลังกลับต้องไม่น้อยกว่าเลขก่อนออก (${fmt(r.odometer_before)})`; return;
  }
  if (!confirm(`ยืนยันบันทึก ${fmt(n)} กม. ?\nบันทึกแล้วแก้ไขไม่ได้`)) return;
  btn.disabled = true;
  const { error } = await sb.rpc('guard_set_odometer', { p_id: id, p_kind: kind, p_value: n, p_pin: pin });
  if (error){ err.textContent = error.message; btn.disabled = false; return; }
  await load();
}

$('#date').value = iso(new Date());
load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>รปภ. - ตรวจเลขไมล์รถ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
:root{--bg:#eef6ff;--top:#d9ecff;--card:#fff;--ink:#12304f;--mute:#5f7791;--line:#dbe9f7;--edge:#9cc5ee;--gate:#1f8bf2;--ok:#1a7f55;--okbg:#ddf5e9;--warn:#a05a00;--warnbg:#fff1d6;--bad:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#0f1b2a;--top:#14304a;--card:#172a3f;--ink:#eaf3fc;--mute:#9bb2c9;--line:#2a4560;--edge:#3f6a93;--gate:#2f86e0;--ok:#6fd49b;--okbg:#17372a;--warn:#f2b95a;--warnbg:#41300f;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--top) 0,var(--bg) 300px) var(--bg);color:var(--ink);font-family:'Noto Sans Thai',system-ui,sans-serif;font-size:16px;line-height:1.5}
header{background:linear-gradient(135deg,#1f8bf2,#5bbcff);color:#fff;padding:16px}
header h1{margin:0;font-size:1.15rem;font-weight:800}
.wrap{width:100%;flex:1;max-width:720px;margin:0 auto;padding:12px}
.datebar{display:flex;gap:8px;align-items:center;margin:8px 0}
.datebar button,.datebar input{height:48px;border:2px solid var(--edge);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-weight:600}
.datebar button{width:48px;font-size:1.3rem;cursor:pointer}
.datebar input{flex:1;padding:0 10px;text-align:center}
.summary{color:var(--mute);margin:4px 2px 12px}
.card{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card.done{border-left-color:var(--ok)}.card.half{border-left-color:var(--gate)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.plate{font-size:1.5rem;font-weight:800;letter-spacing:.02em}
.meta{color:var(--mute);font-size:.92rem}
.badge{font-size:.85rem;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap;background:var(--line);color:var(--ink)}
.badge.done{background:var(--okbg);color:var(--ok)}.badge.half{background:var(--warnbg);color:var(--warn)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media(max-width:480px){.slots{grid-template-columns:1fr}}
.slot{border:1px solid var(--line);border-radius:10px;padding:10px}
.slot h3{margin:0 0 6px;font-size:.95rem}
.val{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.val small{font-size:.8rem;font-weight:400;color:var(--mute)}
.pick{display:block;width:100%;height:52px;border:2px dashed var(--edge);border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-align:center;line-height:48px}
.pick input{display:none}
.entry{display:none;margin-top:8px}.entry.on{display:block}
.entry img{width:100%;max-height:140px;object-fit:contain;border-radius:8px;background:#000}
.entry input[type=text]{width:100%;height:52px;margin:8px 0;border:2px solid var(--edge);border-radius:10px;background:var(--card);color:var(--ink);font:800 1.5rem 'Noto Sans Thai',sans-serif;text-align:center;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px}
.btn{flex:1;height:48px;border:0;border-radius:10px;font:inherit;font-weight:800;cursor:pointer}
.btn.go{background:var(--gate);color:#fff}.btn.no{background:var(--line);color:var(--ink);flex:0 0 90px}
.btn:disabled{opacity:.5}
.crop{width:100%;border-radius:8px;touch-action:none;background:#000;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{height:36px;padding:0 12px;border:1px solid var(--edge);border-radius:99px;background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.hint{font-size:.85rem;color:var(--mute);margin:0}
.err{color:var(--bad);font-size:.9rem;margin:4px 0 0}
.empty{text-align:center;color:var(--mute);padding:40px 12px}
dialog{border:0;border-radius:14px;padding:20px;background:var(--card);color:var(--ink);width:min(320px,92vw)}
dialog input{width:100%;height:48px;margin:10px 0;border:2px solid var(--edge);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;text-align:center;font-size:1.3rem}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--gate);outline-offset:2px}

.card,.row,.sum div,.scroll,.slot{box-shadow:0 2px 12px rgba(31,139,242,.09)}
header{box-shadow:0 4px 16px rgba(31,139,242,.25)}
footer{text-align:center;padding:16px 12px;color:var(--mute);font-size:.85rem;border-top:1px solid var(--line);background:var(--card)}

#cfm{border:0;border-radius:22px;padding:26px 22px 20px;background:var(--card);color:var(--ink);width:min(380px,92vw);text-align:center;box-shadow:0 20px 60px rgba(18,48,79,.35)}
#cfm::backdrop{background:rgba(18,48,79,.45);backdrop-filter:blur(3px)}
#cfm[open]{animation:cfIn .18s ease-out}
@keyframes cfIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.cf-ico{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:#e3f1ff;color:var(--gate)}
.cf-ico.danger{background:#fde8e8;color:var(--bad)}
.cf-ico svg{width:32px;height:32px}
#cfm h3{margin:0 0 6px;font-size:1.2rem;font-weight:800}
.cf-val{font-size:2.2rem;font-weight:800;color:var(--gate);font-variant-numeric:tabular-nums;line-height:1.2;margin:4px 0}
.cf-val.danger{color:var(--bad)}
.cf-val small{font-size:1rem;font-weight:600;color:var(--mute)}
#cfm p{margin:6px 0 0;color:var(--mute);font-size:.95rem;white-space:pre-line}
.cf-row{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.cf-row button{height:50px;border:0;border-radius:14px;font:inherit;font-weight:800;font-size:1rem;cursor:pointer}
.cf-ok{background:var(--gate);color:#fff}.cf-ok.danger{background:var(--bad)}
.cf-no{background:transparent;color:var(--mute)}
.cf-row button:focus-visible{outline:3px solid var(--gate);outline-offset:2px}
</style>
</head>
<body>
<header><h1>รปภ. ตรวจเลขไมล์รถ</h1></header>
<div class="wrap">
  <div class="datebar">
    <button id="prev" aria-label="วันก่อนหน้า">‹</button>
    <input type="date" id="date">
    <button id="next" aria-label="วันถัดไป">›</button>
  </div>
  <div class="summary" id="summary">กำลังโหลด…</div>
  <div id="list"></div>
</div>

<dialog id="cfm" aria-labelledby="cfTitle">
  <div class="cf-ico" id="cfIco"></div><h3 id="cfTitle"></h3><div class="cf-val" id="cfVal"></div><p id="cfBody"></p>
  <div class="cf-row"><button type="button" class="cf-ok" id="cfOk">ยืนยัน</button><button type="button" class="cf-no" id="cfNo">ยกเลิก</button></div>
</dialog>
<footer>ระบบการขอใช้รถบริษัท © 2026 | พัฒนาโดย Sarawut.C</footer>

<dialog id="pinDlg">
  <form method="dialog" id="pinForm">
    <strong>กรอกรหัส รปภ.</strong>
    <input type="password" id="pin" inputmode="numeric" autocomplete="off">
    <button class="btn go" style="width:100%">เข้าใช้งาน</button>
  </form>
</dialog>

<script>
/* ===== ตั้งค่า: แก้ 2 ค่านี้ให้ตรงกับโปรเจกต์ ===== */
const SUPABASE_URL = 'https://clowvcraydxpvwdbpkhi.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsb3d2Y3JheWR4cHZ3ZGJwa2hpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NTA3NTAsImV4cCI6MjEwMzMyNjc1MH0.pXV0g3JfakqNRgKjgCe87Reie5ZhXzqYXpZ3OVkluHk';
/* ============================================== */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const CF_ICO = {
  ask: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.5M12 16.5v.01"/></svg>',
  danger: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>'
};
function askConfirm({ title, val = '', unit = '', body = '', ok = 'ยืนยัน', cancel = 'ยกเลิก', danger = false }){
  return new Promise(res => {
    const d = $('#cfm');
    $('#cfIco').className = 'cf-ico' + (danger ? ' danger' : ''); $('#cfIco').innerHTML = CF_ICO[danger ? 'danger' : 'ask'];
    $('#cfTitle').textContent = title;
    $('#cfVal').className = 'cf-val' + (danger ? ' danger' : ''); $('#cfVal').innerHTML = val ? `${esc(val)} <small>${esc(unit)}</small>` : '';
    $('#cfVal').hidden = !val; $('#cfBody').textContent = body; $('#cfBody').hidden = !body;
    $('#cfOk').textContent = ok; $('#cfOk').className = 'cf-ok' + (danger ? ' danger' : '');
    $('#cfNo').textContent = cancel || ''; $('#cfNo').hidden = !cancel;
    const done = v => { d.close(); res(v); };
    $('#cfOk').onclick = () => done(true); $('#cfNo').onclick = () => done(false);
    d.oncancel = e => { e.preventDefault(); done(false); };
    d.showModal(); $('#cfOk').focus();
  });
}

let pin = sessionStorage.getItem('guard_pin') || '';
let rows = [];
let worker = null;

const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmt = n => n == null ? '' : Number(n).toLocaleString('th-TH');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const time = t => t ? new Date(t).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Bangkok'}) : '';

function shift(days){
  const d = new Date($('#date').value || new Date());
  d.setDate(d.getDate() + days);
  $('#date').value = iso(d);
  load();
}
$('#prev').onclick = () => shift(-1);
$('#next').onclick = () => shift(1);
$('#date').onchange = load;

async function ensurePin(){
  if (pin) return;
  $('#pinDlg').showModal();
  await new Promise(r => $('#pinForm').addEventListener('submit', r, {once:true}));
  pin = $('#pin').value.trim();
  try { sessionStorage.setItem('guard_pin', pin); } catch(e){}
}

async function load(){
  await ensurePin();
  $('#summary').textContent = 'กำลังโหลด…';
  const { data, error } = await sb.rpc('guard_list', { p_date: $('#date').value, p_pin: pin });
  if (error){
    if (/pin/i.test(error.message)){ pin=''; try{sessionStorage.removeItem('guard_pin')}catch(e){} return load(); }
    $('#summary').textContent = 'โหลดไม่สำเร็จ: ' + error.message; return;
  }
  rows = data || [];
  render();
}

function render(){
  const isDone = r => r.odometer_before != null && r.odometer_after != null;
  const pending = rows.filter(r => !isDone(r)), done = rows.length - pending.length;
  $('#summary').textContent = rows.length ? `สำเร็จ ${done} จาก ${rows.length} คัน · เหลือ ${pending.length} คัน` : '';
  if (!rows.length){ $('#list').innerHTML = '<div class="empty">วันนี้ไม่มีรถที่อนุมัติ (รถบรรทุก / กระบะ / รถตู้)</div>'; return; }
  if (!pending.length){ $('#list').innerHTML = '<div class="empty">ตรวจเลขไมล์ครบทุกคันแล้ว</div>'; return; }
  $('#list').innerHTML = pending.map(r => {
    const hasB = r.odometer_before != null, hasA = r.odometer_after != null;
    const st = hasB || hasA ? ['half','รอเลขไมล์'+(hasB?'หลัง':'ก่อน')] : ['','ยังไม่บันทึก'];
    return `<div class="card ${st[0]}" data-id="${r.id}">
      <div class="top"><div><div class="plate">${esc(r.car_name)}</div>
        <div class="meta">${esc(r.car_type)}<br>${esc(r.employee_name||'')}${r.department?' ('+esc(r.department)+')':''}<br>${esc(r.reason||'-')}<br>${time(r.start_at)}${r.end_at?' – '+time(r.end_at):''}</div></div>
        <span class="badge ${st[0]}">${st[1]}</span></div>
      <div class="slots">${slot(r,'before',hasB)}${slot(r,'after',hasA)}</div></div>`;
  }).join('');
}

function slot(r, kind, has){
  const label = kind === 'before' ? 'เลขไมล์ก่อนออก' : 'เลขไมล์หลังกลับ';
  const v = r['odometer_' + kind];
  if (has) return `<div class="slot"><h3>${label}</h3><div class="val">${fmt(v)} <small>กม.</small></div></div>`;
  const locked = kind === 'after' && r.odometer_before == null;
  if (locked) return `<div class="slot"><h3>${label}</h3><p class="hint">บันทึกเลขก่อนออกก่อน</p></div>`;
  return `<div class="slot" data-kind="${kind}"><h3>${label}</h3>
    <label class="pick">ถ่ายรูปเลขไมล์<input type="file" accept="image/*" capture="environment" onchange="onPhoto(this,'${r.id}','${kind}')"></label>
    <div class="entry"></div></div>`;
}

async function getWorker(){
  if (worker) return worker;
  worker = await Tesseract.createWorker('eng');
  await worker.setParameters({ tessedit_char_whitelist: '0123456789' });
  return worker;
}

function loadImg(file){
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i); i.onerror = rej;
    i.src = URL.createObjectURL(file);
  });
}

/* สร้างภาพจากกรอบที่เลือก: ขยายเป็นความสูง 160px เติมขอบขาว แล้วปรับเป็นขาวดำตามโหมด */
function variant(img, r, mode){
  const H = 160, sc = H / r.h, W = Math.min(1400, Math.round(r.w * sc)), pad = 24;
  const c = document.createElement('canvas'); c.width = W + pad*2; c.height = H + pad*2;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  x.drawImage(img, r.x, r.y, r.w, r.h, pad, pad, W, H);
  const d = x.getImageData(0, 0, c.width, c.height), p = d.data, n = p.length / 4, g = new Uint8Array(n), hist = new Array(256).fill(0);
  for (let i = 0; i < n; i++){ g[i] = .299*p[4*i] + .587*p[4*i+1] + .114*p[4*i+2]; hist[g[i]]++; }
  let lo = 0, hi = 255, acc = 0;
  for (let i = 0; i < 256; i++){ acc += hist[i]; if (acc > n*.02){ lo = i; break; } }
  acc = 0; for (let i = 255; i >= 0; i--){ acc += hist[i]; if (acc > n*.02){ hi = i; break; } }
  let th = 128;
  { let sum = 0; for (let i = 0; i < 256; i++) sum += i*hist[i];
    let wB = 0, sB = 0, best = 0;
    for (let t = 0; t < 256; t++){ wB += hist[t]; if (!wB) continue; const wF = n - wB; if (!wF) break;
      sB += t*hist[t]; const mB = sB/wB, mF = (sum - sB)/wF, v = wB*wF*(mB-mF)*(mB-mF);
      if (v > best){ best = v; th = t; } } }
  const inv = mode === 'inv' || mode === 'binInv', bin = mode === 'bin' || mode === 'binInv';
  for (let i = 0; i < n; i++){
    let v = bin ? (g[i] > th ? 255 : 0) : Math.max(0, Math.min(255, (g[i]-lo) * 255 / Math.max(1, hi-lo)));
    if (inv) v = 255 - v;
    p[4*i] = p[4*i+1] = p[4*i+2] = v; p[4*i+3] = 255;
  }
  x.putImageData(d, 0, 0);
  return c;
}

async function onPhoto(input, id, kind){
  const file = input.files[0]; if (!file) return;
  const entry = input.closest('.slot').querySelector('.entry');
  entry.className = 'entry on';
  let img;
  try { img = await loadImg(file); } catch(e){ entry.innerHTML = '<p class="err">เปิดรูปไม่ได้ ลองถ่ายใหม่</p>'; return; }
  entry.innerHTML = `<p class="hint">ลากกรอบให้ครอบเฉพาะตัวเลขไมล์ แล้วกด "อ่านเลข"</p>
    <canvas class="crop"></canvas>
    <div class="row" style="margin-top:8px"><button class="btn no" onclick="render()">ยกเลิก</button><button class="btn go">อ่านเลข</button></div>`;
  const cv = entry.querySelector('canvas'), ctx = cv.getContext('2d');
  const cw = Math.min(entry.clientWidth || 320, 640), k = cw / img.width;
  cv.width = cw; cv.height = Math.round(img.height * k);
  let box = { x: cw*.1, y: cv.height*.35, w: cw*.8, h: cv.height*.3 }, start = null;
  const draw = () => {
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(img, box.x/k, box.y/k, box.w/k, box.h/k, box.x, box.y, box.w, box.h);
    ctx.strokeStyle = '#f2b90f'; ctx.lineWidth = 3; ctx.strokeRect(box.x, box.y, box.w, box.h);
  };
  const pt = e => { const b = cv.getBoundingClientRect(); return { x: (e.clientX-b.left)*cv.width/b.width, y: (e.clientY-b.top)*cv.height/b.height }; };
  cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); start = pt(e); };
  cv.onpointermove = e => { if (!start) return; const q = pt(e);
    box = { x: Math.min(start.x, q.x), y: Math.min(start.y, q.y), w: Math.abs(q.x-start.x), h: Math.abs(q.y-start.y) }; draw(); };
  cv.onpointerup = () => { start = null; };
  draw();
  entry.querySelector('.go').onclick = () => readBox(entry, img, { x: box.x/k, y: box.y/k, w: box.w/k, h: box.h/k }, id, kind);
}

async function readBox(entry, img, r, id, kind){
  if (r.w < 10 || r.h < 10){ entry.querySelector('.hint').textContent = 'กรอบเล็กเกินไป ลากกรอบใหม่'; return; }
  entry.innerHTML = '<p class="hint" id="prog">กำลังโหลดตัวอ่านเลข…</p>';
  const votes = {}, preview = variant(img, r, 'norm').toDataURL('image/jpeg', .8);
  let failed = '';
  try {
    const w = await getWorker();
    const jobs = [['norm','7'],['bin','7'],['inv','7'],['binInv','7'],['norm','13'],['bin','6']];
    for (let i = 0; i < jobs.length; i++){
      $('#prog').textContent = `กำลังอ่านเลข… (${i+1}/${jobs.length})`;
      await w.setParameters({ tessedit_pageseg_mode: jobs[i][1] });
      const { data } = await w.recognize(variant(img, r, jobs[i][0]));
      const d = (data.text || '').replace(/\D/g, '');
      if (d.length >= 3 && d.length <= 7) votes[d] = (votes[d] || 0) + 1 + (data.confidence || 0) / 100;
    }
  } catch(e){ console.error(e); failed = 'โหลดตัวอ่านเลขไม่ได้ (' + (e.message || e) + ')'; }
  const ranked = Object.entries(votes).sort((a, b) => b[1] - a[1]).map(x => x[0]);
  const guess = ranked[0] || '';
  entry.innerHTML = `<img src="${preview}" alt="ส่วนที่อ่าน">
    <input type="text" inputmode="numeric" maxlength="7" value="${guess}" aria-label="เลขไมล์">
    ${ranked.length > 1 ? `<div class="chips">${ranked.slice(1, 4).map(c => `<button type="button" class="chip" onclick="this.closest('.entry').querySelector('input').value='${c}'">${c}</button>`).join('')}</div>` : ''}
    <p class="hint">${failed || (guess ? 'ตรวจเลขให้ตรงกับรูป แก้ได้ก่อนกดบันทึก' : 'อ่านเลขไม่ได้ พิมพ์เลขเอง หรือถ่ายใหม่แล้วครอบให้แคบลง')}</p>
    <p class="err" hidden></p>
    <div class="row"><button class="btn no" onclick="render()">ถ่ายใหม่</button>
    <button class="btn go" onclick="save(this,'${id}','${kind}')">บันทึก</button></div>`;
}

async function save(btn, id, kind){
  const entry = btn.closest('.entry'), err = entry.querySelector('.err');
  const txt = entry.querySelector('input').value.replace(/\D/g, '');
  const r = rows.find(x => x.id == id);
  err.hidden = false;
  if (!txt){ err.textContent = 'กรอกเลขไมล์'; return; }
  const n = parseInt(txt, 10);
  if (kind === 'after' && r.odometer_before != null && n < r.odometer_before){
    err.textContent = `เลขหลังกลับต้องไม่น้อยกว่าเลขก่อนออก (${fmt(r.odometer_before)})`; return;
  }
  if (!await askConfirm({ title: 'ยืนยันบันทึกเลขไมล์', val: fmt(n), unit: 'กม.',
    body: `${r.car_name}\n${kind === 'before' ? 'เลขไมล์ก่อนออก' : 'เลขไมล์หลังกลับ'} · บันทึกแล้วแก้ไขไม่ได้`, ok: 'ยืนยันบันทึก' })) return;
  btn.disabled = true;
  const { error } = await sb.rpc('guard_set_odometer', { p_id: id, p_kind: kind, p_value: n, p_pin: pin });
  if (error){ err.textContent = error.message; btn.disabled = false; return; }
  await load();
}

$('#date').value = iso(new Date());
load();
</script>
</body>
</html>

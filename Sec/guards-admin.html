<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>จัดการรายชื่อ รปภ.</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#eef6ff;--top:#d9ecff;--card:#fff;--ink:#12304f;--mute:#5f7791;--line:#dbe9f7;--edge:#9cc5ee;--gate:#1f8bf2;--ok:#1a7f55;--okbg:#ddf5e9;--warn:#a05a00;--warnbg:#fff1d6;--bad:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#0f1b2a;--top:#14304a;--card:#172a3f;--ink:#eaf3fc;--mute:#9bb2c9;--line:#2a4560;--edge:#3f6a93;--gate:#2f86e0;--ok:#6fd49b;--okbg:#17372a;--warn:#f2b95a;--warnbg:#41300f;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--top) 0,var(--bg) 300px) var(--bg);color:var(--ink);font-family:'Noto Sans Thai',system-ui,sans-serif;line-height:1.5}
header{background:linear-gradient(135deg,#1f8bf2,#5bbcff);color:#fff;padding:16px}
header h1{margin:0;font-size:1.15rem;font-weight:800}
.wrap{width:100%;flex:1;max-width:680px;margin:0 auto;padding:12px}
.bar{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px}
.btn{height:44px;padding:0 16px;border:0;border-radius:10px;font:inherit;font-weight:800;cursor:pointer;background:var(--gate);color:#fff}
.btn.sec{background:var(--line);color:var(--ink)}.btn.del{background:transparent;color:var(--bad);border:2px solid var(--bad)}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .who{flex:1;min-width:160px}.row .nm{font-weight:800}.row .meta{color:var(--mute);font-size:.9rem}
.row.off .nm{color:var(--mute);text-decoration:line-through}
.badge{font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--okbg);color:var(--ok)}
.badge.off{background:var(--line);color:var(--mute)}
.acts{display:flex;gap:8px}.acts .btn{height:40px;padding:0 12px}
dialog{border:0;border-radius:14px;padding:20px;background:var(--card);color:var(--ink);width:min(360px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-weight:600;margin-top:10px}
input[type=text],input[type=password]{width:100%;height:46px;margin-top:4px;border:2px solid var(--edge);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;padding:0 10px}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-weight:600}.chk input{width:20px;height:20px}
.err{color:var(--bad);min-height:1.4em;margin:8px 0 0;font-size:.92rem}
.foot{display:flex;gap:8px;margin-top:10px}.foot .btn{flex:1}
.empty{text-align:center;color:var(--mute);padding:30px}
button:focus-visible,input:focus-visible{outline:3px solid var(--gate);outline-offset:2px}

.card,.row,.sum div,.scroll,.slot{box-shadow:0 2px 12px rgba(31,139,242,.09)}
header{box-shadow:0 4px 16px rgba(31,139,242,.25)}
footer{text-align:center;padding:16px 12px;color:var(--mute);font-size:.85rem;border-top:1px solid var(--line);background:var(--card)}

#cfm{border:0;border-radius:22px;padding:26px 22px 20px;background:var(--card);color:var(--ink);width:min(380px,92vw);text-align:center;box-shadow:0 20px 60px rgba(18,48,79,.35)}
#cfm::backdrop{background:rgba(18,48,79,.45);backdrop-filter:blur(3px)}
#cfm[open]{animation:cfIn .18s ease-out}
@keyframes cfIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.cf-ico{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:#e3f1ff;color:var(--gate)}
.cf-ico.danger{background:#fde8e8;color:var(--bad)}
.cf-ico svg{width:32px;height:32px}
#cfm h3{margin:0 0 6px;font-size:1.2rem;font-weight:800}
.cf-val{font-size:2.2rem;font-weight:800;color:var(--gate);font-variant-numeric:tabular-nums;line-height:1.2;margin:4px 0}
.cf-val.danger{color:var(--bad)}
.cf-val small{font-size:1rem;font-weight:600;color:var(--mute)}
#cfm p{margin:6px 0 0;color:var(--mute);font-size:.95rem;white-space:pre-line}
.cf-row{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.cf-row button{height:50px;border:0;border-radius:14px;font:inherit;font-weight:800;font-size:1rem;cursor:pointer}
.cf-ok{background:var(--gate);color:#fff}.cf-ok.danger{background:var(--bad)}
.cf-no{background:transparent;color:var(--mute)}
.cf-row button:focus-visible{outline:3px solid var(--gate);outline-offset:2px}
</style>
</head>
<body>
<header><h1>จัดการรายชื่อ รปภ.</h1></header>
<div class="wrap">
  <div class="bar"><span id="count" style="color:var(--mute)"></span><button class="btn" id="add">เพิ่ม รปภ.</button></div>
  <div id="list"></div>
</div>

<dialog id="cfm" aria-labelledby="cfTitle">
  <div class="cf-ico" id="cfIco"></div><h3 id="cfTitle"></h3><div class="cf-val" id="cfVal"></div><p id="cfBody"></p>
  <div class="cf-row"><button type="button" class="cf-ok" id="cfOk">ยืนยัน</button><button type="button" class="cf-no" id="cfNo">ยกเลิก</button></div>
</dialog>
<footer>ระบบการขอใช้รถบริษัท © 2026 | พัฒนาโดย Sarawut.C</footer>

<dialog id="adminDlg">
  <form method="dialog" id="adminForm">
    <strong>กรอกรหัสผู้ดูแล</strong>
    <input type="password" id="adminPin" autocomplete="off" style="margin:10px 0">
    <p class="err" id="adminErr"></p>
    <button class="btn" style="width:100%">เข้าใช้งาน</button>
  </form>
</dialog>

<dialog id="editDlg">
  <form id="editForm" method="dialog">
    <strong id="editTitle"></strong>
    <label>ชื่อ-สกุล<input type="text" id="fName" required></label>
    <label>PIN เข้าใช้งาน (ตัวเลข 4-8 หลัก)<input type="text" id="fPin" inputmode="numeric" maxlength="8" pattern="[0-9]{4,8}" required></label>
    <label class="chk"><input type="checkbox" id="fActive" checked> เปิดใช้งาน</label>
    <p class="err" id="editErr"></p>
    <div class="foot"><button type="button" class="btn sec" id="cancel">ยกเลิก</button><button class="btn" id="saveBtn">บันทึก</button></div>
  </form>
</dialog>

<script>
/* ===== ตั้งค่า ===== */
const SUPABASE_URL = 'https://clowvcraydxpvwdbpkhi.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsb3d2Y3JheWR4cHZ3ZGJwa2hpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NTA3NTAsImV4cCI6MjEwMzMyNjc1MH0.pXV0g3JfakqNRgKjgCe87Reie5ZhXzqYXpZ3OVkluHk';
/* ================== */
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const CF_ICO = {
  ask: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.5M12 16.5v.01"/></svg>',
  danger: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>'
};
function askConfirm({ title, val = '', unit = '', body = '', ok = 'ยืนยัน', cancel = 'ยกเลิก', danger = false }){
  return new Promise(res => {
    const d = $('#cfm');
    $('#cfIco').className = 'cf-ico' + (danger ? ' danger' : ''); $('#cfIco').innerHTML = CF_ICO[danger ? 'danger' : 'ask'];
    $('#cfTitle').textContent = title;
    $('#cfVal').className = 'cf-val' + (danger ? ' danger' : ''); $('#cfVal').innerHTML = val ? `${esc(val)} <small>${esc(unit)}</small>` : '';
    $('#cfVal').hidden = !val; $('#cfBody').textContent = body; $('#cfBody').hidden = !body;
    $('#cfOk').textContent = ok; $('#cfOk').className = 'cf-ok' + (danger ? ' danger' : '');
    $('#cfNo').textContent = cancel || ''; $('#cfNo').hidden = !cancel;
    const done = v => { d.close(); res(v); };
    $('#cfOk').onclick = () => done(true); $('#cfNo').onclick = () => done(false);
    d.oncancel = e => { e.preventDefault(); done(false); };
    d.showModal(); $('#cfOk').focus();
  });
}
let admin = sessionStorage.getItem('admin_pin') || '', rows = [], editId = null;

async function askAdmin(msg){
  $('#adminErr').textContent = msg || '';
  $('#adminDlg').showModal();
  await new Promise(r => $('#adminForm').addEventListener('submit', r, {once:true}));
  admin = $('#adminPin').value.trim(); $('#adminPin').value = '';
}

async function load(msg){
  if (!admin) await askAdmin(msg);
  const { data, error } = await sb.rpc('guard_admin_list', { p_admin: admin });
  if (error){
    if (/admin pin/i.test(error.message)){ admin = ''; sessionStorage.removeItem('admin_pin'); return load('รหัสผู้ดูแลไม่ถูกต้อง'); }
    $('#list').innerHTML = `<div class="empty">โหลดไม่สำเร็จ: ${esc(error.message)}</div>`; return;
  }
  sessionStorage.setItem('admin_pin', admin);
  rows = data || [];
  $('#count').textContent = `${rows.length} คน`;
  $('#list').innerHTML = rows.length ? rows.map(g => `
    <div class="row ${g.active ? '' : 'off'}">
      <div class="who"><div class="nm">${esc(g.name)}</div><div class="meta">PIN ${esc(g.pin)}</div></div>
      <span class="badge ${g.active ? '' : 'off'}">${g.active ? 'ใช้งาน' : 'ปิดใช้งาน'}</span>
      <div class="acts"><button class="btn sec" onclick="openEdit('${g.id}')">แก้ไข</button>
      <button class="btn del" onclick="del('${g.id}')">ลบ</button></div>
    </div>`).join('') : '<div class="empty">ยังไม่มี รปภ. กด "เพิ่ม รปภ." เพื่อเริ่มต้น</div>';
}

function openEdit(id){
  editId = id; const g = rows.find(x => x.id === id);
  $('#editTitle').textContent = g ? 'แก้ไข รปภ.' : 'เพิ่ม รปภ.';
  $('#fName').value = g ? g.name : ''; $('#fPin').value = g ? g.pin : '';
  $('#fActive').checked = g ? g.active : true; $('#editErr').textContent = '';
  $('#editDlg').showModal();
}
$('#add').onclick = () => openEdit(null);
$('#cancel').onclick = () => $('#editDlg').close();

$('#editForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('#saveBtn').disabled = true;
  const { error } = await sb.rpc('guard_admin_save', {
    p_admin: admin, p_id: editId, p_name: $('#fName').value, p_pin: $('#fPin').value, p_active: $('#fActive').checked });
  $('#saveBtn').disabled = false;
  if (error){ $('#editErr').textContent = error.message; return; }
  $('#editDlg').close(); load();
});

async function del(id){
  const g = rows.find(x => x.id === id);
  if (!await askConfirm({ title: 'ลบรายชื่อ รปภ.', val: g.name, body: 'ประวัติเลขไมล์ที่เคยบันทึกไว้ยังอยู่\nแต่ PIN นี้จะเข้าใช้งานไม่ได้', ok: 'ลบ', danger: true })) return;
  const { error } = await sb.rpc('guard_admin_delete', { p_admin: admin, p_id: id });
  if (error){ await askConfirm({ title: 'ลบไม่สำเร็จ', body: error.message, ok: 'ตกลง', cancel: null, danger: true }); return; }
  load();
}
load();
</script>
</body>
</html>
